services:
  datasources:
    build:
      context: ./dataSources
    env_file:
      - ./dataSources/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  marktradar:
    build:
      context: ./marktRadar
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_SOURCES_URL: http://datasources:8001
    ports:
      - "8000:8000"
    depends_on:
      - datasources
    restart: unless-stopped
