   No box, no own palette, no glow (feedback: "NO BOX IN A BOX IN A BOX"). */
.scope { background: none; color: var(--color-text); }

/* ==========================================================================
   2. BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--color-text-link); text-underline-offset: 0.15em; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 1rem; top: 0.5rem; z-index: 600; transform: translateY(-200%);
  padding: 0.5rem 1rem; border-radius: var(--radius-sm);
  background: var(--color-accent); color: var(--color-accent-fg); font-weight: 600; text-decoration: none;
}
.skip-link:focus { transform: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--color-text-subtle); }
.small { font-size: var(--text-sm); }
.xs { font-size: var(--text-xs); }
.eyebrow {
  color: var(--color-text-link); font-size: var(--text-xs); font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.stack > * + * { margin-top: var(--gap, 1rem); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.spacer { flex: 1; }

/* ==========================================================================
   3. SHELL (header, navigation, main) – mirrors Spark's AppShell
   ========================================================================== */
.app-header {
  position: sticky; top: 0; z-index: 300;
  display: flex; align-items: center; gap: 1rem;
  min-height: var(--size-header);
  padding: 0 1rem; padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--color-surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--color-border-subtle);
}
@media (min-width: 40rem) { .app-header { padding-inline: 1.5rem; gap: 1.5rem; } }
.wordmark { display: inline-flex; align-items: center; gap: 0.75rem; color: var(--color-text); text-decoration: none; flex: none; }
.wordmark img { height: 1.5rem; width: auto; }
.wordmark span { font-weight: 600; letter-spacing: var(--tracking-display); font-size: var(--text-md); }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark { display: block; }
}
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: block; }

.main-nav ul { display: flex; gap: 0.25rem; list-style: none; }
.main-nav a {
  position: relative; display: flex; align-items: center; gap: 0.5rem;
  min-height: var(--control-md); padding: 0 0.75rem; border-radius: var(--radius-sm);
  color: var(--color-text-muted); font-weight: 500; text-decoration: none;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.main-nav a:hover { background: var(--color-surface-hover); color: var(--color-text); }
.main-nav a[aria-current="page"] { background: var(--color-accent-subtle); color: var(--color-text); }
.nav-count {
  min-width: 1.25rem; padding: 0 0.375rem; border-radius: var(--radius-sm);
  background: var(--color-accent); color: var(--color-accent-fg);
  font-size: var(--text-2xs); font-weight: 600; line-height: 1.25rem; text-align: center;
}
.header-tools { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
.mode-badge { white-space: nowrap; }
/* Narrow screens: the three main views move into a second row (no hidden drawer needed for three items). */
@media (max-width: 47.99rem) {
  .app-header { flex-wrap: wrap; row-gap: 0; }
  .main-nav { order: 3; width: 100%; margin-inline: -0.25rem; padding-bottom: 0.375rem; overflow-x: auto; }
  .mode-badge .label-long { display: none; }
}
@media (min-width: 48rem) { .mode-badge .label-short { display: none; } }

.app-main {
  container: main / inline-size; /* views lay out by their own width, so they also work next to the docked detail */
  width: 100%; max-width: var(--container-work); margin: 0 auto;
  padding: 1.5rem 1rem calc(3rem + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 40rem) { .app-main { padding-inline: 1.5rem; padding-top: 2rem; } }

/* ==========================================================================
   4. COMPONENTS (Spark look: one surface, one line, no shadow)
   ========================================================================== */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: var(--control-md); padding: 0 1rem; max-width: 100%;
  border: 1px solid var(--color-control-border); border-radius: var(--radius-sm);
  background: var(--color-surface); color: var(--color-text);
  font-size: var(--text-sm); font-weight: 500; line-height: 1.15; text-decoration: none; cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard),
              color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard);
}
.btn:not(:disabled):hover { background: var(--color-surface-hover); }
.btn:not(:disabled):active { transform: scale(0.97); }
.btn:disabled { cursor: not-allowed; opacity: 0.55; }
.btn--primary { border-color: transparent; background: var(--color-accent); color: var(--color-accent-fg); font-weight: 600; }
.btn--primary:not(:disabled):hover { background: var(--color-accent-hover); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--color-text-muted); }
.btn--ghost:not(:disabled):hover { color: var(--color-text); }
.btn--sm { min-height: var(--control-sm); padding: 0 0.75rem; font-size: var(--text-xs); border-radius: var(--radius-xs); }
.btn--icon { padding: 0; width: var(--control-md); }
.btn--icon.btn--sm { width: var(--control-sm); }
.btn[aria-pressed="true"] { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
.icon { display: inline-block; vertical-align: -0.25em; width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.badge {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.0625rem 0.625rem; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-sm);
  background: var(--color-bg-subtle); color: var(--color-text-muted);
  font-size: var(--text-xs); font-weight: 500; line-height: 1.5; white-space: nowrap;
}
.badge--accent { border-color: var(--color-accent-border); background: var(--color-accent-subtle); color: var(--color-text); }
.badge--success { border-color: transparent; background: var(--color-success-subtle); color: var(--color-success-text); }
.badge--warning { border-color: transparent; background: var(--color-warning-subtle); color: var(--color-warning-text); }
.badge--danger { border-color: transparent; background: var(--color-danger-subtle); color: var(--color-danger-text); }
/* Marker for demo/empty state: neutral and dashed. Amber means "Prüfen" on this page, so it must not be used for it. */
.badge--demo { border-style: dashed; border-color: var(--color-border); background: transparent; color: var(--color-text-muted); }
.badge--new { border-color: var(--color-accent-border); background: var(--color-accent-subtle); color: var(--color-text); font-weight: 600; }
.badge--new .icon, .badge .icon { width: 0.8125rem; height: 0.8125rem; }

/* Building blocks as icons (products at a glance) */
.bb-icons { display: inline-flex; flex-wrap: wrap; gap: 0.25rem; vertical-align: middle; }
.bb-icon {
  display: inline-flex; align-items: center; gap: 0.25rem; min-width: 1.5rem; height: 1.5rem; padding: 0 0.3125rem;
  border-radius: var(--radius-xs); background: var(--color-bg-subtle); color: var(--color-text-muted); font-size: var(--text-xs); font-weight: 500;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.bb-icon .icon { width: 0.875rem; height: 0.875rem; }
.bb-icon.is-lit { background: var(--color-accent-subtle); color: var(--color-text); box-shadow: inset 0 0 0 1px var(--color-accent-border); }

/* Ring change as words with colored dots: "Prüfen → Handeln" */
.move-label { display: inline-flex; align-items: center; gap: 0.3125rem; font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); white-space: nowrap; }
.move-label > span { display: inline-flex; align-items: center; gap: 0.3125rem; }
.move-label > span::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--c); }
.move-label .icon { width: 0.875rem; height: 0.875rem; color: var(--color-text-subtle); }

/* Display numbers (KPIs, counts): condensed face, tabular */
.display-num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; line-height: 1; }

/* Focus dimming helper: components add .is-dimmed to things outside the current focus */
.is-dimmed { opacity: var(--dim); transition: opacity var(--duration-normal) var(--ease-standard); }

.card {
  border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg);
  background: var(--color-surface); padding: 1.25rem;
}
@media (min-width: 40rem) { .card { padding: 1.5rem; } }
.card--tight { padding: 1rem; }

.alert {
  display: flex; gap: 0.75rem; align-items: flex-start;
  padding: 0.875rem 1rem; border: 1px solid var(--color-accent-border); border-radius: var(--radius-md);
  background: var(--color-info-subtle); color: var(--color-info-text); font-size: var(--text-sm);
}
.alert--warning { border-color: var(--color-warning); background: var(--color-warning-subtle); color: var(--color-warning-text); }
.alert .icon { margin-top: 0.125rem; }
.alert a { color: inherit; font-weight: 600; }

.page-header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 2rem; margin-bottom: 1.5rem; }
.page-header h1 { font-size: var(--text-2xl); font-weight: 600; letter-spacing: var(--tracking-display); }
.page-header p { color: var(--color-text-subtle); margin-top: 0.375rem; max-width: 60ch; }
.section-title { font-size: var(--text-lg); font-weight: 600; letter-spacing: var(--tracking-display); }

/* Segmented control (Spark ThemeChoice pattern), used for Sicht and Darstellung */
.segmented { display: inline-flex; padding: 0.1875rem; gap: 0.125rem; border: 1px solid var(--color-control-border); border-radius: var(--radius-sm); background: var(--color-surface); }
.segmented label { position: relative; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span {
  display: flex; align-items: center; gap: 0.375rem; min-height: calc(var(--control-sm) + 0.25rem); padding: 0 0.75rem;
  border-radius: var(--radius-xs); color: var(--color-text-muted); font-size: var(--text-xs); font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.segmented span:hover { background: var(--color-surface-hover); }
.segmented input:checked + span { background: var(--color-accent); color: var(--color-accent-fg); }
.segmented input:focus-visible + span { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

.field { display: grid; gap: 0.375rem; }
.field > span { font-size: var(--text-xs); font-weight: 500; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-text-subtle); }
.input, .select, textarea.input {
  min-height: var(--control-md); padding: 0 0.75rem; border: 1px solid var(--color-control-border); border-radius: var(--radius-sm);
  background: var(--color-surface); color: var(--color-text); font-size: var(--text-sm); width: 100%;
}
textarea.input { padding: 0.625rem 0.75rem; min-height: 5rem; resize: vertical; }
.input--search { padding-left: 2.25rem; background-image: none; }
.search-wrap { position: relative; }
.search-wrap .icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--color-text-subtle); pointer-events: none; }

.chip {
  display: inline-flex; align-items: center; gap: 0.25rem; min-height: 1.75rem; padding: 0 0.25rem 0 0.75rem;
  border: 1px solid var(--color-accent-border); border-radius: var(--radius-sm); background: var(--color-accent-subtle);
  font-size: var(--text-xs); font-weight: 500;
}
.chip button { display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; color: var(--color-text-muted); }
.chip button:hover { background: var(--color-surface-hover); color: var(--color-text); }
.tag { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.125rem 0.5rem; border-radius: var(--radius-xs); background: var(--color-bg-subtle); color: var(--color-text-muted); font-size: var(--text-xs); font-weight: 500; }
button.tag { border: 0; cursor: pointer; } button.tag:hover { background: var(--color-surface-hover); color: var(--color-text); }

/* Urgency dot + word: the radar ring as a reusable label */
.ring-label { display: inline-flex; align-items: center; gap: 0.4375rem; font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); white-space: nowrap; }
.ring-dot { width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--c, var(--unrated)); flex: none; }
.ring-dot.is-open { background: transparent; box-shadow: inset 0 0 0 2px var(--unrated); }
[data-ring="handeln"] { --c: var(--urgent); }
[data-ring="pruefen"] { --c: var(--check); }
[data-ring="beobachten"] { --c: var(--watch); }
[data-ring="offen"] { --c: var(--unrated); }

/* Confidence: three steps, as in Lichtblick (niedrig / mittel / hoch) */
.conf { display: inline-flex; align-items: center; gap: 0.4375rem; font-size: var(--text-xs); color: var(--color-text-muted); white-space: nowrap; }
.conf-bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.conf-bars i { width: 3px; border-radius: 1px; background: var(--color-border-subtle); }
.conf-bars i:nth-child(1) { height: 6px; } .conf-bars i:nth-child(2) { height: 9px; } .conf-bars i:nth-child(3) { height: 12px; }
.conf-bars i.on { background: var(--color-text-muted); }

/* Feedback: ONE compact segmented control with three clicks (counts for the team) */
.fb { display: inline-flex; max-width: 100%; padding: 2px; gap: 2px; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-sm); background: var(--color-bg-subtle); }
.fb button {
  display: inline-flex; align-items: center; gap: 0.375rem; min-height: var(--control-sm); padding: 0 0.75rem;
  border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-text-muted);
  font: inherit; font-size: var(--text-xs); font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.fb button .icon { width: 0.875rem; height: 0.875rem; }
.fb button:hover { background: var(--color-surface); color: var(--color-text); }
.fb button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-1); font-weight: 600; }
.fb--sm button span { display: none; }
.fb--sm button { padding: 0 0.625rem; }
@media (hover: none) { .fb--sm button span { display: inline; } }

/* Popover (menu, filter) */
.popover {
  position: absolute; z-index: 470; top: calc(100% + 0.5rem); right: 0; width: min(20rem, calc(100vw - 2rem));
  padding: 1rem; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg);
  background: var(--color-surface-raised); box-shadow: var(--shadow-raised);
  transform-origin: top right; animation: pop-in var(--duration-normal) var(--ease-standard);
}
.popover--left { right: auto; left: 0; transform-origin: top left; }
.menu-list { display: grid; gap: 0.125rem; list-style: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--color-hairline); }
.menu-list a {
  display: flex; align-items: center; gap: 0.75rem; min-height: var(--control-md); padding: 0 0.75rem; border-radius: var(--radius-sm);
  color: var(--color-text-muted); text-decoration: none; font-size: var(--text-sm); font-weight: 500;
}
.menu-list a:hover, .menu-list a[aria-current="page"] { background: var(--color-surface-hover); color: var(--color-text); }
.menu-list small { margin-left: auto; color: var(--color-text-subtle); font-weight: 400; }
.legend-title { font-size: var(--text-xs); font-weight: 500; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-text-subtle); margin-bottom: 0.5rem; }

/* Toasts */
.toasts { position: fixed; z-index: 550; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 0.5rem; width: min(30rem, calc(100vw - 2rem)); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.75rem 0.75rem 1rem; border-radius: var(--radius-md);
  background: var(--color-accent); color: var(--color-accent-fg); box-shadow: var(--shadow-raised); font-size: var(--text-sm);
  pointer-events: auto; animation: toast-in var(--duration-slow) var(--ease-standard);
}
:root[data-theme="dark"] .toast { background: var(--color-surface-raised); color: var(--color-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: var(--color-surface-raised); color: var(--color-text); } }
.toast.is-leaving { animation: toast-out var(--duration-normal) var(--ease-standard) forwards; }
.toast button { margin-left: auto; border: 0; background: transparent; color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; min-height: 2rem; }

/* Tables (with labelled scroll region on narrow screens) */
.table-wrap { overflow-x: auto; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-surface); }
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
th, td { padding: 0.625rem 0.875rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--color-hairline); }
th { font-size: var(--text-xs); font-weight: 500; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-text-subtle); white-space: nowrap; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; display: inline-flex; gap: 0.25rem; align-items: center; }
th button:hover { color: var(--color-text); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--color-bg-subtle); }
td a { font-weight: 500; }

/* 5-step value bar (detail view only, per feedback) */
.steps { display: inline-flex; gap: 2px; vertical-align: middle; }
.steps i { width: 1rem; height: 0.375rem; border-radius: 2px; background: var(--color-border-subtle); }
.steps i.on { background: var(--color-text-muted); }
.steps.is-empty i { background: transparent; box-shadow: inset 0 0 0 1px var(--color-border-subtle); }

/* Meter (forecast probability) */
.meter { position: relative; height: 0.5rem; border-radius: var(--radius-sm); background: var(--color-accent-subtle); overflow: hidden; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--color-text-link); transform-origin: left; animation: grow var(--duration-slow) var(--ease-standard) both; }

/* Thin segmented bar (product tiles: handeln / prüfen / beobachten) */
.segbar { display: flex; gap: 2px; height: 0.5rem; }
.segbar i { border-radius: var(--radius-sm); background: var(--c); min-width: 0.5rem; transform-origin: left; animation: grow var(--duration-slow) var(--ease-standard) both; }
.segbar i.empty { flex: 1; background: var(--color-bg-subtle); }

/* ==========================================================================
   6. MOTION – brief, purposeful, off for reduced motion (tokens are zeroed)
   ========================================================================== */
.view-enter > * { animation: rise 220ms var(--ease-out) both; } /* one quick step, no stagger: content must be readable at once */
.stagger > * { animation: rise 220ms var(--ease-out) both; animation-delay: min(calc(var(--i, 0) * 20ms), 120ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes swap-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
@keyframes pop-in { from { opacity: 0; transform: scale(0.97) translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes dot-in { from { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } to { transform: scale(1); } }
@keyframes pulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes grow-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 220ms; animation-timing-function: var(--ease-standard); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .radar .draw, .radar .trail { stroke-dashoffset: 0; }
}
@media (forced-colors: active) {
  .ring-dot, .radar .dot .mark { forced-color-adjust: none; }
}
@media print {
  .app-header, .toolbar, .fb, .panel-head .btn, .toasts { display: none !important; }
  .panel { position: static; transform: none; visibility: visible; box-shadow: none; border: 0; width: auto; }
}

.task-act { justify-self: end; }

/* ==========================================================================

/* --- Dots ----------------------------------------------------------------------- */

.radar.has-focus .dot:not(.is-hot) { opacity: var(--dim); }
.radar.has-focus .dot.is-selected:not(.is-hot) { opacity: 0.5; }
.radar .dot.is-leaving { opacity: 0; pointer-events: none; }
.radar .dot.is-entering .rd-body { animation: rd-dot-in 180ms var(--ease-out) both; animation-delay: var(--delay, 0ms); }
.radar .pulse { fill: none; stroke: var(--c); stroke-width: calc(2px * var(--rd-k)); opacity: 0; transform-box: fill-box; transform-origin: center; }
.radar .dot.is-ping .pulse { animation: pulse 900ms var(--ease-out) 1 both; }
.radar .dot.is-lit .mark { animation: rd-lit 420ms var(--ease-out) 1; }

/* --- Trails (where a dot was last week) ----------------------------------------- */
.radar .rd-trail { transition: opacity var(--duration-normal) var(--ease-standard); pointer-events: none; }
.radar .trail { fill: none; stroke-width: calc(1.5px * var(--rd-k)); stroke-linecap: round; }
.radar .rd-stop-a { stop-color: var(--from); stop-opacity: 0.1; }
.radar .rd-stop-b { stop-color: var(--c); stop-opacity: 0.55; }
.radar .rd-trail-from { fill: none; stroke: var(--from); stroke-width: calc(1.25px * var(--rd-k)); stroke-dasharray: calc(2px * var(--rd-k)) calc(2px * var(--rd-k)); opacity: 0.6; }
.radar.has-focus .rd-trail:not(.is-hot) { opacity: var(--dim); }
.radar .is-drawing .trail { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1100ms var(--ease-out) forwards; }

/* --- Sweep: one short, faint beam rotation (1 s), never looping ----------------- */
.rd-beam {
  position: absolute; left: 50%; top: 50%; width: 66%; aspect-ratio: 1; border-radius: 50%;
  translate: -50% -50%; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: conic-gradient(from 0deg, transparent 0turn, transparent 0.86turn, color-mix(in srgb, var(--color-accent) 12%, transparent) 0.995turn, color-mix(in srgb, var(--color-accent) 30%, transparent) 1turn);
}
.rd-beam.is-on { animation: rd-sweep 1000ms var(--ease-standard) 1 both; }

@keyframes rd-sweep { 0% { opacity: 0; rotate: 0deg; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; rotate: 360deg; } }
@keyframes rd-dot-in { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
@keyframes rd-lit { 0% { filter: brightness(1.35); } 100% { filter: none; } }

/* --- Legend (#ov-key): the four ring words with dots; the rest is in the tooltip ---- */
.rd-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 0.125rem 0.75rem; font-size: var(--text-xs); color: var(--color-text-muted); cursor: help; }
.rd-key {
  display: inline-flex; align-items: center; gap: 0.4375rem; min-height: 1.75rem; padding: 0 0.375rem; margin: 0 -0.375rem;
  border-radius: var(--radius-xs); font-weight: 500; white-space: nowrap;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.rd-key[data-hot-ring]:hover, .rd-key[data-hot-ring]:focus-visible { background: var(--color-surface-hover); color: var(--color-text); }
.rd-key-dot { width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--c); flex: none; }
.rd-key-dot.is-open { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.rd-legend--compact .rd-key { gap: 0.3125rem; min-height: 1.75rem; }
.rd-legend--compact .rd-key-dot { width: 0.5rem; height: 0.5rem; }
@media (pointer: coarse) { .rd-key { min-height: 2.75rem; } }

@media (prefers-reduced-motion: reduce) { .rd-beam { display: none; } }
@media (forced-colors: active) { .radar .dot .mark, .rd-key-dot { forced-color-adjust: none; } }

/* Selection (detail open): one dot stands out, the rest steps back, its segment is tinted,
   its title sits beside it. Hover still lights up other dots. */
.radar.has-selection .dot:not(.is-selected):not(.is-hot) { opacity: 0.32; }
.radar .dot.is-selected .rd-body { transform: scale(1.3); }
.radar .dot.is-selected .halo { opacity: 1; stroke: var(--color-accent); stroke-width: calc(2.5px * var(--rd-k)); }
.radar .seg.is-selected { fill: var(--color-accent-subtle); }
.rd-callout {
  position: absolute; transform: translate(0, -50%); max-width: min(16rem, 40%); padding: 0.25rem 0.5rem;
  border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-1);
  font-size: var(--text-xs); font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none; z-index: 2; animation: rise 200ms var(--ease-out) both;
}
.rd-callout[data-side="left"] { transform: translate(-100%, -50%); }

/* Readable on 13-inch screens: labels never below 14 px (segments) and 13 px (rings, groups, numbers). */
.seg-label { font-size: max(0.875rem, var(--text-xs)); }
@container (min-width: 40rem) { .seg-label { font-size: clamp(0.875rem, 1.5cqi, 1rem); max-width: clamp(7rem, 16cqi, 10.5rem); } .ring-tick { font-size: clamp(0.8125rem, 1.3cqi, 0.9375rem); } }
.ring-tick { font-size: max(0.8125rem, var(--text-xs)); }
.radar .group-text { font-size: calc(13px * var(--rd-k)); }
.radar .rd-num { font-size: calc(13px * var(--rd-k)); }
.tip { font-size: var(--text-sm); max-width: 24rem; }
.rd-callout { font-size: var(--text-sm); }

/* Age at a glance: new = blue ring (static, no motion needed), known for a while = paler fill. */
.radar .rd-new { stroke: var(--color-accent); stroke-width: calc(2px * var(--rd-k)); }
.radar .dot.is-new .rd-new { opacity: 1; }
.radar .dot[data-age="old"] .mark { fill-opacity: 0.5; }
/* "Neu" lens: everything else steps back, new items carry their title */
.radar.lens-new .dot:not(.is-lens):not(.is-selected):not(.is-hot) { opacity: 0.18; }
.rd-newlabel {
  position: absolute; transform: translate(0, -50%); max-width: min(14rem, 36%); padding: 0.125rem 0.5rem;
  border-radius: var(--radius-sm); background: var(--color-accent-subtle); color: var(--color-text);
  font-size: var(--text-xs); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  animation: rise 200ms var(--ease-out) both;
}
.rd-newlabel[data-side="left"] { transform: translate(-100%, -50%); }
.rd-tip-age { margin: 0.25rem 0 0; font-size: var(--text-xs); color: var(--color-text-subtle); }
.rd-tip-age.is-new { color: var(--color-text-link); font-weight: 600; }
/* Brand blue for "new" (accent is navy in the light theme); labels keep their side during the entry animation. */
.radar .rd-new { stroke: var(--color-brand); }
.rd-newlabel, .rd-callout { transform: none; translate: 0 -50%; }
.rd-newlabel[data-side="left"], .rd-callout[data-side="left"] { transform: none; translate: -100% -50%; }
/* The open item when a filter hides it: a dashed placeholder at its place, still marked as selected. */
.radar .dot.is-ghost .mark { fill-opacity: 0.25; stroke-dasharray: calc(3px * var(--rd-k)) calc(2px * var(--rd-k)); }
/* --- Übersicht: action column (level 1) left, radar scope (level 2) right. v2.3: the radar stage is the hero, a compressed rail beside it; no boxes, no outlines ---
   Layout follows the width of `main` (container query), so it also works next to the docked detail. */

/* Shared list styles still used by Neu and the panel (kept here until they move to base.css). */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; margin: 1.25rem 0 1rem; }
.toolbar .anchor { position: relative; }
.side-list { list-style: none; display: grid; gap: 0.125rem; margin-top: 0.5rem; }
.side-list a {
  display: grid; grid-template-columns: auto 1fr; gap: 0.125rem 0.625rem; align-items: start; padding: 0.5rem 0.625rem; border-radius: var(--radius-sm);
  color: var(--color-text); text-decoration: none; transition: background-color var(--duration-fast) var(--ease-standard);
}
.side-list a:hover, .side-list a:focus-visible { background: var(--color-surface-hover); }
.side-list .ring-dot { margin-top: 0.375rem; }
.side-list strong { font-weight: 500; font-size: var(--text-sm); line-height: 1.35; }
.side-list span.muted { grid-column: 2; font-size: var(--text-xs); }

/* ---------- Default: one column (narrow main). Rail content first, then the radar. ---------- */
.ov { display: grid; gap: 2rem; grid-template-columns: minmax(0, 1fr); grid-template-areas: "side" "main"; }
.ov-side { grid-area: side; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.75rem; align-content: start; min-width: 0; }
.ov-side > * { min-width: 0; }
.ov-main { grid-area: main; display: grid; gap: 0.75rem; align-content: start; min-width: 0; }

/* ---------- Rail: answer, Jetzt handeln, Als Nächstes, Produkte. Title plus rows, no card. ---------- */
.ov-hero { display: grid; gap: 0.25rem; padding-inline: 0.375rem; }
.ov-eyebrow { margin: 0; }
.ov-demo::before { content: "·"; margin-inline: 0.5em; }
.ov-answer { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.75rem; line-height: 1.05; letter-spacing: -0.005em; }
.ov-answer-n { font-size: 3.75rem; font-weight: 700; line-height: 0.95; font-variant-numeric: tabular-nums; }

.ov-now { display: grid; gap: 0.25rem; margin-top: -0.75rem; }
.ov-now:empty { display: none; }
.ov-now-list { list-style: none; margin: 0; padding: 0; display: grid; }
/* Same grid as the shared .task row, so the lists line up. */
.ov-now-row {
  display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); align-items: center; gap: 0.625rem;
  min-height: 2.25rem; padding: 0.125rem 0.375rem; border-radius: var(--radius-sm); color: var(--color-text); text-decoration: none;
  transition: background-color var(--duration-fast) var(--ease-standard), opacity var(--duration-normal) var(--ease-standard);
}
.ov-num {
  display: grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%;
  background: var(--urgent); color: var(--on-pastel); font-family: var(--font-display); font-weight: 700; font-size: 0.8125rem; line-height: 1;
}
.ov-now-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-sm); font-weight: 500; }
.ov-more { padding-left: 2.25rem; }

.ov-sec .sec-head { padding-inline: 0.375rem; margin-bottom: 0.25rem; }
.ov-sec-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; padding-right: 0.375rem; }
.ov-empty { margin: 0; padding: 0.25rem 0.375rem; font-size: var(--text-sm); color: var(--color-text-subtle); }
/* The one next task: title on line one, its action below (the rail is narrow). */
.ov-next .task { grid-template-columns: 1.25rem minmax(0, 1fr); row-gap: 0.25rem; padding-block: 0.375rem; cursor: pointer; }
.ov-next .task-act { grid-column: 2; justify-content: flex-start; cursor: auto; }
.ov-next-foot { padding: 0.25rem 0 0 2.25rem; }
.ov-next-foot:empty { display: none; }
.ov-next-foot .sec-link { min-height: 1.75rem; color: var(--color-text-muted); }
.ov-next-foot .sec-link:hover { color: var(--color-text); }

/* Rows react to the Focus bus (radar dot, building-block chip). Fill only, no lines. */
.ov-now-row:hover, .ov-now-row.is-hot, .ov-next .task.is-hot { background: var(--color-surface-hover); }
.ov-now-row.is-faded, .ov-next .task.is-faded { opacity: calc(var(--dim) + 0.35); }
.ov-now-row.is-current, .ov-next .task.is-current { background: var(--color-accent-subtle); }
.ov-now-row:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: -2px; }

.ov-hit-list { list-style: none; margin: 0; padding: 0 0.375rem; display: flex; flex-wrap: wrap; gap: 0.375rem; min-width: 0; } /* one line; long English names may wrap rather than cut */
.ov-hit-list li { min-width: 0; flex: 0 1 auto; }
.ov-chip {
  display: inline-flex; align-items: center; gap: 0.3125rem; max-width: 100%; min-height: 2rem; padding: 0 0.625rem 0 0.5rem;
  border-radius: var(--radius-sm); background: var(--color-bg-subtle); color: var(--color-text); text-decoration: none; font-size: 0.8125rem; font-weight: 500;
  transition: background-color var(--duration-fast) var(--ease-standard), opacity var(--duration-normal) var(--ease-standard);
}
.ov-chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-chip .icon { flex: none; width: 1rem; height: 1rem; color: var(--color-text-subtle); }
.ov-chip:hover, .ov-chip.is-hot { background: var(--color-accent-subtle); }
.ov-chip.is-hot .icon { color: var(--color-text-link); }
.ov-chip.is-faded { opacity: calc(var(--dim) + 0.35); }

/* ---------- Stage: the navy scope with the radar ---------- */
.ov-radar-toggle { display: none; }
.ov-scope { position: relative; display: grid; gap: 0.5rem; padding: 0; border-radius: 0; box-shadow: none; background: none; }
.ov-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; position: relative; z-index: 3; }
.ov-toolbar .anchor { position: relative; }
.ov-toolbar .chip { font-size: var(--text-xs); background: var(--color-bg-subtle); }
.ov-toolbar .segmented { padding: 0.125rem; } /* compact Sicht, no frame */
.ov-toolbar .segmented span { min-height: 1.75rem; padding: 0 0.625rem; font-size: var(--text-xs); }
.ov-filter-btn { position: relative; }
.ov-filter-btn[aria-expanded="true"] { background: var(--color-surface-hover); color: var(--color-text); }
.ov-filter-n {
  position: absolute; top: -0.25rem; right: -0.25rem; display: grid; place-items: center; min-width: 1.125rem; height: 1.125rem; padding: 0 0.25rem;
  border-radius: var(--radius-sm); background: var(--color-accent); color: var(--color-accent-fg); font-size: var(--text-xs); font-weight: 600; line-height: 1;
}
.ov-scope-body { display: grid; place-items: center; }
.ov-scope .radar { width: 100%; margin-inline: auto; }
.ov-scope-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem 1rem; position: relative; z-index: 2; }
.ov-key { font-size: var(--text-xs); color: var(--color-text-subtle); }
.ov-key-act { display: flex; gap: 0.125rem; margin-left: auto; }
/* Icon-only buttons: section 8 gives .btn--sm side padding, which would squeeze the icon. */
.ov-filter-btn, .ov-key-act .btn--icon { padding-inline: 0; }
.ov-filter-btn .icon, .ov-key-act .icon { width: 1rem; height: 1rem; }

@media (pointer: coarse) {
  .ov-chip, .ov-next-foot .sec-link, .ov-now-row { min-height: 2.75rem; }
  .ov-toolbar .segmented span { min-height: 2.75rem; }
}

/* Stage mode (wide main, or docked detail): full height, radar as large as the height allows,
   controls as small overlays in the scope corners (the radar box keeps its corners free of labels). */
@container main (min-width: 60rem) {
  .ov {
    grid-template-columns: minmax(0, 1fr) clamp(18rem, 26cqw, 20rem); grid-template-areas: "main side"; gap: 1.5rem;
    height: calc(100dvh - var(--size-header) - 1.5rem); min-height: 34rem; margin-top: -1.25rem; margin-bottom: -2.25rem;
  }
  .ov-side { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 1.25rem 0.5rem 0.5rem 0; gap: 2.25rem; }
  .ov-main { min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .ov-scope { display: block; min-height: 0; padding: 0; }
  .ov-scope-body { position: absolute; inset: 0.75rem 1rem; container-type: size; }
  .ov-scope .radar { width: min(100cqw, 100cqh * 1000 / 860); max-width: none; }
  .ov-toolbar { position: absolute; top: 0.75rem; left: 0.75rem; right: 0.75rem; pointer-events: none; }
  .ov-toolbar > * { pointer-events: auto; }
  .ov-scope-foot { position: absolute; left: 0.75rem; right: 0.75rem; bottom: 0.5rem; pointer-events: none; }
  .ov-scope-foot > * { pointer-events: auto; }
}
/* Full width: escape main's max-width (only when main is centred, i.e. not beside the docked detail). */
@container main (min-width: 60rem) { body:not(.pn-docked) .ov { margin-inline: calc(50% - 50vw + 1rem); } }
/* Docked detail and a narrow main: the detail takes the rail's place, the stage fills main. */
@container main (max-width: 59.99rem) {
  body.pn-docked .ov-side { display: none; }
  body.pn-docked .ov { height: calc(100dvh - var(--size-header) - 1.5rem); min-height: 30rem; margin-top: -1.25rem; margin-bottom: -2.25rem; grid-template-areas: "main"; grid-template-rows: minmax(0, 1fr); }
  body.pn-docked .ov-main { min-height: 0; grid-template-rows: minmax(0, 1fr); }
  body.pn-docked .ov-scope { display: block; min-height: 0; padding: 0; }
  body.pn-docked .ov-scope-body { position: absolute; inset: 3.25rem 0.75rem 2.75rem; container-type: size; }
  body.pn-docked .ov-scope .radar { width: min(100cqw, 100cqh * 1000 / 860); max-width: none; }
  body.pn-docked .ov-toolbar { position: absolute; top: 0.75rem; left: 0.75rem; right: 0.75rem; }
  body.pn-docked .ov-scope-foot { position: absolute; left: 0.75rem; right: 0.75rem; bottom: 0.5rem; }
}

/* Phones: the rail first, the radar on request. */
@media (max-width: 40rem) {
  .ov-radar-toggle { display: block; }
  .ov-radar-toggle .btn { min-height: var(--control-md); background: var(--color-bg-subtle); color: var(--color-text); }
  .ov-main.is-collapsed-mobile .ov-scope { display: none; }
  .ov-scope { padding: 0.625rem 0.625rem 0.5rem; }
}

/* "So liest du den Radar": three short lines on demand, shown once on the first visit. No legend otherwise. */
.ov-scope { position: relative; }
.ov-help {
  position: absolute; left: 0.75rem; bottom: 3rem; z-index: 3; max-width: min(22rem, calc(100% - 1.5rem));
  padding: 0.875rem 2.5rem 0.875rem 1rem; border-radius: var(--radius-md);
  background: var(--color-surface-raised); color: var(--color-text); box-shadow: var(--shadow-pop);
  animation: rise 220ms var(--ease-out) both;
}
.ov-help-title { margin: 0 0 0.375rem; font-size: var(--text-sm); font-weight: 600; }
.ov-help ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.25rem; font-size: var(--text-xs); color: var(--color-text-muted); }
.ov-help-close { position: absolute; top: 0.375rem; right: 0.375rem; }
#ov-help-btn[aria-expanded="true"] { background: var(--color-surface-hover); color: var(--color-text); }

/* Weekly check: one number, the first item, one button. */
.ov-check { display: grid; gap: 0.875rem; justify-items: start; }
.ov-answer--done { display: inline-flex; align-items: center; gap: 0.5rem; }
.ov-answer--done .icon { width: 1.5rem; height: 1.5rem; color: var(--color-success); }
.ov-first { margin: 0; display: grid; gap: 0.125rem; max-width: 100%; font-size: var(--text-sm); }
.ov-first span { font-size: var(--text-xs); font-weight: 600; color: var(--color-text-subtle); }
.ov-first a { color: var(--color-text); text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ov-first a:hover { text-decoration: underline; text-underline-offset: 3px; }
.ov-start { min-height: var(--control-md); padding-inline: 1.25rem; }
.ov-hint { margin: 0; font-size: var(--text-sm); color: var(--color-text-subtle); }

/* With the detail docked, the radar gets one calm stage so radar and detail read as two areas. */
.ov-scope { transition: background-color var(--duration-slow) var(--ease-out); }
body.pn-docked .ov-scope { --stage: var(--stage-bg); background: var(--stage); border-radius: var(--radius-xl); }
/* Filter state: the bar only exists when something is filtered */
.ov-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem 0.5rem; }
.ov-filter-btn[aria-expanded="true"], .ov-filter-btn.is-active { background: var(--color-accent-subtle); color: var(--color-text); }
/* Nothing to decide: what moved */
.ov-moved { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.125rem; width: 100%; }
.ov-moved a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.5rem; padding: 0.375rem 0.25rem; border-radius: var(--radius-sm); color: var(--color-text); text-decoration: none; font-size: var(--text-sm); }
.ov-moved a:hover { background: var(--color-surface-hover); }
.ov-moved-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-lens { gap: 0.375rem; }
.ov-lens[aria-pressed="true"] { background: var(--color-accent-subtle); color: var(--color-text); }
.ov-lens-n { font-size: var(--text-xs); color: var(--color-text-subtle); }
/* ==========================================================================
   5. VIEWS (Neu, Produkte, Tabelle, menu views). Owner: views agent.
   Minimal (v2.3): no outlines. Space separates sections, fill marks hover and selection,
   hairlines only between rows of tables and long lists.
   ========================================================================== */
.vw-head { align-items: center; margin-bottom: 1.75rem; }
.vw-head h1 { cursor: default; }
.vw-head h1[title] { cursor: help; }

/* --- Development card: ring and move, title, so-what (2 lines), icon-only feedback --- */
.ecard {
  position: relative; display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem 1.125rem 0.75rem;
  border-radius: var(--radius-lg); background: var(--color-bg-subtle);
  transition: background-color var(--duration-fast) var(--ease-standard), opacity var(--duration-normal) var(--ease-standard);
}
.ecard:hover, .ecard:focus-within, .ecard.vw-is-twin { background: var(--color-surface-hover); }
.ecard.is-muted { opacity: 0.6; }
.ecard.is-muted:hover, .ecard.is-muted:focus-within { opacity: 1; }
.ecard-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.375rem 0.75rem; min-height: 1.5rem; }
.ecard h3 { font-size: var(--text-md); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; }
.ecard h3 a { color: inherit; text-decoration: none; }
.ecard h3 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.ecard h3 a:focus-visible { outline: none; }
.ecard:has(h3 a:focus-visible) { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.ecard .so-what { color: var(--color-text-muted); font-size: var(--text-sm); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ecard-foot { display: flex; justify-content: flex-end; margin-top: auto; }
.ecard-foot .fb { position: relative; z-index: 1; }

/* --- One-line rows: ring dot, title (ellipsis), one short meta. Same rhythm as the task rows. --- */
.vw-lines { list-style: none; margin: 0; padding: 0; display: grid; }
.vw-line {
  position: relative; display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) auto; align-items: center; gap: 0.625rem;
  min-height: 2.75rem; padding: 0.125rem 0.375rem; border-radius: var(--radius-sm);
  transition: background-color var(--duration-fast) var(--ease-standard), opacity var(--duration-normal) var(--ease-standard);
}
.vw-line:hover, .vw-line:focus-within, .vw-line.vw-is-twin { background: var(--color-surface-hover); }
.vw-line.is-muted .vw-title { color: var(--color-text-subtle); }
.vw-mark { display: grid; place-items: center; width: 1.25rem; height: 1.25rem; }
.vw-mark::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--c); }
.vw-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text); font-size: var(--text-sm); text-decoration: none; }
.vw-title::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.vw-title:focus-visible { outline: none; }
.vw-line:has(.vw-title:focus-visible) { outline: 2px solid var(--color-focus-ring); outline-offset: -2px; }
.vw-meta { display: inline-flex; align-items: center; justify-content: flex-end; font-size: var(--text-xs); color: var(--color-text-subtle); white-space: nowrap; }
.vw-meta .badge, .vw-meta .move-label { font-size: inherit; }
.vw-more { margin: 0.125rem 0 0 0.125rem; color: var(--color-text-subtle); font-weight: 500; }
.vw-more:not(:disabled):hover { color: var(--color-text-link); }
.empty { padding: 0.5rem 0.375rem; color: var(--color-text-subtle); font-size: var(--text-sm); }

/* --- Neu: tasks first (level 1), then the digest (level 2) --- */
.week-section { margin-top: 2.5rem; scroll-margin-top: calc(var(--size-header) + 1rem); }
.vw-tasks { margin-top: 0; }
.vw-sec-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.25rem 1rem; margin-bottom: 0.5rem; }
.vw-sec-top .sec-head { margin-bottom: 0; }
/* A task finished a moment ago: one short flash (250 ms, none under reduced motion). */
.task.is-fresh { animation: vw-fresh 250ms var(--ease-out); }
@keyframes vw-fresh { from { background: var(--color-accent-subtle); } to { background: transparent; } }
.task.is-dimmed, .vw-line.is-dimmed { opacity: 0.35; }
.vw-calib { margin-top: 2.5rem; font-size: var(--text-xs); color: var(--color-text-subtle); cursor: help; }

/* --- Produkte: tiles (icon, name, count). Fill on hover and when selected. --- */
.vw-fam-search { flex: 0 1 18rem; min-width: min(14rem, 100%); }
.vw-found { margin-bottom: 1.75rem; }
.vw-tiles { display: grid; gap: 0.25rem 0.75rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 34rem) { .vw-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 64rem) { .vw-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.vw-tiles > [role="listitem"] { display: grid; }
.vw-tile {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.75rem;
  min-height: 3.25rem; padding: 0.375rem 0.875rem 0.375rem 0.375rem; border-radius: var(--radius-md);
  color: var(--color-text); text-decoration: none;
  transition: background-color var(--duration-fast) var(--ease-standard), opacity var(--duration-normal) var(--ease-standard);
}
.vw-tile:hover, .vw-tile.is-lit { background: var(--color-surface-hover); }
.vw-tile:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.vw-tile[aria-current="true"] { background: var(--color-accent-subtle); }
.vw-tile-icon { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: var(--radius-md); background: var(--color-bg-subtle); color: var(--color-text-muted); transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
.vw-tile-icon .icon { width: 1.25rem; height: 1.25rem; }
.vw-tile[aria-current="true"] .vw-tile-icon { background: var(--color-accent); color: var(--color-accent-fg); }
.vw-tile-name { min-width: 0; overflow: hidden; font-size: var(--text-md); font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
.vw-tile-n { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-muted); }
.vw-tile.is-empty .vw-tile-name, .vw-tile.is-empty .vw-tile-n { color: var(--color-text-subtle); font-weight: 500; }
.vw-tile.is-dimmed { opacity: 0.45; }

.bb-detail { animation: swap-in var(--duration-normal) var(--ease-out); }
.vw-detail { margin-top: 2.75rem; scroll-margin-top: calc(var(--size-header) + 1rem); }
.vw-detail-head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
.vw-detail-head .sec-title { flex: 1; min-width: 0; cursor: help; }
.vw-detail-head .vw-tile-icon { width: 2rem; height: 2rem; background: var(--color-accent); color: var(--color-accent-fg); }
.vw-detail-head .vw-tile-icon .icon { width: 1rem; height: 1rem; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem 3rem; }
@media (min-width: 60rem) { .two-col { grid-template-columns: minmax(0, 1.8fr) minmax(16rem, 1fr); } }
.vw-side { align-self: start; display: grid; gap: 0.625rem; }
.vw-side .vw-more { justify-self: start; }
.vw-side-title { display: inline-flex; align-items: center; gap: 0.375rem; font-size: var(--text-sm); font-weight: 600; }
.vw-side-title[title] { cursor: help; }
.vw-side-title .icon { width: 0.875rem; height: 0.875rem; color: var(--color-text-subtle); }
.vw-side-h { margin-top: 1rem; }
.families { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.fam {
  display: inline-flex; align-items: center; gap: 0.375rem; min-height: 2rem; padding: 0 0.75rem;
  border: 0; border-radius: var(--radius-sm); background: var(--color-bg-subtle); color: var(--color-text);
  font-size: var(--text-xs); font-weight: 500; text-decoration: none; cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
a.fam:hover, a.fam:focus-visible { background: var(--color-surface-hover); }
span.fam { cursor: default; }
.fam .n { color: var(--color-text-subtle); font-weight: 400; font-variant-numeric: tabular-nums; }
/* Basis of the product link: filled = from the evidence, quiet = hypothesis. Neutral on purpose. */
.fam[data-basis="explizit"] { font-weight: 600; }
.fam[data-basis="hypothese"] { background: transparent; color: var(--color-text-muted); }
a.fam[data-basis="hypothese"]:hover { background: var(--color-bg-subtle); color: var(--color-text); }

/* Family page */
.vw-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 0 0.25rem; margin-bottom: 0.25rem; font-size: var(--text-sm); }
.vw-crumbs a { display: inline-flex; align-items: center; gap: 0.375rem; min-height: 2.75rem; padding: 0 0.5rem; border-radius: var(--radius-sm); color: var(--color-text-muted); text-decoration: none; }
.vw-crumbs a:first-child { margin-left: -0.5rem; color: var(--color-text-link); font-weight: 500; }
.vw-crumbs a:hover { background: var(--color-surface-hover); color: var(--color-text); }
.vw-crumbs a + a::before { content: "·"; margin-right: 0.5rem; color: var(--color-text-subtle); }
.vw-stack-sections { display: grid; gap: 2.5rem; align-content: start; }
.vw-stack-sections .sec-title[title] { cursor: help; }
.vw-hyp { align-self: center; background: var(--color-bg-subtle); color: var(--color-text-muted); font-weight: 500; }
.vw-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.375rem 1rem; font-size: var(--text-sm); }
.vw-kv dt { color: var(--color-text-subtle); }
.vw-kv dd { margin: 0; }
.vw-features { display: grid; gap: 0.25rem; padding-left: 1.1rem; font-size: var(--text-sm); }

/* --- Tables (Alle Bewertungen, Quellen, Datenqualität): no box, hairlines between rows --- */
.vw-table-wrap { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.vw-table th { text-transform: none; letter-spacing: 0; font-weight: 600; background: transparent; color: var(--color-text-subtle); }
.vw-table th[title] { cursor: help; }
.vw-table th button { min-height: 2rem; }
.vw-table th[aria-sort="ascending"], .vw-table th[aria-sort="descending"] { color: var(--color-text); }
.vw-sort { display: inline-block; min-width: 0.75em; }
.vw-table td { vertical-align: middle; }
.vw-table tbody tr { transition: opacity var(--duration-normal) var(--ease-standard); }
.vw-table tbody tr[data-href] { cursor: pointer; }
.vw-table tbody tr:hover td, .vw-table tbody tr:focus-within td { background: var(--color-surface-hover); }
.vw-table tbody tr.is-muted td { color: var(--color-text-subtle); }
.vw-td-title { min-width: 15rem; max-width: 28rem; }
.vw-td-title a { color: var(--color-text); font-weight: 500; line-height: 1.35; text-decoration: none; }
.vw-td-title a:hover { text-decoration: underline; text-decoration-color: var(--color-border-strong); text-underline-offset: 3px; }
.vw-td-title a .icon { width: 0.875rem; height: 0.875rem; margin-left: 0.25rem; vertical-align: -0.125rem; color: var(--color-text-subtle); }
.vw-table .bb-icons { flex-wrap: nowrap; }
.vw-rel { display: inline-flex; align-items: center; gap: 0.5rem; }
.vw-rel .num { min-width: 1.75rem; font-weight: 600; }
.vw-bar { display: block; width: 3.5rem; height: 0.25rem; overflow: hidden; border-radius: var(--radius-sm); background: var(--color-bg-subtle); }
.vw-bar i { display: block; height: 100%; border-radius: inherit; background: var(--color-text-subtle); }
.vw-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
.vw-select { width: auto; max-width: 16rem; }
.vw-select--wide { max-width: 18rem; }
.vw-src-search { flex: 1; min-width: min(14rem, 100%); }
.vw-src-name { display: inline-flex; align-items: flex-start; gap: 0.25rem; }
.vw-why { display: inline; }
.vw-why > summary { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: var(--radius-sm); color: var(--color-text-subtle); cursor: pointer; list-style: none; }
.vw-why > summary::-webkit-details-marker { display: none; }
.vw-why > summary:hover, .vw-why[open] > summary { background: var(--color-surface-hover); color: var(--color-text); }
.vw-why > summary .icon { width: 0.875rem; height: 0.875rem; }
.vw-why[open] { display: block; }
.vw-why p { margin-top: 0.25rem; max-width: 60ch; }
.vw-src-name:has(.vw-why[open]) { flex-wrap: wrap; }
.vw-after { margin-top: 0.75rem; }
.vw-nowrap { white-space: nowrap; }
.vw-td-one { max-width: 13rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
/* Icon-only buttons in these views: the shared small-button padding must not squeeze the icon. */
.vw-page .btn--icon { padding-inline: 0; }
.vw-page .btn--icon .icon { width: 1rem; height: 1rem; }

/* --- Use Cases: groups of quiet blocks, no cards --- */
.vw-uc-sec + .vw-uc-sec { margin-top: 2.5rem; }
.vw-group { margin-bottom: 1rem; font-size: var(--text-md); font-weight: 600; }
.vw-ucs { display: grid; gap: 1.75rem 2.5rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.vw-uc { display: flex; flex-direction: column; gap: 0.5rem; }
.vw-uc h3 { display: grid; gap: 0.125rem; font-size: var(--text-md); font-weight: 600; line-height: 1.3; }
.vw-uc-more > summary { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; padding: 0.25rem 0.375rem; margin: -0.25rem -0.375rem 0; border-radius: var(--radius-sm); cursor: pointer; list-style: none; }
.vw-uc-more > summary::-webkit-details-marker { display: none; }
.vw-uc-more > summary:hover { background: var(--color-surface-hover); }
.vw-uc-more > summary .icon { flex: none; width: 0.875rem; height: 0.875rem; margin-top: 0.25rem; color: var(--color-text-subtle); transform: rotate(90deg); transition: transform var(--duration-fast) var(--ease-out); }
.vw-uc-more[open] > summary .icon { transform: rotate(-90deg); }
.vw-uc-more > p:first-of-type { margin-top: 0.5rem; }
.vw-uc-n { font-size: var(--text-xs); font-weight: 500; color: var(--color-text-subtle); }
.vw-uc-p { margin-top: 0.5rem; }
.vw-uc-links { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
.vw-uc-links .tag { min-height: 1.75rem; color: var(--color-text); text-decoration: none; }
.vw-uc-links .tag:hover { background: var(--color-surface-hover); }
.vw-uc-links .ring-label { font-weight: 500; color: inherit; }
.vw-uc-links .vw-more { margin: 0; }

/* --- Einstellungen, Daten & Status: sections with space, no panels --- */
.vw-settings { max-width: 56rem; }
.vw-sec { display: grid; align-content: start; gap: 0.75rem; margin-bottom: 2.75rem; }
.vw-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 3.5rem; }
@media (min-width: 64rem) { .vw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.vw-sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem 0.625rem; }
.vw-h { font-size: var(--text-md); font-weight: 600; letter-spacing: -0.01em; }
.vw-h[title] { cursor: help; }
.vw-sec-head .badge { font-weight: 500; }
.vw-sec .vw-more { justify-self: start; margin: 0; }
.vw-rules { list-style: none; display: grid; }
.vw-rules li { display: grid; grid-template-columns: minmax(8rem, 11rem) minmax(0, 1fr); gap: 0.25rem 1rem; padding: 0.3125rem 0; font-size: var(--text-sm); }
.vw-rules li span { color: var(--color-text-muted); }
.vw-factors { display: grid; gap: 0.25rem; }
.vw-factors h3 { margin-top: 0.5rem; font-size: var(--text-xs); font-weight: 600; color: var(--color-text-subtle); }
.vw-factors .vw-more { justify-self: start; margin: 0; }
.vw-factor, .vw-factor-scale { display: grid; grid-template-columns: minmax(7rem, 13rem) minmax(8rem, 1fr) 8.5rem; align-items: center; gap: 1rem; }
.vw-factor { min-height: 2rem; font-size: var(--text-sm); }
.vw-factor-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.vw-factor-bar { position: relative; height: 0.375rem; border-radius: var(--radius-sm); background: var(--color-bg-subtle); }
.vw-factor-bar::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--color-border); }
.vw-factor-bar i { position: absolute; top: 0; bottom: 0; border-radius: var(--radius-sm); background: var(--color-text-muted); }
.vw-factor-bar i.is-up { left: 50%; transform-origin: left; animation: grow var(--duration-slow) var(--ease-out) both; }
.vw-factor-bar i.is-down { right: 50%; transform-origin: right; animation: grow var(--duration-slow) var(--ease-out) both; }
.vw-factor-v { display: flex; align-items: baseline; gap: 0.5rem; }
.vw-factor-scale span { grid-row: 1; grid-column: 2; }
.vw-factor-scale span:nth-child(1) { justify-self: start; }
.vw-factor-scale span:nth-child(2) { justify-self: center; }
.vw-factor-scale span:nth-child(3) { justify-self: end; }
@media (max-width: 40rem) {
  .vw-factor { grid-template-columns: minmax(0, 1fr) auto; gap: 0.25rem 0.75rem; padding: 0.25rem 0; }
  .vw-factor-bar { grid-column: 1 / -1; grid-row: 2; }
  .vw-factor-scale { display: none; }
  .vw-rules li { grid-template-columns: minmax(0, 1fr); }
}
.vw-weights { display: grid; gap: 0.25rem; }
.vw-weight { display: grid; grid-template-columns: minmax(7rem, 10rem) minmax(0, 22rem) 2.5rem; align-items: center; gap: 1rem; min-height: 2.75rem; }
.vw-weight input[type="range"], .vw-check input, .vw-order input { accent-color: var(--color-accent); }
.vw-weight input[type="range"] { width: 100%; min-height: 2.75rem; }
.vw-check { min-height: 2.75rem; cursor: help; }
.vw-check input { width: 1.125rem; height: 1.125rem; }
.vw-sec .empty { padding-inline: 0; }
.vw-order { list-style: none; display: grid; }
.vw-order li { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--color-hairline); }
.vw-order li:first-child { border-top: 0; }
.vw-order-name { display: flex; align-items: center; gap: 0.875rem; min-width: 0; min-height: 2.75rem; font-size: var(--text-sm); font-weight: 500; cursor: pointer; }
.vw-order-name input { flex: none; width: 1.125rem; height: 1.125rem; }
.vw-order-move { display: flex; flex: none; gap: 0.25rem; }
.vw-order-move .btn { width: 2.75rem; min-width: 2.75rem; height: 2.75rem; min-height: 2.75rem; font-size: var(--text-md); }
.vw-ok { display: inline-flex; align-items: center; gap: 0.375rem; }
.vw-ok .icon { width: 0.875rem; height: 0.875rem; color: var(--color-success); }
/* Languages (Daten & Status) */
.vw-langs { list-style: none; display: grid; }
.vw-langs li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem 0.75rem; min-height: 2.75rem; padding: 0.25rem 0; }
.vw-langs b { min-width: 6rem; font-size: var(--text-sm); }
.vw-keys { display: flex; flex-wrap: wrap; gap: 0.25rem; width: 100%; }
.vw-keys code { padding: 0.0625rem 0.375rem; border-radius: var(--radius-xs); background: var(--color-surface-sunken); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); }
.vw-err { background: var(--color-bg-subtle); color: var(--color-text); font-weight: 600; }

/* --- Coverage (Daten): name, bar, one value --- */
.cov { display: grid; grid-template-columns: minmax(8rem, 11rem) minmax(4rem, 1fr) auto; gap: 0.25rem 1rem; align-items: center; min-height: 2.25rem; font-size: var(--text-sm); }
.cov > b { font-weight: 500; cursor: help; }
.cov .bar { height: 0.25rem; overflow: hidden; border-radius: var(--radius-sm); background: var(--color-bg-subtle); }
.cov .bar i { display: block; height: 100%; border-radius: inherit; background: var(--color-text-subtle); transform-origin: left; animation: grow var(--duration-slow) var(--ease-out) both; }
.run-log { display: grid; gap: 0.25rem; max-height: 14rem; overflow: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-subtle); }
.progress { height: 0.25rem; overflow: hidden; border-radius: var(--radius-sm); background: var(--color-bg-subtle); }
.progress i { display: block; height: 100%; width: var(--p, 0%); background: var(--color-text-link); transition: width 280ms var(--ease-standard); }
pre.code { margin: 0; max-height: 18rem; overflow: auto; padding: 1rem; border-radius: var(--radius-md); background: var(--color-surface-sunken); font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.5; white-space: pre; }

/* --- Search dialog: borderless input, quiet results --- */
dialog.search {
  width: min(40rem, calc(100vw - 2rem)); max-height: min(36rem, calc(100dvh - 4rem)); margin: 10vh auto auto; padding: 0; overflow: hidden;
  border: 0; border-radius: var(--radius-xl); background: var(--color-surface-raised); color: var(--color-text);
  box-shadow: var(--shadow-pop);
}
dialog.search[open] { animation: pop-in var(--duration-normal) var(--ease-out); }
dialog.search::backdrop { background: var(--color-overlay); }
.search-head { padding: 0.5rem 0.75rem 0; }
.search-head .input, .search-head .input:hover { border: 0; font-size: var(--text-lg); min-height: 3rem; background: transparent; }
.search-head .input:focus-visible { outline: none; }
.search-results { max-height: 26rem; overflow: auto; padding: 0.25rem 0.5rem 0.5rem; }
.search-results h4 { padding: 0.75rem 0.75rem 0.25rem; font-size: var(--text-xs); font-weight: 500; color: var(--color-text-subtle); }
.search-results a { display: flex; align-items: center; gap: 0.75rem; min-height: 2.75rem; padding: 0.375rem 0.75rem; border-radius: var(--radius-sm); color: var(--color-text); text-decoration: none; font-size: var(--text-sm); }
.search-results a > span:not(.muted) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-results a .icon { color: var(--color-text-subtle); }
.search-results a:hover { background: var(--color-surface-hover); }
.search-results a[aria-selected="true"] { background: var(--color-bg-subtle); }
.search-results a .muted { margin-left: auto; font-size: var(--text-xs); white-space: nowrap; }
.search-results .empty { margin: 0.5rem; }
kbd { font-family: var(--font-mono); font-size: var(--text-xs); padding: 0.0625rem 0.375rem; border: 0; border-radius: 4px; background: var(--color-bg-subtle); color: var(--color-text-subtle); }

/* =============================================================================

   < 75rem: a sheet from the right with scrim, full width on phones.

.panel { --pn-pad: 1.25rem; --pn-slide: 280ms; --pn-swap: 160ms; }

  flex: 1; min-width: 0; padding-left: 0.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-sm); font-weight: 600; color: var(--color-text);

.pn-tools { display: flex; align-items: center; gap: 0; }

/* --- Body: own scroll, laid out by its own width --- */
.panel-body {
  container: pn / inline-size; flex: 1; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 var(--pn-pad) calc(3rem + env(safe-area-inset-bottom, 0px)); scroll-padding-top: 5rem;

.pn-fc-q { font-size: var(--text-sm); line-height: 1.45; }

<!-- ======================================================================
     APP (sections 1 to 13). Start reading here.
     ====================================================================== -->
<script>
'use strict';
/* =============================================================================
   RIDI MARKTRADAR · Prototyp v2
   -----------------------------------------------------------------------------
   One HTML file, no build step. Open it in a browser or publish it as a Claude
   artifact. The file is organised in numbered sections:

     1  CONFIG          switches and storage keys
     2  TEXT            German UI text (Spark pattern: one catalogue)
     3  DOMAIN MODEL    domains, rings, dimensions, building blocks
     4  RULES           scoring logic: relevance, confidence, ring, learning
     5  DATA ADAPTERS   local state, artifact database, API, source database, Lichtblick ratings
     6  STORE           state, persistence, derived values
     7  HELPERS         html escaping, dates, icons
     8  COMPONENTS      card, ring label, confidence, feedback buttons …
     9  RADAR           the SVG radar (keyed updates, animations)
    10  VIEWS           Übersicht, Neu, Produkte + views behind the menu
    11  PANEL           level 2 "Thema" and level 3 "Detail"
    12  ROUTER/EVENTS   hash routes, clicks, keyboard
    13  BOOT

   The page ships without content data. Developments and reports come from a database
   (section 5); the source list comes from the source database (SourceCatalog, section 5).
   Reference data (use cases, catalogue) lives in <script type="application/json"> blocks at
   the end, plus an empty embed point for the source database.

   Data contract: schema/entwicklung.schema.json (one "Entwicklung" = one card,
   "Belege" = the reports it rests on). Engine and dashboard speak this format.
   ============================================================================= */

/* =============================================================================
   1  CONFIG
   ============================================================================= */
const CONFIG = {
  app: { name: 'Marktradar', version: '2.11.0-prototyp', schemaVersion: 2 },
  storage: {
    user: 'ridi.marktradar.user.v2',     // my own feedback clicks, preferences, last visit (per person)
    shared: 'ridi.marktradar.shared.v2', // PM decisions, forecast results, team feedback (local mode only)
    legacy: 'ridi.radar.v1',             // v1 prototype, read once for migration
    theme: 'spark-theme',                // same key as every Spark app
    locale: 'spark-locale',              // language choice (de / en), per device like the theme
    help: 'ridi.marktradar.help.v1',     // the radar help was shown once
  },
  // Future: the Marktradar API of the Spark app, e.g. '/api'. While null, the API adapter stays off.
  apiBaseUrl: (typeof window !== 'undefined' && window.MARKTRADAR?.apiBaseUrl) || null, // the local server injects window.MARKTRADAR
  // Live refresh: sources and data are fetched again every N minutes while the page is open (0 = off).
  refreshMinutes: Number((typeof window !== 'undefined' && window.MARKTRADAR?.refreshMinutes) ?? 5) || 0,
  // Optional: URL of a JSON file with the source list ({categories, records} or a plain array).
  // Fetched at start. The Artifact collection `quellen` and `{apiBaseUrl}/quellen` work without it.
  sourcesUrl: null,
  // Future: Lichtblick base URL for source ratings (★1–5 per domain). While null, ratings only come from the source records.
  lichtblickUrl: null,
  weekDays: 7,           // "Neu seit letzter Woche"
  forecastDueDays: 30,   // a forecast is "fällig" this many days before its expected date
  defaults: {
    audience: 'pm',      // feedback: PM view first, production view and intersection available
    region: 'DACH',      // feedback: default market DACH instead of Global
    weights: { change: 1, marketImpact: 2, ridiRelevance: 3 },
    minConf: 'mittel',   // weakly supported points stay hidden by default (filter "Vertrauen" in the radar toolbar)
    evidenceCap: true,   // weak evidence can never put a proposal into "Jetzt handeln"

   ============================================================================= */
/* --- 2a  Languages and lookup ------------------------------------------------------------
   All user-facing text lives in this section, German and English side by side, one block per
   area (I18N.add('<area>', { de: {…}, en: {…} })). Same keys in every language; German is the
   fallback. Use t('area.key', { var }) for text and tn('units.x', n) for counted words.
   Domain, ring and building-block names keep their German text in section 3 and get their
   English text from the 'model' block below. Data from the engine (titles, "Was heißt das für
   uns?", Belege) stays in the language it was written in.
   To add a language: add it to LOCALES and give every block a third key, e.g. pl: {…}. */
const LOCALES = {
  de: { label: 'Deutsch', intl: 'de-DE' },
  en: { label: 'English', intl: 'en-GB' },
};
const I18N = {
  lang: 'de',
  fallback: 'de',
  cat: {},
  misses: new Set(),
  add(area, langs) {
    for (const [lang, dict] of Object.entries(langs)) {
      this.cat[lang] ||= {};
      this.cat[lang][area] = i18nMerge(this.cat[lang][area] || {}, dict);
    }
  },
  get(lang, key) { return key.split('.').reduce((o, k) => (o == null ? undefined : o[k]), this.cat[lang]); },
  /** Keys present in one language but not in another (shown under Daten & Status). */
  missing() {
    const flat = (o, p = '') => Object.entries(o || {}).flatMap(([k, v]) => (v && typeof v === 'object' && !Array.isArray(v) ? flat(v, `${p}${k}.`) : [`${p}${k}`]));
    const keys = Object.fromEntries(Object.keys(LOCALES).map((l) => [l, new Set(flat(this.cat[l]))]));
    const all = new Set(Object.values(keys).flatMap((s) => [...s]));
    return Object.fromEntries(Object.keys(LOCALES).map((l) => [l, [...all].filter((k) => !keys[l].has(k))]));
  },
};
function i18nMerge(a, b) {
  for (const [k, v] of Object.entries(b)) a[k] = v && typeof v === 'object' && !Array.isArray(v) ? i18nMerge(a[k] && typeof a[k] === 'object' ? a[k] : {}, v) : v;
  return a;
}
const locale = () => LOCALES[I18N.lang]?.intl || 'de-DE';

/** Text for a key in the current language (fallback German). {name} placeholders are filled from vars. */
function t(key, vars) {
  let v = I18N.get(I18N.lang, key);
  if (v == null) v = I18N.get(I18N.fallback, key);
  if (v == null) { I18N.misses.add(key); return key; }
  if (typeof v === 'string' && vars) v = v.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
  return v;
}
/** Counted words with the right plural form: tn('units.entwicklung', 3) → "3 Entwicklungen". */
function tn(key, n, vars = {}) {
  const form = new Intl.PluralRules(locale()).select(n);
  const pick = I18N.get(I18N.lang, `${key}.${form}`) != null || I18N.get(I18N.fallback, `${key}.${form}`) != null ? form : 'other';
  return t(`${key}.${pick}`, { n: Number(n).toLocaleString(locale()), ...vars });
}

/** Model constants (section 3) keep their German text; these getters return the current language. */
function localize(list, area, props) {
  for (const item of list) {
    const id = item.id ?? item.key;
    for (const p of props) {
      if (!(p in item)) continue;
      I18N.add('model', { de: { [area]: { [id]: { [p]: item[p] } } } });
      Object.defineProperty(item, p, { get: () => t(`model.${area}.${id}.${p}`), enumerable: true, configurable: true });
    }
  }
}
function localizeMap(map, area) {
  for (const k of Object.keys(map)) {
    I18N.add('model', { de: { [area]: { [k]: map[k] } } });
    Object.defineProperty(map, k, { get: () => t(`model.${area}.${k}`), enumerable: true, configurable: true });
  }
}

/** T: short labels used everywhere (feedback, audience, confidence …), rebuilt when the language changes. */
const T = {};
function syncT() {
  for (const k of Object.keys(T)) delete T[k];
  Object.assign(T, i18nMerge(i18nMerge({}, I18N.cat[I18N.fallback].T), I18N.cat[I18N.lang]?.T || {}));
}

   student can read and change it. Each rule answers one question from the feedback.
