/* --- 10a  Übersicht -----------------------------------------------------------------------
   One question: what do I have to do this week? Minimal (v2.3): space separates, rows are one line.
   Stage (left, the hero): the radar scope at full height, controls as small corner overlays.
   Rail (right, about 20rem, ~25 words): the answer, the "Jetzt handeln" titles, the next task.
   Docked detail: the rail hides, the stage stays. Level 3: tooltips, hover card, detail, Neu. */
function filterControls() {
  const p = store.user.prefs;
  const f = p.filters;
  const y = new Date().getFullYear();
  const year = { y0: y, y1: y + 1, y3: y + 3 };
  const active = activeFilters();
  const opt = (v, cur, label) => html`<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${label}</option>`;
  const all = t('ov.filter.all');
  const label = active.length ? tn('ov.filter.active', active.length) : t('ov.filter.button');
  return html`
    <div class="anchor" style="position:relative">
      <button type="button" class="btn btn--sm btn--icon ov-filter-btn ${active.length ? 'is-active' : ''}" id="filter-open" aria-expanded="${!!store.ui.filterOpen}" aria-controls="filter-pop" aria-label="${label}" title="${label}">${icon('filter')}${active.length ? html`<span class="ov-filter-n" aria-hidden="true">${active.length}</span>` : ''}</button>
      <div class="popover popover--left" id="filter-pop" ${store.ui.filterOpen ? '' : 'hidden'}>
        <div class="stack" style="--gap:.875rem">
          <label class="field"><span>${t('ov.filter.audience')}</span><select class="select" id="f-audience" data-pref="audience">${Object.entries(T.audience).map(([k, l]) => opt(k, p.audience, l))}</select></label>
          <label class="field"><span>${t('ov.filter.region')}</span><select class="select" id="f-region" data-pref="region">${REGIONS.map((r) => opt(r.id, p.region, r.label))}</select></label>
          <label class="field"><span>${t('ov.filter.published')}</span><select class="select" id="f-published" data-filter="published">${[['all', all], ['7', t('ov.filter.days7')], ['30', t('ov.filter.days30')], ['365', t('ov.filter.days365')]].map(([v, l]) => opt(v, f.published, l))}</select></label>
          <label class="field"><span>${t('ov.filter.expected')}</span><select class="select" id="f-expected" data-filter="expected">${[['all', all], ['y0', t('ov.filter.untilYear', { y })], ['y1', t('ov.filter.untilYear', { y: y + 1 })], ['y3', t('ov.filter.untilYear', { y: y + 3 })], ['later', t('ov.filter.later')]].map(([v, l]) => opt(v, f.expected, l))}</select></label>
          <label class="field"><span>${t('ov.filter.conf')}</span><select class="select" id="f-conf" data-filter="minConf">${[['all', all], ['mittel', t('ov.filter.confMid')], ['hoch', t('ov.filter.confHigh')]].map(([v, l]) => opt(v, f.minConf, l))}</select></label>
          <label class="field"><span>${t('ov.filter.fb.label')}</span><select class="select" id="f-feedback" data-filter="feedback">${['all', 'relevant', 'later', 'hide'].map((v) => opt(v, f.feedback || 'all', v === 'all' ? all : t(`ov.filter.fb.${v}`)))}</select></label>
        </div>
      </div>
    </div>`;
}

let ovSwept = false;  // the radar sweeps once per page load, not on every return to the overview
let ovBound = false;  // the overview's own delegated listeners are bound once
const OV_NOW_CAP = 3;  // "Jetzt handeln": at most three rows
const OV_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)'; // = --ease-out (WAAPI cannot read CSS variables)

/** Writes markup only when it changed. Keeps hover state, focus and running animations alive. */
function ovSet(el, markup) {
  if (!el) return false;
  const s = esc(markup);
  if (el.ovHtml === s) return false;
  el.ovHtml = s;
  el.innerHTML = s;
  return true;
}

/** Everything the overview shows, derived once per update from the visible list. */
function ovModel() {
  const list = visible();
  const handeln = list.filter((d) => d.ring.ring === 'handeln').sort(byScore);
  const blocks = BAUSTEINE.map((b) => {
    const items = list.filter((d) => (d.e.bausteine || []).includes(b.id));
    return { b, n: items.length, act: items.filter((d) => d.ring.ring === 'handeln').length, check: items.filter((d) => d.ring.ring === 'pruefen').length };
  }).filter((x) => x.n);
  // Most affected: building blocks with the most "Jetzt handeln" first, then the most developments.
  blocks.sort((a, b) => b.act - a.act || b.n - a.n || b.check - a.check);
  return {
    list,
    handeln,
    changes: list.filter((d) => d.isNew || d.moved).length,
    tasks: tasksModel(),
    hit: blocks.slice(0, 3),
    numbers: new Map(handeln.map((d, i) => [d.e.id, i + 1])),
  };
}

const Overview = {
  mount(main) {
    main.innerHTML = esc(html`<div class="ov view-enter" id="ov-root">
      <aside class="ov-side" id="ov-side" aria-label="${t('ov.aria.side')}">
        <p class="eyebrow ov-eyebrow" id="ov-eyebrow"></p>
        <div class="ov-check" id="ov-check"></div>
      </aside>
      <div class="ov-main" id="ov-main">
        <div class="ov-radar-toggle" id="ov-radar-toggle"></div>
        <section class="scope ov-scope" id="ov-scope" aria-label="${t('ov.aria.scope')}">
          <div class="ov-toolbar" id="ov-toolbar"></div>
          <div class="ov-scope-body"><div class="radar" id="radar"></div></div>
          <div class="ov-help" id="ov-help" hidden></div>
          <div class="ov-scope-foot"><div class="ov-key" id="ov-key"></div><div class="ov-key-act" id="ov-key-act"></div></div>
        </section>
      </div>
    </div>`);
    this.radar = new Radar($('#radar'), {
      open: (id) => navigate(themaHref(id)),
      segment: (dom) => { store.user.prefs.domain = store.user.prefs.domain === dom ? null : dom; saveUser(); commit(); },
    });
    this.first = true;
    this.nextKey = null;
    if (store.ui.ovHelp == null) store.ui.ovHelp = !Local.read(CONFIG.storage.help, false); // first visit: explain once
    Focus.on('overview', (f) => this.applyFocus(f));
    this.bind();
    this.update();
  },

  /** Own delegated listeners (bound once): replay, and a click on the task row opens its detail. */
  bind() {
    if (ovBound) return;
    ovBound = true;
    document.addEventListener('click', (ev) => {
      const el = ev.target;
      if (!el.closest?.('#ov-root')) return;
      if (el.closest('#ov-help-btn') || el.closest('#ov-help-close')) {
        store.ui.ovHelp = !store.ui.ovHelp && !el.closest('#ov-help-close');
        Local.write(CONFIG.storage.help, true);
        commit();
        return;
      }
      const row = el.closest('#ov-next-task .task[data-hot]');
      if (row && !el.closest('a, button, select, input, label')) {
        const a = row.querySelector('.task-title');
        if (a) navigate(a.getAttribute('href'));
      }
    });
  },

  update() {
    if (!this.radar || !document.contains(this.radar.host)) return;
    const p = store.user.prefs;
    const m = ovModel();
    this.renderCheck(m);

    // Stage overlays: Sicht and the filter icon top left, ring words bottom left, icons bottom right.
    const fresh = m.list.filter((d) => d.isNew).length;
    if (!fresh) store.ui.lensNew = false;
    const lens = fresh ? html`<button type="button" class="btn btn--sm ov-lens" data-action="toggle-lens" aria-pressed="${!!store.ui.lensNew}" title="${t('ov.lens.title')}">${icon('spark')}${t('ov.lens.label')}<span class="ov-lens-n num">${fresh}</span></button>` : '';
    ovSet($('#ov-toolbar'), html`${filterControls()}${lens}${filterBar()}`);
    // Controls only when they are useful. The ⓘ is for the first visits (later: Menü). The play button starts
    // the guided check at the most urgent open item; it is gone when there is nothing to do.
    const newcomer = (store.user.visits || 0) <= 3 || store.ui.ovHelp;
    ovSet($('#ov-key'), newcomer ? html`<button type="button" class="btn btn--sm btn--icon" id="ov-help-btn" aria-controls="ov-help" aria-expanded="${!!store.ui.ovHelp}" aria-label="${t('ov.help.button')}" title="${t('ov.help.button')}">${icon('info')}</button>` : '');
    ovSet($('#ov-help'), html`<p class="ov-help-title">${t('ov.help.button')}</p><ul>${['l1', 'l2', 'l3'].map((k) => html`<li>${t(`ov.help.${k}`)}</li>`)}</ul><button type="button" class="btn btn--sm btn--icon ov-help-close" id="ov-help-close" aria-label="${t('ov.help.close')}" title="${t('ov.help.close')}">${icon('x')}</button>`);
    $('#ov-help').hidden = !store.ui.ovHelp;
    const firstId = guideModel().queue[0];
    const playLabel = firstId ? t('ov.scope.play', { title: store.derived.byId[firstId]?.e.title || '' }) : '';
    ovSet($('#ov-key-act'), firstId && !store.ui.guide ? html`<button type="button" class="btn btn--sm btn--icon ov-play" data-guide-start aria-label="${playLabel}" title="${playLabel}">${icon('play')}</button>` : '');

    // Radar: build the static rings only when segments change, then let the dots glide.
    const coverage = store.data.coverage || {};
    const counts = {};
    for (const d of visible({ domain: false })) counts[d.e.domain] = (counts[d.e.domain] || 0) + 1;
    const domainIds = p.domainOrder.filter((id) => p.domainsOn.includes(id));
    this.radar.build(domainIds, coverage, counts, p.domain);
    const sel = store.ui.route.e ? store.derived.byId[store.ui.route.e] : null;
    const ghost = sel && !m.list.includes(sel) && p.domainsOn.includes(sel.e.domain) ? sel : null; // open, but filtered out
    this.radar.update(ghost ? [...m.list, ghost] : m.list, { initial: this.first, showChanges: store.ui.showChanges, numbers: m.numbers, ghostId: ghost?.e.id || null });

    ovSet($('#ov-radar-toggle'), html`<button type="button" class="btn btn--sm" data-action="toggle-mobile-radar" aria-controls="ov-scope" aria-expanded="${!!store.ui.mobileRadar}">${icon('target')}${store.ui.mobileRadar ? t('ov.scope.hideRadar') : t('ov.scope.showRadar')}</button>`);
    $('#ov-main').classList.toggle('is-collapsed-mobile', !store.ui.mobileRadar);
    this.first = false;
    this.applyFocus(Focus.current);
  },

  /** Eyebrow (week, empty-state note) and the answer: a big number and one word. */
  /** The weekly check: how many items, which one first (priority), one button that walks through them.
   *  Nothing else here: the radar is the overview, the detail is where you decide. */
  renderCheck(m) {
    const now = store.derived.now;
    ovSet($('#ov-eyebrow'), html`${t('ov.eyebrow', { week: isoWeek(now) })}${store.data.mode === 'empty' ? html`<span class="ov-demo">${T.modeEmpty}</span>` : ''}`);
    $('#ov-eyebrow').title = `${lastRunText()}${lastRunTitle() ? ` · ${lastRunTitle()}` : ''}`;
    const g = guideModel();
    const left = g.queue.length;
    if (!left) {
      // Nothing to decide: show what moved instead of an empty card (three rows at most).
      const moved = m.list.filter((d) => d.isNew || d.moved).sort(byScore).slice(0, 3);
      ovSet($('#ov-check'), html`<h1 class="ov-answer ov-answer--done">${icon('check')}<span class="ov-answer-w">${t('ov.check.done')}</span></h1>
        ${moved.length ? html`<p class="ov-first"><span>${t('ov.check.since')}</span></p><ul class="ov-moved">${moved.map((d) => html`<li><a href="${themaHref(d.e.id)}" data-hot="${d.e.id}"><span class="ov-moved-t">${d.e.title}</span>${moveLabel(d)}</a></li>`)}</ul>`
          : html`<p class="ov-hint">${t('ov.check.doneHint')}</p>`}`);
      return;
    }
    const first = store.derived.byId[g.queue[0]];
    const parts = String(tn('ov.check.items', left)).split('*');
    if (ovSet($('#ov-check'), html`
      <h1 class="ov-answer">${parts.map((x, i) => (i % 2 ? html`<b class="display-num ov-answer-n" data-count="${left}" data-count-key="ov-answer">${x}</b>` : x.trim() ? html`<span class="ov-answer-w">${x.trim()}</span>` : ''))}</h1>
      ${g.done ? html`<span class="task-progress ov-progress" role="img" aria-label="${t('task.progress', { done: g.done, total: g.total })}"><i style="--p:${g.done / g.total}"></i><span class="num">${g.done}/${g.total}</span></span>` : ''}
      <p class="ov-first" data-hot="${first.e.id}"><span>${t('ov.check.first')}</span><a href="${themaHref(first.e.id)}" title="${first.e.title}">${first.e.title}</a></p>
      <button type="button" class="btn btn--primary ov-start" data-guide-start>${icon('play')}${g.done ? t('guide.resume') : t('guide.start')}</button>`)) countUp($('#ov-check'));
  },

  /** Linked highlighting: rows and building-block chips follow the Focus bus. */
  applyFocus(f) {
    const root = $('#ov-root');
    if (!root) return;
    for (const el of root.querySelectorAll('#ov-side [data-hot]')) {
      const on = !!f && f.ids.has(el.dataset.hot);
      el.classList.toggle('is-hot', on);
      el.classList.toggle('is-faded', !!f && !on);
    }
    for (const el of root.querySelectorAll('.ov-chip[data-hot-block]')) {
      const on = !!f && f.blocks.has(el.dataset.hotBlock);
      el.classList.toggle('is-hot', on);
      el.classList.toggle('is-faded', !!f && !on);
    }
  },
};
/* --- 10b  Neu, Produkte, Tabelle, menu views --- */
/** Development card: ring word and move on top, the title, the so-what in two lines and only the
 *  icon-only feedback below. For places where the so-what helps; lists use one-line rows (vwLine). */
function card(d, opts = {}) {
  const { e } = d;
  return html`<article class="ecard ${d.fb?.state === 'irrelevant' ? 'is-muted' : ''}" data-ring="${d.ring.ring}" data-hot="${e.id}" data-blocks="${(e.bausteine || []).join(' ')}" style="--i:${opts.i ?? 0}">
    <div class="ecard-top">${ringLabel(d.ring.ring)}${moveLabel(d)}</div>
    <h3><a href="${themaHref(e.id)}">${e.title}</a></h3>
    <p class="so-what">${e.soWhat}</p>
    <footer class="ecard-foot">${feedbackButtons(e.id)}</footer>
  </article>`;
}

/* Level 3 on demand: lists show a few rows, then a quiet in-place "Alle (n)". The open lists are
   UI state of this file, kept while the page is open. */
const vwOpen = new Set();
function vwCapped(key, items, cap, render) {
  const open = vwOpen.has(key);
  const shown = open ? items : items.slice(0, cap);
  const toggle = items.length > cap
    ? html`<button type="button" class="btn btn--sm vw-more" id="vw-more-${key.replace(/[^\w-]/g, '_')}" data-vw-more="${key}" aria-expanded="${open}">${open ? t('vw.more.less') : t('vw.more.show', { n: items.length })}</button>`
    : '';
  return { body: shown.map(render), toggle };
}
const vwBlocksAttr = (d) => (d.e.bausteine || []).join(' ');
const vwTip = (s) => (s ? raw(`title="${esc(s)}"`) : '');

/** One row = one line: ring dot (the word sits in the tooltip and for screen readers), the title,
 *  at most one short meta. The whole row opens the detail. */
function vwLine(d, { meta = dueShort(d), href = themaHref(d.e.id), tip = '' } = {}) {
  const ring = RING[d.ring.ring].label;
  return html`<li class="vw-line ${d.fb?.state === 'irrelevant' ? 'is-muted' : ''}" data-hot="${d.e.id}" data-blocks="${vwBlocksAttr(d)}">
    <span class="vw-mark" style="--c:${ringColor(d.ring.ring)}" title="${ring}"><span class="sr-only">${ring}</span></span>
    <a class="vw-title" href="${href}" ${vwTip(tip)}>${d.e.title}</a>${meta ? html`<span class="vw-meta">${meta}</span>` : ''}</li>`;
}
/** At most `cap` rows by score, then "Alle (n)". */
function vwLines(key, items, empty, cap = 5) {
  if (!items.length) return empty ? html`<p class="empty">${empty}</p>` : '';
  const c = vwCapped(key, [...items].sort(byScore), cap, (d) => vwLine(d));
  return html`<ul class="vw-lines">${c.body}</ul>${c.toggle}`;
}

/* Linked highlighting inside the secondary views (Focus bus). One subscriber named 'views':
   building-block tiles light up, rows outside a block or family focus dim, and the same
   development elsewhere on the page gets a quiet fill. */
function vwFocus(f) {
  const main = document.getElementById('main');
  if (!main || !['neu', 'produkte'].includes(store.ui.route.view)) return;
  for (const tile of main.querySelectorAll('.vw-tile[data-hot-block]')) {
    const on = !!f && f.blocks.has(tile.dataset.hotBlock);
    tile.classList.toggle('is-lit', on);
    tile.classList.toggle('is-dimmed', !!f && !on && f.kind !== 'block');
  }
  for (const el of main.querySelectorAll('.ecard[data-hot], .vw-line[data-hot], .task[data-hot]')) {
    const id = el.dataset.hot;
    const inSet = f?.kind === 'block' && el.dataset.blocks != null ? el.dataset.blocks.split(' ').includes(f.key) : !!f && f.ids.has(id);
    el.classList.toggle('is-dimmed', !!f && f.kind !== 'entwicklung' && !inSet);
    el.classList.toggle('vw-is-twin', f?.kind === 'entwicklung' && inSet && !el.matches(':hover, :focus-within'));
  }
}
let vwBound = false;
function vwMount(view, main) {
  view.main = main;
  Focus.on('views', vwFocus);
  if (!vwBound) {
    vwBound = true;
    document.addEventListener('click', (ev) => {
      // In-place "Alle (n)" (own UI state, see vwOpen).
      const more = ev.target.closest?.('#main [data-vw-more]');
      if (more) {
        const k = more.dataset.vwMore;
        if (vwOpen.has(k)) vwOpen.delete(k); else vwOpen.add(k);
        commit();
        return;
      }
      // Table: the whole row opens the detail. The title link stays the keyboard target.
      const tr = ev.target.closest?.('#main tr[data-href]');
      if (!tr || ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
      if (ev.target.closest('a, button, input, select, label, summary') || String(getSelection?.() || '')) return;
      navigate(tr.dataset.href);
    });
  }
  view.update(true);
}

/* ---------- Neu: the task list (level 1) plus the weekly digest (level 2) ---------- */
let vwPrevOpen = null; // open task keys at the last render (a task done since then flashes once)

const Week = {
  mount(main) { vwPrevOpen = null; vwMount(this, main); },
  update(first) {
    const w = weekModel();
    const tm = tasksModel();
    const visitPossible = !!store.user.prevVisit;
    const visit = store.ui.weekMode === 'visit' && visitPossible;
    const period = t(visit ? 'vw.week.periodVisit' : 'vw.week.periodWeek', { from: fmtDay(w.since) });
    vwPrevOpen = tm.open.map((x) => x.key);

    // Human limits: about four things at once. So: one list to decide (similar proposals bundled into
    // one click), one list of what moved, every development at most ONCE on this page, at most 3 rows each.
    const isBatch = (x) => x.kind === 'confirm' && x.d.ring.ring === 'pruefen' && !x.d.ring.capped;
    const decide = tm.open.filter((x) => !isBatch(x));
    const batch = tm.open.filter(isBatch);
    const batchOpen = vwOpen.has('w-batch');
    const doneOpen = vwOpen.has('w-done');
    const decideRows = vwCapped('w-decide', decide, 3, (x) => taskRow(x));
    const batchRow = batch.length ? html`<li class="task vw-batch">
        <span class="task-mark" style="--c:${ringColor('pruefen')}" aria-hidden="true"></span>
        <button type="button" class="task-title vw-batch-toggle" data-vw-more="w-batch" aria-expanded="${batchOpen}" title="${t('vw.week.batchTip')}">${tn('vw.week.batch', batch.length, { ring: RING.pruefen.label })}${icon('chevron')}</button>
        <span class="task-act"><span class="decide"><button type="button" class="btn btn--sm btn--tonal" data-action="confirm-batch" data-ids="${batch.map((x) => x.d.e.id).join(' ')}">${icon('check')}${t('vw.week.batchAll')}</button></span></span>
      </li>${batchOpen ? batch.map((x) => taskRow(x)) : ''}` : '';
    const doneRow = tm.done.length ? html`<button type="button" class="btn btn--sm vw-more vw-done-toggle" data-vw-more="w-done" aria-expanded="${doneOpen}">${icon('check')}${t('vw.week.doneN', { n: tm.done.length })}</button>
      ${doneOpen ? html`<ul class="task-ul">${tm.done.map((x) => taskRow(x))}</ul>` : ''}` : '';
    const tasks = html`<section class="week-section vw-tasks" id="w-confirm" aria-labelledby="vw-tasks-title">
      <div class="vw-sec-top">${sectionHead(t('vw.week.tasks'), { id: 'vw-tasks-title' })}${tm.total ? taskProgress(tm) : ''}${tm.open.length ? html`<button type="button" class="btn btn--sm btn--primary vw-start" data-guide-start>${icon('play')}${tm.done.length ? t('guide.resume') : t('guide.start')}</button>` : ''}</div>
      ${tm.open.length ? html`<ul class="task-ul">${decideRows.body}${batchRow}</ul>${decideRows.toggle}` : html`<p class="empty">${t('task.allDone')}</p>`}
      ${doneRow}</section>`;

    // What moved: each development once (ring change before new before new evidence), skipping the ones above.
    const seen = new Set(tm.open.map((x) => x.d.e.id));
    const changes = [];
    for (const d of [...w.moved, ...w.created, ...w.belege]) if (!seen.has(d.e.id)) { seen.add(d.e.id); changes.push(d); }
    const tag = (d) => (d.moved ? moveLabel(d) : d.isNew ? html`<span class="badge badge--new">${t('common.isNew')}</span>` : tn('vw.week.newBelege', d.newBelege.length));
    const c = vwCapped('w-changes', changes, 3, (d) => vwLine(d, { meta: tag(d) }));
    const moved = changes.length ? html`<section class="week-section" id="w-moved">${sectionHead(t('vw.week.changes'), { count: changes.length })}<ul class="vw-lines">${c.body}</ul>${c.toggle}</section>` : '';
    const parked = w.later.length ? html`<section class="week-section vw-parked"><button type="button" class="btn btn--sm vw-more" data-vw-more="w-later" aria-expanded="${vwOpen.has('w-later')}">${icon('pause')}${t('vw.week.parkedN', { n: w.later.length })}</button>${vwOpen.has('w-later') ? html`<ul class="vw-lines">${w.later.map((d) => vwLine(d))}</ul>` : ''}</section>` : '';
    const sections = [moved, parked];
    const calib = '';

    this.main.innerHTML = esc(html`<div class="vw-page vw-week ${first ? 'view-enter' : ''}">
      <header class="page-header vw-head"><h1>${t('vw.week.h1')}</h1>
        ${visitPossible ? html`<div class="segmented" role="radiogroup" aria-label="${t('vw.week.modeGroup')}" title="${period}"><label><input type="radio" name="weekmode" value="week" data-weekmode ${store.ui.weekMode === 'week' ? 'checked' : ''}><span>${t('vw.week.mode7')}</span></label><label ${vwTip(visitPossible ? '' : t('vw.week.visitLater'))}><input type="radio" name="weekmode" value="visit" data-weekmode ${store.ui.weekMode === 'visit' ? 'checked' : ''} ${visitPossible ? '' : 'disabled'}><span>${t('vw.week.modeVisit')}</span></label></div>` : ''}</header>${filterBar({ scope: 'base' })}
      ${tasks}
      ${sections}
      ${sections.some(Boolean) ? '' : html`<p class="empty week-section">${t('vw.week.quiet')}</p>`}
      ${calib}
    </div>`);
    vwFocus(Focus.current);
    if (first && store.ui.route.query?.s === 'confirm') requestAnimationFrame(() => $('#w-confirm')?.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth' }));
  },
};

/* ---------- Produkte: building blocks first, then the family ---------- */
const VW_RINGS = ['handeln', 'pruefen', 'beobachten', 'offen'];
/** Counts by ring for one building block. */
function vwBlockStats(b, list) {
  const its = list.filter((d) => (d.e.bausteine || []).includes(b.id));
  const by = Object.fromEntries(VW_RINGS.map((r) => [r, its.filter((d) => d.ring.ring === r).length]));

}
/** The words behind a tile's number (tooltip and screen readers): "2 in „Jetzt handeln“, 1 in „Prüfen“". */
function vwTileLabel(b, s) {
  const rings = VW_RINGS.filter((r) => s.by[r]).map((r) => t('vw.prod.tileRing', { n: s.by[r], ring: RING[r].label })).join(', ');
  return t('vw.prod.tileAria', { name: b.full, n: tn('units.entwicklung', s.its.length), rings: rings || t('vw.prod.tileNone') });
}

function familyHits(id, list) {
  const fam = PRODUCT[id];
  const blocks = BAUSTEINE.filter((b) => b.families.includes(id)).map((b) => b.id);
  const explicit = list.filter((d) => (d.e.products || []).some((p) => p.family === id));
  const via = list.filter((d) => !explicit.includes(d) && (d.e.bausteine || []).some((b) => blocks.includes(b)));
  return { fam, blocks, explicit, via };
}
function famChip(id, list) {
  const h = familyHits(id, list);
  const ids = [...h.explicit, ...h.via].map((d) => d.e.id);
  const where = h.fam ? t('vw.prod.famTitle', { group: h.fam.group, pages: h.fam.catalogPages }) : t('vw.prod.famNotInCatalog');

}

const SourcesView = {
  mount(main) { vwMount(this, main); },
  update(first) {
    const u = store.ui.sources;
    const recs = SOURCES.records;
    const num = (n) => Number(n).toLocaleString(locale());
    const types = Object.entries(recs.reduce((m, r) => ((m[r.y] = (m[r.y] || 0) + 1), m), {})).sort((a, b) => b[1] - a[1]);
    const hosts = Object.entries(recs.reduce((m, r) => ((m[r.h] = (m[r.h] || 0) + 1), m), {})).sort((a, b) => b[1] - a[1]).slice(0, 40);
    const q = u.q.toLowerCase();
    if (!recs.length) {
      this.main.innerHTML = esc(html`<div class="vw-page ${first ? 'view-enter' : ''}"><header class="page-header vw-head"><h1>${t('vw.title.quellen')}</h1></header><p class="empty">${t('vw.src.none')}</p></div>`);
      return;
    }
    const list = recs.filter((r) => (u.cat === '' || r.c === Number(u.cat)) && (!u.type || r.y === u.type) && (!u.host || r.h === u.host) && (!q || `${r.t} ${r.y} ${r.w} ${r.h}`.toLowerCase().includes(q)));
    const PS = 50;
    const pages = Math.max(1, Math.ceil(list.length / PS));

/** Team weight as a diverging bar around 1.0 (limits 0.6 to 1.4), with the word next to it. */
function vwFactorRow(label, v) {
  const span = RULES.learn.max - 1;
  const w = Math.min(50, (Math.abs(v - 1) / span) * 50);
  const word = t(v < 0.995 ? 'vw.set.factorLess' : v > 1.005 ? 'vw.set.factorMore' : 'vw.set.factorNeutral');
  return html`<div class="vw-factor"><span class="vw-factor-name">${label}</span>
    <span class="vw-factor-bar" role="img" aria-label="${t('vw.set.factorAria', { v: fmtNum(v, 2), word })}"><i class="${v < 1 ? 'is-down' : 'is-up'}" style="width:${w}%"></i></span>
    <span class="vw-factor-v"><b class="num">${fmtNum(v, 2)}</b><span class="xs muted">${word}</span></span></div>`;
}

/* =============================================================================
   11  PANEL  (level 2 Thema, level 3 Detail)
   From 75rem the panel docks right under the header and the view shrinks beside it
   (no scrim: the radar stays clickable, another dot swaps the detail). Below 75rem it
   is a sheet with scrim, full width on phones. "Vollbild" widens it for deep reading.
   Inside, one column in three levels (v2.3 minimal: no outlines, one filled button, one line per row,
   explanations in tooltips):
     1. what to do: "Deine Aufgabe", one line per task, only when the task model has one here;
     2. the situation: sticky head (domain, title, one status line) and the Überblick tab;
     3. details: the tabs Einschätzung, Belege and Verlauf & Bewertung, and the Beleg view.
   All text comes from the 'pn' catalog (section 2).
   ============================================================================= */
let lastFocus = null;
let pnSeen = false;          // first call after boot: a deep link opens without animation
let pnTitleObs = null;       // mirrors the title into the panel head once it scrolls away
let pnHeadObs = null;        // keeps the sticky offsets right when the head wraps differently
let pnKeepTab = false;       // previous / next (J/K) keeps the current tab
const PN_TABS = ['overview', 'assessment', 'evidence', 'history'];
const PN_DONE_MS = 1600;     // a finished task shows "Erledigt" this long, then collapses
const pnTaskMem = { id: null, open: new Set(), doneAt: new Map(), timer: 0 };

/** The list J/K steps through: what the filters show, most important first. */
function pnNeighbours(id) {
  const list = visible().sort(byScore);
  const i = list.findIndex((x) => x.e.id === id);
  return { list, i, prev: i > 0 ? list[i - 1] : null, next: i >= 0 ? list[i + 1] || null : list[0] || null };
}

/** Opens, swaps or closes the panel after a route change. Called by the router and by commit(). */
function updatePanel(prev = {}) {
  const r = store.ui.route;
  const panel = $('#panel');
  const scrim = $('#scrim');
  const body = $('#panel-body');
  const cls = document.body.classList;
  const open = !!(r.e && store.derived.byId[r.e]);
  const wasOpen = panel.classList.contains('is-open');
  if (open) {
    const changed = prev.e !== r.e || prev.b !== r.b || !wasOpen;
    // A new development starts on Überblick; stepping with previous / next keeps the tab.
    if ((prev.e !== r.e || !wasOpen) && !(pnKeepTab && wasOpen)) store.ui.pnTab = 'overview';
    pnKeepTab = false;
    if (!wasOpen) lastFocus = document.activeElement;
    if (!pnSeen) { cls.add('pn-still'); requestAnimationFrame(() => requestAnimationFrame(() => cls.remove('pn-still'))); }
    const keep = body.scrollTop;
    renderPanel();
    if (changed) {
      body.scrollTop = 0;
      if (wasOpen) { body.classList.remove('is-swapping'); void body.offsetWidth; body.classList.add('is-swapping'); }
      requestAnimationFrame(() => $('#panel-title')?.focus({ preventScroll: true }));
    } else {
      body.scrollTop = keep;
      // Guided check: once this step is done, keyboard focus goes to "Weiter" (Enter continues).
      const next = $('#panel [data-guide-next]');
      if (store.ui.guide && next && (!document.activeElement || document.activeElement === document.body || !panel.contains(document.activeElement))) requestAnimationFrame(() => next.focus({ preventScroll: true }));
    }
    panel.inert = false;
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    cls.add('pn-docked', 'pn-anim');
    pnApplyFull();
    scrim.hidden = false;
    requestAnimationFrame(() => scrim.classList.add('is-open'));
  } else if (wasOpen) {
    store.ui.guide = false; // closing the panel ends the guided check
    const hadFocus = panel.contains(document.activeElement) || document.activeElement === document.body;
    panel.classList.remove('is-open', 'is-scrolled');
    panel.setAttribute('aria-hidden', 'true');
    panel.inert = true;
    store.ui.pnFull = false;
    pnApplyFull();
    cls.remove('pn-docked');
    scrim.classList.remove('is-open');
    setTimeout(() => { if (!panel.classList.contains('is-open')) { scrim.hidden = true; cls.remove('pn-anim'); } }, 420);
    if (hadFocus) {
      // The view may have re-rendered while the panel was open: fall back to the item's row or dot.
      const back = lastFocus && document.contains(lastFocus) && lastFocus !== document.body ? lastFocus
        : prev.e ? $(`#main [data-hot="${CSS.escape(prev.e)}"]`) : null;
      if (back) back.focus({ preventScroll: true });
    }
  }
  pnSeen = true;
}

const closePanel = () => navigate(routeHref({ ...store.ui.route, e: null, b: null }));

/** Vollbild: UI state only (store.ui.pnFull), reset when the panel closes. */
function pnApplyFull() {
  const panel = $('#panel');
  const on = !!store.ui.pnFull && panel.classList.contains('is-open');
  panel.classList.toggle('is-full', on);
  document.body.classList.toggle('pn-full', on);
  $('#main').inert = on; // covered by the panel: keep keyboard focus out of it
  const b = $('#pn-full');
  if (b) {
    b.setAttribute('aria-pressed', String(on));
    b.title = on ? t('pn.fullExit') : t('pn.full');
    b.innerHTML = esc(icon(on ? 'collapse' : 'expand'));
  }
}

/** Tabs: UI state only (store.ui.pnTab). Switching shows the panel without re-rendering. */
function pnSelectTab(id, focus = false) {
  if (!PN_TABS.includes(id)) return;
  store.ui.pnTab = id;
  for (const tb of $$('#panel [role="tab"]')) {
    const on = tb.dataset.pnTab === id;
    tb.setAttribute('aria-selected', String(on));
    tb.tabIndex = on ? 0 : -1;
    if (on && focus) tb.focus({ preventScroll: true });
  }
  for (const p of $$('#panel [role="tabpanel"]')) p.hidden = p.dataset.pnTab !== id;
  // Scrolled past the tab bar: start the new tab at its top, right under the bar.
  const body = $('#panel-body');
  const anchor = $('#panel .pn-tabs-anchor');
  if (anchor) {
    const y = anchor.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
    const stuck = parseFloat(getComputedStyle(body).getPropertyValue('--pn-tabs-top')) || 0;
    if (body.scrollTop > y - stuck) body.scrollTop = Math.max(0, y - stuck);
  }
}

/** Panel events (called once at boot). */
function bindPanel() {
  document.addEventListener('click', (ev) => {
    const c = (s) => ev.target.closest(s);
    let x;
    if (c('#panel-close') || (c('#scrim') && !c('#panel'))) closePanel();
    else if (c('#panel-back')) navigate(themaHref(store.ui.route.e));
    else if (c('#pn-full')) { store.ui.pnFull = !store.ui.pnFull; pnApplyFull(); }
    else if ((x = c('#panel [role="tab"]'))) pnSelectTab(x.dataset.pnTab);
    else if (c('#panel .pn-step[href]')) pnKeepTab = true;
    else if ((x = c('#panel [data-pn-more]'))) {
      // "+n" families: reveal the rest in place and move focus to the first of them.
      const rest = [...x.parentElement.querySelectorAll('.pn-fam[hidden]')];
      for (const el of rest) el.hidden = false;
      x.remove();
      rest[0]?.focus({ preventScroll: true });
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.defaultPrevented || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    // Tabs: arrow keys, Home and End move between them (automatic activation).
    const tab = ev.target.closest?.('#panel [role="tab"]');
    if (tab) {
      const tabs = $$('#panel [role="tab"]');
      const i = tabs.indexOf(tab);
      const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[ev.key];
      if (to != null) { ev.preventDefault(); pnSelectTab(tabs[(to + tabs.length) % tabs.length].dataset.pnTab, true); return; }
    }
    // J / K step through the current list while the panel is open (never while typing).
    if (ev.repeat) return;
    const k = ev.key.toLowerCase();
    if ((k !== 'j' && k !== 'k') || !$('#panel').classList.contains('is-open') || $('#search')?.open) return;
    if (ev.target.closest?.('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
    const n = pnNeighbours(store.ui.route.e);
    const to = k === 'j' ? n.next : n.prev;
    if (to) { ev.preventDefault(); pnKeepTab = true; navigate(themaHref(to.e.id)); }
  });
  const body = $('#panel-body');
  if ('IntersectionObserver' in window) {
    pnTitleObs = new IntersectionObserver(([en]) => {
      $('#panel').classList.toggle('is-scrolled', !en.isIntersecting && en.boundingClientRect.top < (en.rootBounds?.top ?? 0) + 8);
    }, { root: body, rootMargin: '-24px 0px 0px 0px', threshold: 0 });
  }
  if ('ResizeObserver' in window) pnHeadObs = new ResizeObserver(() => pnStick());
  // Hovering a building block (here or anywhere) or another dot lights the matching blocks in the detail.
  Focus.on('panel', (f) => {
    const on = f && (f.kind === 'block' || f.kind === 'entwicklung') ? f.blocks : null;
    for (const el of $$('#panel .pn-block')) el.querySelector('.bb-icon')?.classList.toggle('is-lit', !!on && on.has(el.dataset.hotBlock));
  });
}

/** The head sticks with only its status line visible; the tabs stick right below it. */
function pnStick() {
  const body = $('#panel-body');
  const head = $('#panel-body .pn-head');
  const line = head?.querySelector('.pn-status');
  if (!head || !line) return;
  const off = Math.max(0, line.offsetTop - 4); // the head is sticky, so it is the line's offsetParent
  body.style.setProperty('--pn-head-off', `${off}px`);
  body.style.setProperty('--pn-tabs-top', `${head.offsetHeight - off}px`);
}

function renderPanel() {
  const { e: eId, b: bId } = store.ui.route;
  const d = eId ? store.derived.byId[eId] : null;
  const body = $('#panel-body');
  if (!d) { body.innerHTML = ''; return; }
  const viewTitle = VIEWS[store.ui.route.view]?.title || T.nav.uebersicht;
  const baseHref = routeHref({ ...store.ui.route, e: null, b: null });
  const b = bId ? store.data.belege[bId] : null;
  // Crumbs only one level deep (a Beleg); on the topic itself the close button is all the way back.
  $('#panel-crumbs').innerHTML = b ? esc(html`<a href="${themaHref(d.e.id)}">${T.levels[1]}</a>${icon('chevron')}<span aria-current="page">${T.levels[2]}</span>`) : '';
  void viewTitle; void baseHref;
  $('#panel-back').hidden = !b;
  $('#pn-headtitle').textContent = b ? b.title : d.e.title;
  $('#pn-tools').innerHTML = esc(pnTools(d));
  const tasks = b ? [] : pnTasksFor(d);
  body.innerHTML = esc(html`<div class="pn-doc">${b ? belegDetail(d, b) : thema(d, tasks)}</div>`);
  if (pnTitleObs) { pnTitleObs.disconnect(); const ttl = $('#panel-title'); if (ttl) pnTitleObs.observe(ttl); }
  if (pnHeadObs) { pnHeadObs.disconnect(); const head = $('#panel-body .pn-head'); if (head) pnHeadObs.observe(head); }
  pnStick();
  pnScheduleCollapse(tasks);
  Focus.current && Focus.emit();
}

/** Bar tools, all quiet icons: position in the list, previous / next (J/K), Vollbild. */
function pnTools(d) {
  const n = pnNeighbours(d.e.id);
  const step = (to, dir) => {
    const label = t(dir === 'prev' ? 'pn.prev' : 'pn.next');
    return to ? html`<a class="btn btn--icon pn-step pn-step--${dir}" href="${themaHref(to.e.id)}" aria-label="${t('pn.stepTo', { label, title: to.e.title })}" title="${label}">${icon('chevron')}</a>`
      : html`<button type="button" class="btn btn--icon pn-step pn-step--${dir}" disabled aria-label="${label}">${icon('chevron')}</button>`;
  };
  const full = !!store.ui.pnFull;
  if (store.ui.guide) {
    const g = guideModel();
    const i = Math.min(g.total, g.done + (g.queue.includes(d.e.id) ? 1 : 0));
    return html`<span class="pn-guide" role="status">${t('guide.step', { i: fmtNum(Math.max(1, i), 0), n: fmtNum(g.total, 0) })}<span class="task-progress"><i style="--p:${g.total ? g.done / g.total : 1}"></i></span></span>
    <button type="button" class="btn btn--icon pn-fullbtn" id="pn-full" aria-pressed="${full}" aria-label="${t('pn.full')}" title="${full ? t('pn.fullExit') : t('pn.full')}">${icon(full ? 'collapse' : 'expand')}</button>`;
  }
  return html`${n.list.length > 1 ? html`${step(n.prev, 'prev')}${step(n.next, 'next')}` : ''}
    <button type="button" class="btn btn--icon pn-fullbtn" id="pn-full" aria-pressed="${full}" aria-label="${t('pn.full')}" title="${full ? t('pn.fullExit') : t('pn.full')}">${icon(full ? 'collapse' : 'expand')}</button>`;
}

/* ---------- Level 1: the task for this development ---------- */

/** Tasks of this development: the open ones, plus one that was just finished here (shown as
 *  "Erledigt" for PN_DONE_MS, then collapsed). A task finished elsewhere earlier does not show. */
function pnTasksFor(d) {
  const mem = pnTaskMem;
  const all = itemTasks(d);
  if (mem.id !== d.e.id) { mem.id = d.e.id; mem.open = new Set(); mem.doneAt.clear(); }
  const now = Date.now();
  for (const x of all) {
    if (!x.done) { mem.open.add(x.key); mem.doneAt.delete(x.key); } else if (mem.open.has(x.key)) { mem.open.delete(x.key); mem.doneAt.set(x.key, now); }
  }
  return all.filter((x) => !x.done || now - (mem.doneAt.get(x.key) ?? -Infinity) < PN_DONE_MS);
}

function pnScheduleCollapse(tasks) {
  clearTimeout(pnTaskMem.timer);
  const done = tasks.filter((x) => x.done);
  if (!done.length) return;
  // The button that finished the task is gone: keep keyboard focus on its "Erledigt" line.
  requestAnimationFrame(() => { if (!document.activeElement || document.activeElement === document.body) $('#panel .pn-task-item.is-done')?.focus({ preventScroll: true }); });
  const left = Math.max(0, ...done.map((x) => PN_DONE_MS - (Date.now() - pnTaskMem.doneAt.get(x.key))));
  pnTaskMem.timer = setTimeout(() => {
    const box = $('#panel .pn-task');
    const items = $$('#panel .pn-task-item');
    if (!box || !items.some((el) => el.classList.contains('is-done'))) return;
    const hadFocus = box.contains(document.activeElement);
    for (const el of items.every((x) => x.classList.contains('is-done')) ? [box] : items.filter((x) => x.classList.contains('is-done'))) el.classList.add('is-gone');
    setTimeout(() => {
      if (!$('#panel').classList.contains('is-open')) return;
      const restore = captureFocus();
      const body = $('#panel-body');
      const keep = body.scrollTop;
      renderPanel();
      body.scrollTop = keep;
      if (hadFocus) $('#panel [role="tab"][aria-selected="true"]')?.focus({ preventScroll: true }); else restore();
    }, reducedMotion() ? 0 : 240);
  }, left + 20);
}

/** One line per task: small kind label (the reason in its tooltip), then the action.
 *  The first open task holds the panel's only filled button. */
function pnTaskBox(tasks) {
  const first = tasks.find((x) => !x.done);
  return html`<section class="pn-task" aria-label="${t(tasks.length > 1 ? 'pn.task.titleMany' : 'pn.task.title')}"><div class="pn-task-clip"><ul class="pn-task-ul">
    ${tasks.map((x) => html`<li class="pn-task-item ${x.done ? 'is-done' : ''}" data-task="${x.key}" ${x.done ? raw('tabindex="-1"') : ''}><div class="pn-task-in"><div class="pn-task-line">
      <span class="pn-task-kind" title="${taskWhy(x)}">${icon('target')}${t(`task.kind.${x.kind}`)}</span>
      <span class="pn-task-act">${taskActions(x, { primary: x === first })}</span>
    </div></div></li>`)}
  </ul></div></section>`;
}

/* ---------- Level 2: the topic ---------- */

/** A section is a small label plus content. `tip` holds the explanation (tooltip only). */
const pnSec = (title, body, cls = '', tip = '') => html`<section class="pn-sec ${cls}"><h3 class="pn-label" ${tip ? raw(`title="${esc(tip)}"`) : ''}>${title}</h3>${body}</section>`;
const pnList = (parts) => { try { return new Intl.ListFormat(locale(), { type: 'conjunction' }).format(parts); } catch { return parts.join(', '); } };
const pnDemoBadge = () => html`<span class="badge badge--demo" title="${t('pn.demoTitle')}">${t('pn.demo')}</span>`;

/** t() with markup in the placeholders: the catalog text is escaped, the values stay html. */
function pnRich(key, vars) {
  return raw(String(t(key)).split(/(\{\w+\})/).map((part) => {
    const m = part.match(/^\{(\w+)\}$/);
    return esc(m && vars[m[1]] != null ? vars[m[1]] : part);
  }).join(''));
}

function thema(d, tasks = []) {
  const openTriage = tasks.find((x) => !x.done)?.kind === 'triage';
  let tab = PN_TABS.includes(store.ui.pnTab) ? store.ui.pnTab : 'overview';
  const tabs = [
    ['overview', t('pn.tabs.overview'), pnOverview(d, openTriage)],
    ['assessment', t('pn.tabs.assessment'), pnAssessment(d)],
    ['evidence', html`${t('pn.tabs.evidence')} <span class="pn-tab-n num">${fmtNum(d.belege.length, 0)}</span>`, pnEvidence(d)],
    ['history', t('pn.tabs.history'), pnHistory(d)],
  ].filter(([id]) => (id === 'assessment' ? pnHasClaims(d) : id === 'evidence' ? d.belege.length > 0 : true)); // no empty tabs
  if (!tabs.some(([id]) => id === tab)) tab = 'overview';
  // No separate task box: the open decision sits in the status line, a due forecast in its own line.
  return html`
    ${pnHead(d, tasks.filter((x) => !x.done))}
    <span class="pn-tabs-anchor" aria-hidden="true"></span>
    <div class="pn-tabs" role="tablist" aria-label="${t('pn.tabs.label')}">${tabs.map(([id, label]) => html`<button type="button" role="tab" class="pn-tab" id="pn-tab-${id}" data-pn-tab="${id}" aria-controls="pn-tp-${id}" aria-selected="${id === tab}" tabindex="${id === tab ? 0 : -1}">${label}</button>`)}</div>
    ${tabs.map(([id, , content]) => html`<section class="pn-tp" role="tabpanel" id="pn-tp-${id}" data-pn-tab="${id}" aria-labelledby="pn-tab-${id}" tabindex="0" ${id === tab ? '' : raw('hidden')}>${content}</section>`)}`;
}

const pnHasClaims = (d) => { const st = d.e.statements || {}; return ['facts', 'inferences', 'hypotheses', 'openQuestions', 'recommendation'].some((k) => (st[k] || []).length); };

/** Sticky head: domain (secondary ones in the tooltip), title, one status line with three items
 *  (ring, confidence, due) and the quiet "…" ring select at its end. */
function pnHead(d, open) {
  const { e } = d;
  const r = d.ring;
  const src = r.source === 'pm' ? (r.decision?.at ? t('pn.status.pmAt', { date: fmtDate(r.decision.at) }) : t('pn.status.pm'))
    : r.source === 'engine' ? t('pn.status.engine') : t('pn.status.none');
  const ringTip = d.moved && RING[d.prevRing] ? t('pn.status.moved', { src, from: RING[d.prevRing].label }) : src;
  const also = (e.domainsSecondary || []).filter((x) => DOMAIN[x]).map(domainText);
  const due = dueShort(d);
  const hidden = !visible().some((x) => x.e.id === e.id);
  return html`<header class="pn-head">
    ${hidden ? html`<p class="pn-hidden">${icon('filter')}<span>${t('pn.hiddenByFilter')}</span><button type="button" class="btn btn--sm" data-action="reset-filters">${t('common.resetFilters')}</button></p>` : ''}
    <div class="pn-eyebrow"><span class="eyebrow" ${also.length ? raw(`title="${esc(t('pn.also', { list: pnList(also) }))}"`) : ''}>${domainText(e.domain)}</span></div>
    <h2 class="pn-title" id="panel-title" tabindex="-1">${e.title}</h2>
    <div class="pn-status">
      <span class="pn-ring" title="${ringTip}">${ringLabel(r.ring)}${r.source === 'engine' ? html`<span class="pn-src">${t('common.proposal')}</span>` : ''}</span>
      ${confLabel(d.conf)}
      ${due ? html`<span class="pn-due" title="${t('pn.dueTitle', { h: horizonText(e) })}">${due}</span>` : ''}
      <span class="pn-act">${pnAction(d, open)}</span>
    </div>
  </header>`;
}

/** The one thing to do here, at the end of the status line: the question and its buttons for the first
 *  open task; in the guided check also "Später", and "Weiter" once this step is done. */
function pnAction(d, open) {
  const first = open[0];
  if (first) {
    return html`<span class="pn-ask">${guideAsk(first)}</span>${taskActions(first, { primary: true })}${store.ui.guide ? html`<button type="button" class="btn btn--sm pn-skip" data-guide-skip>${t('guide.skip')}</button>` : ''}`;
  }
  if (store.ui.guide) {
    const more = guideModel().queue.some((id) => id !== d.e.id);
    return html`${pnRingMore(d)}<button type="button" class="btn btn--sm btn--primary pn-next" data-guide-next>${more ? t('guide.next') : t('guide.finish')}${icon(more ? 'arrow' : 'check')}</button>`;
  }
  return pnRingMore(d);
}

/** The quiet "…" select that sets or changes the ring (handled globally via data-decide-select). */
function pnRingMore(d) {
  const r = d.ring;
  const cur = r.decision?.value != null ? ringForValue(r.decision.value) : null;
  const label = t(r.source === 'pm' ? 'common.changeSelect' : 'common.otherSelect');
  return html`<select class="select select--more pn-more" data-decide-select="${d.e.id}" aria-label="${t('common.decideChange')}" title="${label}">
    <option value="">…</option>
    ${RING_CHOICES.map((c) => html`<option value="${c.value}" ${cur === c.ring ? 'disabled' : ''}>${RING[c.ring].label}</option>`)}
    ${r.source === 'pm' ? html`<option value="reset">${t('common.resetProposal')}</option>` : ''}
  </select>`;
}

/** Überblick: what it means, which products, the forecast, feedback. */
function pnOverview(d, feedbackInHead) {
  return html`
    <section class="pn-sowhat"><h3 class="pn-label">${t('pn.soWhat')}</h3><p>${d.e.soWhat}</p></section>
    ${pnProducts(d)}
    ${d.forecast ? pnForecast(d) : ''}
    ${feedbackInHead ? '' : pnFeedback(d)}`;
}

/** Building blocks, then at most three families as chips; the rest behind "+n". */
function pnProducts(d) {
  const { e } = d;
  const keepE = (r) => routeHref({ ...r, e: e.id, b: null }); // product links keep the detail open beside them
  const famHref = (id) => keepE({ view: 'produkte', sub: 'familie', sub2: encodeURIComponent(id) });
  const blocks = (e.bausteine || []).filter((id) => BAUSTEIN[id]);
  const rank = { explizit: 0, belegt: 1, hypothese: 2 };
  const fams = (e.products || []).filter((p) => PRODUCT[p.family])
    .map((p, i) => ({ p, i })).sort((a, b) => (rank[a.p.basis] ?? 3) - (rank[b.p.basis] ?? 3) || a.i - b.i).map((x) => x.p);
  const via = [...new Set(blocks.flatMap((id) => BAUSTEIN[id].families || []))].filter((id) => PRODUCT[id] && !fams.some((p) => p.family === id));
  const chip = (id, basis, tip, hide) => html`<a class="pn-fam" data-basis="${basis}" href="${famHref(id)}" title="${tip}" ${hide ? raw('hidden') : ''}>${PRODUCT[id]?.name || id}</a>`;
  const all = [
    ...fams.map((p) => [p.family, p.basis, p.why ? t('pn.famTip', { basis: BASIS[p.basis] || p.basis, why: p.why }) : (BASIS[p.basis] || p.basis)]),
    ...via.map((id) => [id, 'hypothese', t('pn.viaTip')]),
  ];
  return pnSec(t('pn.products'), html`
    ${blocks.length ? html`<div class="pn-blocks">${blocks.map((id) => html`<a class="pn-block" href="${keepE({ view: 'produkte', sub: id, sub2: null })}" data-hot-block="${id}" aria-label="${BAUSTEIN[id].full}">${blockIcons([id], { names: true })}</a>`)}</div>`
      : html`<p class="pn-none">${t('pn.noBlock')}</p>`}
    ${all.length ? html`<div class="pn-fams"><button type="button" class="pn-fam pn-fam--more" data-pn-more aria-expanded="false">${tn('units.familie', all.length)}</button>${all.map(([id, basis, tip]) => chip(id, basis, tip, true))}</div>` : ''}`, 'pn-products');
}

/** Prognose as one line: statement, probability, a thin meter. Expected date and criterion in the
 *  tooltip and in Verlauf & Bewertung. Resolving it is the task above when it is due. */
function pnForecast(d) {
  const f = d.forecast;
  const resolved = f.status && f.status !== 'offen';
  const yes = f.status === 'eingetreten';
  const tip = t(d.due ? 'pn.fc.tipDue' : 'pn.fc.tip', { date: fmtDate(f.expected, 'long'), criterion: f.criterion || t('pn.fc.noCriterion') });
  return pnSec(t('pn.fc.title'), html`<div class="pn-fc-row" title="${tip}">
    <p class="pn-fc-q">${f.statement}</p>
    ${resolved ? html`<span class="pn-fc-res">${icon(yes ? 'check' : 'x')}${t(yes ? 'task.forecastYes' : 'task.forecastNo')}</span><button type="button" class="btn btn--sm btn--icon" data-forecast="offen" data-id="${d.e.id}" aria-label="${t('pn.fc.reset')}" title="${t('pn.fc.reset')}">${icon('refresh')}</button>`
      : html`<span class="pn-fc-p num">${pct(f.probability)}</span><span class="meter pn-fc-meter" role="img" aria-label="${t('pn.fc.probAria', { p: pct(f.probability) })}"><i style="width:${Math.round(f.probability * 100)}%"></i></span>`}
  </div>`);
}

/** Rückmeldung: the icon-only control (unless the task above holds it), the team count, a comment. */
function pnFeedback(d) {
  const { e } = d;
  const fb = store.user.feedback[e.id];
  const team = d.team;
  const parts = team ? ['relevant', 'irrelevant', 'later'].filter((k) => team[k]).map((k) => t(`pn.team.${k}`, { n: fmtNum(team[k], 0) })) : [];

/** Evidence on a time axis: when did it happen, when did the radar see it (feedback: GModG test).
 *  HTML, not a scaled SVG, so labels keep their size in a narrow column. Legend and lag in the tooltip. */
function timeline(d) {
  const pts = d.belege.map((b) => ({ b, ts: parseDate(b.published) })).filter((x) => x.ts);
  const seen = parseDate(d.e.firstSeen);
  if (!pts.length) return '';
  const times = [...pts.map((x) => x.ts), ...(seen ? [seen] : [])];
  let t0 = Math.min(...times); let t1 = Math.max(...times);
  if (t1 - t0 < 864e5 * 14) { t0 -= 864e5 * 7; t1 += 864e5 * 7; }
  const X = (ms) => ((ms - t0) / (t1 - t0)) * 100;
  const first = Math.min(...pts.map((x) => x.ts));
  const lag = seen ? Math.round((seen - first) / 864e5) : null;
  const sx = seen ? X(seen) : null;
  const lagText = lag == null ? '' : `${lag <= 0 ? t('pn.tl.sameDay') : t('pn.tl.lag', { days: tn('units.tag', lag) })}`;
  const tip = lagText ? `${t('pn.tl.legend')} ${lagText}` : t('pn.tl.legend');
  return html`<div class="pn-tl" role="img" aria-label="${tip}" title="${tip}">
    <div class="pn-tl-axis">
      ${pts.map(({ b, ts }) => html`<span class="pn-tl-dot ${b.source.primary ? 'is-primary' : ''}" style="left:${X(ts).toFixed(1)}%" title="${b.source.name}: ${b.title} (${fmtDate(b.published)})"></span>`)}
      ${seen ? html`<span class="pn-tl-seen ${sx > 80 ? 'is-end' : sx < 20 ? 'is-start' : ''}" style="left:${sx.toFixed(1)}%"><span>${t('pn.tl.seen')}</span></span>` : ''}
    </div>
    <div class="pn-tl-ends"><span>${fmtDate(isoDay(new Date(t0)))}</span><span>${fmtDate(isoDay(new Date(t1)))}</span></div></div>`;
}

/** Indicator (feedback on the use cases: "What would you see if it changes?"). One series:
 *  thin bars on a shared baseline, the latest one labelled, values on hover and for screen readers. */
function indicatorChart(ind) {
  const series = ind.series || [];
  if (!series.length) return '';
  const max = Math.max(...series.map((p) => p.value), 1);
  const unit = ind.unit ? ` ${ind.unit}` : '';
  const val = (p) => `${Number(p.value).toLocaleString(locale())}${unit}`;
  return pnSec(t('pn.ind.title'), html`<p class="pn-ind-name">${ind.name}${ind.demo ? html` <span class="badge badge--demo">${t('pn.ind.demo')}</span>` : ''}</p>
    <div class="pn-bars" style="--n:${series.length}" role="img" aria-label="${ind.name}: ${series.map((p) => `${p.period} ${val(p)}`).join(', ')}">
      ${series.map((p, i) => { const last = i === series.length - 1; return html`<div class="pn-b ${last ? 'is-last' : ''}" title="${p.period}: ${val(p)}"><span class="pn-b-plot">${last ? html`<b>${val(p)}</b>` : ''}<i style="height:${Math.max(2, (p.value / max) * 78).toFixed(1)}%"></i></span><span class="pn-b-x">${p.period}</span></div>`; })}
    </div>`, 'pn-ind', ind.source ? t('pn.ind.source', { source: ind.source }) : '');
}

/* =============================================================================
   12  ROUTER & EVENTS
   Routes:  #/uebersicht  #/neu  #/produkte[/<baustein>|/familie/<id>]
            #/tabelle  #/quellen  #/usecases  #/einstellungen  #/daten
   Panel:   ?e=<entwicklungId>[&b=<belegId>] on top of any route (deep links work).
   ============================================================================= */
const RUNTIME_ERRORS = [];
window.addEventListener('error', (ev) => RUNTIME_ERRORS.push(ev.message));
window.addEventListener('unhandledrejection', (ev) => RUNTIME_ERRORS.push(String(ev.reason?.message || ev.reason)));

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs = ''] = h.split('?');
  const parts = path.split('/').filter(Boolean).map((p) => { try { return decodeURIComponent(p); } catch { return p; } });
  const q = new URLSearchParams(qs);
  const view = VIEWS[parts[0]] ? parts[0] : 'uebersicht';
  return { view, sub: parts[1] || null, sub2: parts[2] || null, e: q.get('e'), b: q.get('b'), query: Object.fromEntries(q) };
}
function navigate(href) {
  if (location.hash === href) onRoute();
  else location.hash = href;
}

let mountedView = '';
function onRoute() {
  const prev = store.ui.route;
  const r = parseRoute();
  store.ui.route = r;
  store.ui.filterOpen = false;
  closeMenu();
  const viewChanged = r.view !== mountedView;
  const run = () => {
    const restore = viewChanged ? () => {} : captureFocus();
    if (viewChanged) mountView(r.view, !!mountedView);
    else VIEWS[r.view].view.update();
    updatePanel(prev);
    renderNav();
    restore();
    if (!viewChanged && r.view === 'produkte' && r.sub !== prev.sub) $('.bb-detail')?.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'nearest' });
  };
  if (viewChanged && mountedView && document.startViewTransition && !reducedMotion() && document.visibilityState === 'visible') {
    const vt = document.startViewTransition(run);
    // A newer navigation may skip this transition; that is expected, not an error.
    for (const p of [vt.ready, vt.finished, vt.updateCallbackDone]) p?.catch(() => {});
  } else run();
}

function mountView(view, focusMain) {
  mountedView = view;
  VIEWS[view].view.mount($('#main'));
  document.title = `${VIEWS[view].title} · RIDI Marktradar`;
  if (focusMain) { window.scrollTo({ top: 0 }); $('#main').focus({ preventScroll: true }); }
}

/** Re-rendering replaces DOM nodes; this keeps keyboard focus where it was. */
function captureFocus() {
  const el = document.activeElement;
  if (!el || el === document.body || el === $('#main')) return () => {};
  let sel = el.id ? `#${CSS.escape(el.id)}` : null;
  if (!sel) {
    const attrs = ['data-fb', 'data-id', 'data-decide', 'data-decide-select', 'data-forecast', 'data-sort', 'data-page', 'data-move', 'data-dir', 'data-domain-on',
      'data-weight', 'data-pref', 'data-filter', 'data-clear', 'data-action', 'data-hot', 'data-scroll', 'data-src', 'data-weekmode', 'value', 'name'];
    const parts = attrs.filter((a) => el.hasAttribute(a)).map((a) => `[${a}="${CSS.escape(el.getAttribute(a))}"]`);
    sel = parts.length ? el.tagName.toLowerCase() + parts.join('') : null;
  }
  const start = el.selectionStart;
  const end = el.selectionEnd;
  // The same control can exist in the view and in the panel (e.g. feedback): look in the same area first.
  const area = el.closest('#panel, #main, .app-header');
  const areaSel = area ? (area.id ? `#${area.id}` : '.app-header') : null;
  return () => {
    if (!sel || document.activeElement === el) return;
    const next = (areaSel && document.querySelector(`${areaSel} ${sel}`)) || document.querySelector(sel);
    if (!next) return;
    next.focus({ preventScroll: true });
    if (start != null && typeof next.setSelectionRange === 'function') { try { next.setSelectionRange(start, end); } catch { /* not a text field */ } }
  };
}

/** Batches all changes of one interaction into a single render (microtask: no dependency on frames). */
let queued = false;
function commit() {
  if (queued) return;
  queued = true;
  queueMicrotask(() => {
    queued = false;
    const restore = captureFocus();
    derive();
    VIEWS[store.ui.route.view].view.update();
    if ($('#panel').classList.contains('is-open') || store.ui.route.e) updatePanel(store.ui.route);
    renderNav();
    renderHeader();
    restore();
  });
}

/** Fills the static texts of the page shell (data-i18n attributes in the HTML above). */

function storeTheme(theme) {

function showToast(text, action) {
  const host = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = esc(html`<span>${text}</span>${action ? html`<button type="button">${action.label}</button>` : ''}`);
  const close = () => { el.classList.add('is-leaving'); setTimeout(() => el.remove(), 220); };
  if (action) el.querySelector('button').addEventListener('click', () => { action.run(); close(); });
  host.append(el);
  while (host.children.length > 3) host.firstElementChild.remove();
  setTimeout(close, action ? 6500 : 4000);
}

/* ---------- Actions ---------- */
function setFeedback(id, state) {
  const prev = store.user.feedback[id] ? { ...store.user.feedback[id] } : null;
  const next = prev?.state === state ? '' : state;
  if (!next && !prev?.comment) delete store.user.feedback[id];
  else store.user.feedback[id] = { state: next, comment: prev?.comment || '', at: new Date().toISOString() };
  saveUser();
  syncFeedback(id);
  commit();
  const d = store.derived.byId[id];
  const msg = next ? T.feedbackEffect[next].replace('{domain}', d ? `„${domainText(d.e.domain)}“` : 'dieser Domäne') : T.feedbackEffect.cleared;
  showToast(msg, { label: t('shell.toastUndo'), run: () => { if (prev) store.user.feedback[id] = prev; else delete store.user.feedback[id]; saveUser(); syncFeedback(id); commit(); } });
}

/** My click also goes into the team store: feedback works as GLOBAL weights (use-case document). */
function syncFeedback(id) {
  const f = store.user.feedback[id];
  const key = `${id}__${meId()}`;
  writeShared('feedback', key, f && (f.state || f.comment) ? { entwicklungId: id, by: meId(), state: f.state || '', comment: f.comment || '', at: f.at } : undefined);
}

/** value: 1–5 sets a PM decision, null resets to the engine proposal, undefined removes the entry. */
async function writeShared(kind, id, value) {
  if (value === undefined) delete store.shared[kind][id]; else store.shared[kind][id] = value;
  commit();
  try { await store.adapter.saveShared(kind, id, value === undefined ? null : value); } catch {
    showToast(t('shell.toastSaveFail'));
  }
}
function setDecision(id, value) {
  const prev = store.shared.decisions[id];
  writeShared('decisions', id, { value, at: isoDay(new Date()), by: ArtifactDbAdapter.uid || 'lokal' });
  showToast(value == null ? t('shell.toastReset') : t('shell.toastDecision', { ring: RING[ringForValue(value)].label }),
    { label: t('shell.toastUndo'), run: () => writeShared('decisions', id, prev) });
}
/** One click for several similar proposals (e.g. all "Prüfen"): one toast, one undo for all. */
function setDecisions(ids, value) {
  const prev = Object.fromEntries(ids.map((id) => [id, store.shared.decisions[id]]));
  for (const id of ids) writeShared('decisions', id, { value, at: isoDay(new Date()), by: ArtifactDbAdapter.uid || 'lokal' });
  showToast(t('shell.toastDecisions', { n: ids.length, ring: RING[ringForValue(value)].label }),
    { label: t('shell.toastUndo'), run: () => { for (const id of ids) writeShared('decisions', id, prev[id]); } });
}
function setForecast(id, status) {
  const prev = store.shared.forecasts[id];
  writeShared('forecasts', id, status === 'offen' ? undefined : { status, resolvedAt: isoDay(new Date()) });
  if (status !== 'offen') showToast(status === 'eingetreten' ? t('shell.toastForecastYes') : t('shell.toastForecastNo'), { label: t('shell.toastUndo'), run: () => writeShared('forecasts', id, prev) });
}

function exportJson() { return JSON.stringify(buildExport(), null, 2); }
async function exportDownload() {
  const name = `marktradar-export-${isoDay(new Date())}.json`;
  const data = exportJson();
  if (typeof window.claude?.use === 'function') {
    const downloads = await window.claude.use('downloads');
    if (downloads) { try { await downloads.save({ filename: name, data }); return; } catch { /* declined or unavailable: fall through */ } }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch { store.ui.showExport = true; commit(); showToast(t('shell.toastDownloadBlocked')); }
}
async function exportCopy() {
  try { await navigator.clipboard.writeText(exportJson()); showToast(t('shell.toastCopied')); } catch {
    store.ui.showExport = true; commit(); showToast(t('shell.toastCopyBlocked'));
  }
}
function simulateRun() {
  const steps = DOMAINS.map((d) => d);
  store.ui.run = { p: 0, log: [`${new Date().toLocaleTimeString(locale())} ${t('shell.simStart')}`] };
  commit();
  let i = 0;
  const tick = setInterval(() => {
    const d = steps[i];
    const c = store.data.coverage[d.id];
    store.ui.run.log.push(c?.searched === false ? t('shell.simSkip', { domain: d.label }) : t('shell.simStep', { domain: d.label, sources: c?.sourcesChecked ?? 0, hits: c?.hits ?? 0 }));
    i += 1;
    store.ui.run.p = Math.round((i / steps.length) * 100);
    if (i >= steps.length) { clearInterval(tick); store.ui.run.log.push(t('shell.simDone')); }
    commit();
  }, 320);
}

/* ---------- Search (Ctrl+K) ---------- */
function openSearch() {
  const dlg = $('#search');
  if (dlg.open) return;
  dlg.showModal();
  $('#search-input').value = '';
  renderSearch('');
}
function renderSearch(q) {
  const s = q.trim().toLowerCase();
  const items = store.derived.items;
  const ents = (s ? items.filter((d) => `${d.e.title} ${d.e.soWhat} ${domainText(d.e.domain)}`.toLowerCase().includes(s)) : [...items].sort(byScore)).slice(0, 6);
  const fams = s ? PRODUCTS.filter((p) => `${p.name} ${p.group}`.toLowerCase().includes(s)).slice(0, 5) : [];
  const bel = s ? Object.values(store.data.belege).filter((b) => `${b.title} ${b.source.name}`.toLowerCase().includes(s)).slice(0, 5) : [];
  const sup = (b) => items.find((d) => (d.e.evidence || []).includes(b.id));
  let k = 0;
  const opt = (href, label, meta, ring) => html`<a href="${href}" role="option" id="sr-${k++}" aria-selected="${k === 1}">${ring ? html`<i class="ring-dot" data-ring="${ring}"></i>` : icon('box')}<span>${label}</span><span class="muted">${meta}</span></a>`;
  $('#search-results').innerHTML = esc(html`
    ${ents.length ? html`<h4>${s ? t('shell.searchDev') : t('shell.searchTop')}</h4>${ents.map((d) => opt(themaHref(d.e.id), d.e.title, domainText(d.e.domain), d.ring.ring))}` : ''}
    ${fams.length ? html`<h4>${t('shell.searchFam')}</h4>${fams.map((p) => opt(`#/produkte/familie/${encodeURIComponent(p.id)}`, p.name, p.group))}` : ''}
    ${bel.length ? html`<h4>${t('shell.searchBelege')}</h4>${bel.map((b) => { const d = sup(b); return d ? opt(belegHref(d.e.id, b.id), b.title, b.source.name) : ''; })}` : ''}
    ${!ents.length && !fams.length && !bel.length ? html`<p class="empty" style="margin:.5rem">${t('shell.searchNone')}</p>` : ''}`);
}

function bindEvents() {
  document.addEventListener('click', (ev) => {
    const tgt = ev.target;
    const c = (s) => tgt.closest(s);
    let x;
    if (!c('#menu') && !c('#menu-open')) closeMenu();
    if (store.ui.filterOpen && !c('#filter-pop') && !c('#filter-open')) { store.ui.filterOpen = false; commit(); }
    if ((x = c('[data-fb]'))) setFeedback(x.dataset.id, x.dataset.fb);
    else if ((x = c('[data-decide]'))) setDecision(x.dataset.id, Number(x.dataset.decide));
    else if ((x = c('[data-forecast]'))) setForecast(x.dataset.id, x.dataset.forecast);
    else if ((x = c('#menu-open'))) { if ($('#menu').hidden) openMenu(); else closeMenu(); }
    else if (c('[data-guide-start]')) startGuide();
    else if (c('[data-guide-next]')) guideNext(false);
    else if (c('[data-guide-skip]')) guideNext(true);
    else if (c('#search-open')) openSearch();
    else if (c('#filter-open')) { store.ui.filterOpen = !store.ui.filterOpen; commit(); }
    else if ((x = c('[data-clear]'))) {
      const k = x.dataset.clear;
      const p = store.user.prefs;
      if (k === 'domain') p.domain = null;
      else if (k === 'audience') p.audience = CONFIG.defaults.audience;
      else if (k === 'region') p.region = CONFIG.defaults.region;
      else p.filters[k] = 'all';
      saveUser(); commit();
    } else if (c('#toggle-changes')) {
      store.ui.showChanges = !store.ui.showChanges;
      commit();
      if (store.ui.showChanges) setTimeout(() => Overview.radar?.replay(), 60);
    } else if ((x = c('[data-scroll]'))) $(`#${x.dataset.scroll}`)?.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth' });
    else if ((x = c('[data-sort]'))) { const s = store.ui.sort; s.dir = s.key === x.dataset.sort ? -s.dir : 1; s.key = x.dataset.sort; commit(); }
    else if ((x = c('[data-page]'))) { store.ui.sources.page = Number(x.dataset.page); commit(); window.scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' }); }
    else if ((x = c('[data-move]'))) {
      const o = store.user.prefs.domainOrder; const i = o.indexOf(x.dataset.move); const j = i + Number(x.dataset.dir);
      if (j >= 0 && j < o.length) { [o[i], o[j]] = [o[j], o[i]]; saveUser(); commit(); }
    } else if ((x = c('[data-action]'))) {
      const a = x.dataset.action;
      if (a === 'close-note') store.ui.noteClosed = true;
      if (a === 'toggle-mobile-radar') store.ui.mobileRadar = !store.ui.mobileRadar;
      if (a === 'reset-feedback') store.ui.confirmReset = true;
      if (a === 'reset-feedback-no') store.ui.confirmReset = false;
      if (a === 'reset-feedback-yes') { const ids = Object.keys(store.user.feedback); store.user.feedback = {}; store.ui.confirmReset = false; saveUser(); ids.forEach(syncFeedback); showToast(t('shell.toastFeedbackDeleted')); }
      if (a === 'toggle-lens') store.ui.lensNew = !store.ui.lensNew;
      if (a === 'reset-filters') { const p = store.user.prefs; p.audience = CONFIG.defaults.audience; p.region = CONFIG.defaults.region; p.domain = null; p.filters = { published: 'all', expected: 'all', minConf: CONFIG.defaults.minConf, feedback: 'all' }; saveUser(); }
      if (a === 'show-help') { store.ui.ovHelp = true; closeMenu(); if (store.ui.route.view !== 'uebersicht') navigate('#/uebersicht'); }
      if (a === 'confirm-batch') setDecisions((x.dataset.ids || '').split(/\s+/).filter(Boolean), 3);
      if (a === 'simulate') simulateRun();
      if (a === 'export-download') exportDownload();
      if (a === 'export-copy') exportCopy();
      if (a === 'export-show') store.ui.showExport = !store.ui.showExport;
      commit();
    } else if (c('#search-results a')) $('#search').close();
    else if (tgt === $('#search')) $('#search').close();
  });

  document.addEventListener('change', (ev) => {
    const tgt = ev.target;
    const p = store.user.prefs;
    if (tgt.dataset.pref === 'audience' || tgt.dataset.pref === 'region') { p[tgt.dataset.pref] = tgt.value; saveUser(); commit(); }
    else if (tgt.dataset.filter) { p.filters[tgt.dataset.filter] = tgt.type === 'checkbox' ? tgt.checked : tgt.value; saveUser(); commit(); }
    else if (tgt.dataset.prefBool) { p[tgt.dataset.prefBool] = tgt.checked; saveUser(); commit(); }
    else if (tgt.dataset.domainOn) {
      const on = p.domainsOn;
      if (tgt.checked) { if (!on.includes(tgt.dataset.domainOn)) on.push(tgt.dataset.domainOn); } else p.domainsOn = on.filter((id) => id !== tgt.dataset.domainOn);
      saveUser(); commit();
    } else if (tgt.dataset.decideSelect) {
      if (tgt.value === 'reset') setDecision(tgt.dataset.decideSelect, null);
      else if (tgt.value) setDecision(tgt.dataset.decideSelect, Number(tgt.value));
    } else if (tgt.dataset.forecastSelect) setForecast(tgt.dataset.forecastSelect, tgt.value);
    else if (tgt.hasAttribute('data-weekmode')) { store.ui.weekMode = tgt.value; commit(); }
    else if (tgt.hasAttribute('data-theme-choice')) storeTheme(tgt.value);
    else if (tgt.hasAttribute('data-lang-choice')) setLanguage(tgt.value);
    else if (tgt.dataset.src && tgt.dataset.src !== 'q') { store.ui.sources[tgt.dataset.src] = tgt.value; store.ui.sources.page = 0; commit(); }
  });

  let debounce = 0;
  let commentTimer = 0;
  document.addEventListener('input', (ev) => {
    const tgt = ev.target;
    if (tgt.dataset.weight) {
      store.user.prefs.weights[tgt.dataset.weight] = Number(tgt.value);
      tgt.nextElementSibling.textContent = tgt.value;
      saveUser(); commit();
    } else if (tgt.dataset.comment) {
      const id = tgt.dataset.comment;
      const cur = store.user.feedback[id] || { state: '' };
      store.user.feedback[id] = { ...cur, comment: tgt.value, at: new Date().toISOString() };
      saveUser(); // no re-render while typing
      clearTimeout(commentTimer); commentTimer = setTimeout(() => syncFeedback(id), 800);
    } else if (tgt.id === 'src-q') {
      clearTimeout(debounce);
      debounce = setTimeout(() => { store.ui.sources.q = tgt.value; store.ui.sources.page = 0; commit(); }, 160);
    } else if (tgt.id === 'fam-search') {
      clearTimeout(debounce);
      debounce = setTimeout(() => { store.ui.famQuery = tgt.value; commit(); }, 160);
    } else if (tgt.id === 'search-input') renderSearch(tgt.value);
  });

  // Linked highlighting (section 8, Focus): anything with data-hot / data-hot-block / data-hot-domain /
  // data-hot-ring publishes on hover and keyboard focus; radar, queue and building blocks react.
  Focus.bindDom();

  document.addEventListener('keydown', (ev) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName);
    if ((ev.key === 'k' || ev.key === 'K') && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); openSearch(); return; }
    if (ev.key === '/' && !typing && !$('#search').open) { ev.preventDefault(); openSearch(); return; }
    if ($('#search').open) {
      const opts = $$('#search-results [role="option"]');
      const i = opts.findIndex((o) => o.getAttribute('aria-selected') === 'true');
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const j = Math.max(0, Math.min(opts.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)));
        opts.forEach((o, k) => o.setAttribute('aria-selected', String(k === j)));
        opts[j]?.scrollIntoView({ block: 'nearest' });
        $('#search-input').setAttribute('aria-activedescendant', opts[j]?.id || '');
      } else if (ev.key === 'Enter' && opts[i] && ev.target.id === 'search-input') { ev.preventDefault(); navigate(opts[i].getAttribute('href')); $('#search').close(); }
      return;
    }
    if (ev.key !== 'Escape') return;
    if (!$('#menu').hidden) { closeMenu(); $('#menu-open').focus(); return; }
    if (store.ui.filterOpen) { store.ui.filterOpen = false; commit(); $('#filter-open')?.focus(); return; }
    if (store.ui.route.b) { navigate(themaHref(store.ui.route.e)); return; }
    if (store.ui.route.e) closePanel();
  });
}

/* =============================================================================
   13  BOOT
   ============================================================================= */
function useDataset() {
  const real = !!store.real;
  store.data = real ? store.real : store.empty;
  store.adapter = real ? (CONFIG.apiBaseUrl ? ApiAdapter : ArtifactDbAdapter) : LocalAdapter;
  store.shared = real ? { ...emptyShared(), ...(store.realShared || {}) } : LocalAdapter.loadShared();
}

async function connectArtifactDb() {
  try {
    if (!(await ArtifactDbAdapter.connect())) { commit(); return; }
    const remote = await ArtifactDbAdapter.loadUser();
    if (remote && (!store.user.savedAt || (remote.savedAt && remote.savedAt > store.user.savedAt))) {
      store.user.feedback = remote.feedback || store.user.feedback;
      store.user.prefs = { ...store.user.prefs, ...(remote.prefs || {}) };
    }
    SourceCatalog.state['artifact-db'] = 'loading';
    ArtifactDbAdapter.subscribeSources((p) => { SourceCatalog.put('artifact-db', p); commit(); });
    ArtifactDbAdapter.subscribe((ds, shared) => {
      if (shared) store.realShared = shared;
      if (ds) {
        const first = !store.real;
        store.real = ds;
        if (first) showToast(t('shell.toastRealData'));
      }
      useDataset();
      commit();
    });
  } catch { ArtifactDbAdapter.status = 'error'; commit(); }
}

async function boot() {
  USECASES = readJson('data-usecases', []);
  PRODUCTS = readJson('data-products', []);
  PRODUCT = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));

  I18N.lang = readLang();
  syncT();
  document.documentElement.lang = I18N.lang;
  store.user = loadUser();
  const now = new Date();
  if (!store.user.lastVisit || isoDay(new Date(store.user.lastVisit)) !== isoDay(now)) { store.user.prevVisit = store.user.lastVisit; store.user.visits = (store.user.visits || 0) + 1; }
  // Adapts to the user: away for more than a week, "Neu" starts at the last visit instead of 7 days.
  if (store.user.prevVisit && now - new Date(store.user.prevVisit) > CONFIG.weekDays * 864e5) store.ui.weekMode = 'visit';
  store.user.lastVisit = now.toISOString();
  saveUser();

  store.empty = await LocalAdapter.load();
  useDataset();
  derive();

  $('#search-open').innerHTML = esc(icon('search'));
  $('#panel-close').innerHTML = esc(icon('x'));
  $('#panel-back').innerHTML = esc(icon('back'));
  $('#panel').inert = true;
  applyStaticText();
  renderHeader();
  bindEvents();
  bindPanel();
  window.addEventListener('hashchange', onRoute);
  onRoute();

  // Other data sources light up when they answer (never block first paint).
  connectArtifactDb();
  const loadApi = (quiet) => ApiAdapter.load().then((ds) => {
    const first = !store.real;
    if (ds.entwicklungen.length) store.real = ds; // an empty answer keeps the "no data" state
    if (first && store.real) showToast(t('shell.toastRealData'));
    useDataset(); commit();
  }).catch(() => { if (!quiet) showToast(t('shell.toastApiDown')); });
  if (CONFIG.apiBaseUrl) loadApi(false);
  SourceCatalog.load(() => commit()).then(() => commit()).catch(() => {});
  // Live refresh. The Artifact database updates itself; API and URL are asked again every few minutes.
  if (CONFIG.refreshMinutes && (CONFIG.apiBaseUrl || CONFIG.sourcesUrl)) {
    setInterval(() => {
      if (document.hidden) return;
      SourceCatalog.load(() => commit()).catch(() => {});
      if (CONFIG.apiBaseUrl) loadApi(true);
    }, CONFIG.refreshMinutes * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { SourceCatalog.load(() => commit()).catch(() => {}); if (CONFIG.apiBaseUrl) loadApi(true); } });
  }
  SourceRatings.refresh().then((ok) => { if (ok) { SourceRatings.fromSources(SourceCatalog.records); commit(); } }).catch(() => {});
}

document.addEventListener('DOMContentLoaded', boot);

</script>
