const RULES = {
  /** Relevance (0–5) = dot size. Need for action is NOT part of it any more: it already
   *  decides the ring (feedback: "Handlungsbedarf zählt doppelt"). Missing values do not count as 0. */
  relevance(e, weights) {
    let sw = 0;
    let sv = 0;
    for (const key of ['change', 'marketImpact', 'ridiRelevance']) {
      const v = e.assessment?.[key]?.value;
      const w = Number(weights[key]) || 0;
      if (v && w) { sw += w; sv += v * w; }
    }
    return sw ? sv / sw : null;
  },

  /** Confidence from the evidence, in Lichtblick's three steps (niedrig / mittel / hoch).
   *  A manufacturer release plus an article about it is ONE origin (feedback: "inhaltlich eine Quelle").
   *  Secondary reports point to their origin with `originId`. Stars come from Lichtblick's rating. */
  confidence(belege) {
    if (!belege.length) {
      return { level: 'niedrig', origins: 0, reports: 0, hasPrimary: false, avgStars: null };
    }
    const groups = new Map();
    for (const b of belege) {
      const key = b.originId || b.id;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(b);
    }
    const starsOf = (group) => Math.max(...group.map((b) => SourceRatings.stars(b) ?? 3));
    const stars = [...groups.values()].map(starsOf);
    const avgStars = stars.reduce((a, b) => a + b, 0) / stars.length;
    const hasPrimary = belege.some((b) => b.source?.primary);
    const origins = groups.size;
    const level = origins >= 2 && hasPrimary && avgStars >= 4 ? 'hoch'
      : origins >= 2 || (hasPrimary && avgStars >= 4) ? 'mittel' : 'niedrig';
    return { level, origins, reports: belege.length, hasPrimary, avgStars };
  },

  /** Ring = need for action. The engine PROPOSES, PM CONFIRMS with one click
   *  (feedback: "Wer setzt den Handlungsbedarf?"). An unconfirmed proposal with weak evidence
   *  is capped at "Prüfen" so that a thin story never lands big and central. */
  ring(e, decision, conf, settings) {
    const proposed = e.assessment?.action?.proposed ?? null;
    const a = e.assessment?.action;
    const fromData = a?.confirmed != null ? { value: a.confirmed, at: a.confirmedAt, by: a.confirmedBy } : null;
    // A stored decision wins. { value: null } means "PM reset this to the engine proposal".
    const confirmed = decision ? (decision.value != null ? decision : null) : fromData;
    const value = confirmed ? confirmed.value : proposed;
    let ring = ringForValue(value);
    let capped = false;
    if (!confirmed && settings.evidenceCap && conf.level === 'niedrig' && ring === 'handeln') {
      ring = 'pruefen';
      capped = true;
    }
    return { ring, value, proposed, source: confirmed ? 'pm' : value == null ? 'none' : 'engine', capped, decision: confirmed };
  },

  /** Learning from feedback (feedback: "Feedback muss etwas verändern").
   *  GLOBAL weights (use-case document: no per-person learning): every click of every team member
   *  counts once. Each "Nicht für uns" lowers the weight of the domain and of the sources involved,
   *  each "Relevant" raises it. Recomputed from all feedback, so removing a click undoes its effect
   *  exactly. In the Spark app the server computes this from the `rueckmeldungen` table. */
  learn: {
    irrelevant: { domain: 0.85, source: 0.9 },
    relevant: { domain: 1.1, source: 1.05 },
    min: 0.6,
    max: 1.4,
  },
  /** entries: [{ entwicklungId, state }] from the whole team. */
  learningFactors(entries, byId, belegeOf) {
    const domain = {};
    const source = {};
    const clamp = (v) => Math.min(RULES.learn.max, Math.max(RULES.learn.min, v));
    for (const f of entries) {
      const e = byId[f.entwicklungId];
      const step = RULES.learn[f.state];
      if (!e || !step) continue;
      domain[e.domain] = clamp((domain[e.domain] ?? 1) * step.domain);
      for (const d of new Set(belegeOf(e).map((b) => b.source?.domain).filter(Boolean))) {
        source[d] = clamp((source[d] ?? 1) * step.source);
      }
    }
    return { domain, source };
  },
  learnedFactor(e, belege, factors) {
    const d = factors.domain[e.domain] ?? 1;
    const s = belege.map((b) => factors.source[b.source?.domain]).filter((v) => v != null);
    const sf = s.length ? s.reduce((a, b) => a + b, 0) / s.length : 1;
    return d * sf;
  },

  /** Forecast check (feedback: probability + criterion, so we can measure the engine later). */
  forecastHit(f) {
    if (f.status !== 'eingetreten' && f.status !== 'nicht-eingetreten') return null;
    return (f.probability >= 0.5) === (f.status === 'eingetreten');
  },
};

/* =============================================================================
   5  DATA ADAPTERS
   Every source of data implements the same small interface and returns a dataset in
   the schema format. The UI never knows where data came from.
     load()                → Promise<dataset>
     saveShared(kind,id,v) → PM decisions, forecast results, feedback (shared by the team)
     saveUser(state)       → preferences and my own clicks (per person)
   ============================================================================= */

/** Lichtblick already rates source domains (★1–5, credibility gate in its news pipeline).
 *  Marktradar reuses that rating instead of building its own. Ratings come from two places:
 *  the source records (field `stars`, set by the source database) and, once connected, Lichtblick.
 *  Without either, a source shows as "ohne". Competitor tracking stays in Lichtblick. */
const SourceRatings = {
  connected: false,
  table: {},
  /** Takes over the per-domain stars of the source records (Lichtblick values win when connected). */
  fromSources(records) {
    for (const r of records) if (r.stars != null && r.h && r.h !== '?' && !this.lichtblick?.has(r.h)) this.table[r.h] = r.stars;
  },
  stars(beleg) {
    const s = beleg?.source;
    if (!s) return null;
    return s.stars ?? this.table[s.domain] ?? null;
  },
  async refresh() {
    if (!CONFIG.lichtblickUrl) return false;
    // Planned contract (to agree with the Lichtblick team): GET {base}/api/source-ratings → [{domain, stars}]
    const res = await fetch(`${CONFIG.lichtblickUrl}/api/source-ratings`, { headers: { accept: 'application/json' } });
    if (!res.ok) return false;
    this.lichtblick = new Set();
    for (const row of await res.json()) { this.table[row.domain] = row.stars; this.lichtblick.add(row.domain); }
    this.connected = true;
    return true;
  },
};

/** The source list. Nothing is built in: it comes from a database and updates live.
 *  Providers, strongest first:
 *    artifact-db  collection `quellen` (+ doc `meta/quellen`), live
 *    api          GET {apiBaseUrl}/quellen
 *    url          CONFIG.sourcesUrl (JSON file)
 *    embedded     <script type="application/json" id="data-sources"> (empty by default)
 *  Each source: { title, url, type, category, rank, why, stars } (format: schema/quelle.schema.json).
 *  The short keys of the old list (t, u, y, c, r, w) are understood as well, so an old export
 *  can be embedded unchanged. The views read `records` and `categories` and never know the provider. */
const SourceCatalog = {
  order: ['artifact-db', 'api', 'url', 'embedded'],
  labels: { 'artifact-db': 'Artifact-DB', api: 'API', url: 'JSON', embedded: 'embedded' },
  parts: {},     // provider → normalized payload
  state: {},     // provider → loading | ok | empty | error
  records: [],
  categories: [],
  updated: null,
  via: null,
  get status() {
    if (this.via) return 'live';
    const s = Object.values(this.state);
    return ['loading', 'empty', 'error'].find((k) => s.includes(k)) || 'off';
  },
  /** Brings any payload into { categories, records[], updated }. Unknown fields are ignored. */
  normalize(input) {
    const list = Array.isArray(input) ? input : input?.records ?? input?.items ?? [];
    const given = Array.isArray(input?.categories) ? input.categories.map(String) : null;
    const categories = given ? [...given] : [];
    const catOf = (v) => {
      if (v == null || v === '') return -1;
      if (given && typeof v === 'number') return v in categories ? v : -1;
      const name = String(v);
      let i = categories.indexOf(name);
      if (i < 0) { categories.push(name); i = categories.length - 1; }
      return i;
    };
    const records = [];
    list.forEach((x, n) => {
      if (!x || typeof x !== 'object') return;
      const u = x.url ?? x.u ?? null;
      const t = x.title ?? x.t ?? x.name ?? '';
      if (!t && !u) return;
      const rank = Number(x.rank ?? x.r);
      const stars = Number(x.stars);
      records.push({
        id: x.id ?? u ?? `q${n}`,
        r: Number.isFinite(rank) && (x.rank ?? x.r) !== '' ? rank : null,
        t: t || hostOf(u) || '?',
        y: x.type ?? x.y ?? '',
        w: x.why ?? x.w ?? x.reason ?? '',
        u,
        h: hostOf(u) || '?',
        c: catOf(x.category ?? x.c),
        stars: stars >= 1 && stars <= 5 ? stars : null,
        _n: n,
      });
    });
    const ck = (c) => (c < 0 ? 1e9 : c);
    records.sort((a, b) => ck(a.c) - ck(b.c) || (a.r ?? Infinity) - (b.r ?? Infinity) || a._n - b._n);
    for (const r of records) { delete r._n; if (r.c < 0) { r.c = categories.length; } }
    if (records.some((r) => r.c === categories.length)) categories.push('–');
    return { categories, records, updated: input?.updated ?? input?.meta?.updated ?? null };
  },
  /** A provider delivers (payload) or fails (null). Then the strongest provider with sources is shown. */
  put(via, payload) {
    if (payload == null) { this.state[via] = 'error'; } // keep the last good list on a failed refresh
    else {
      const p = this.normalize(payload);
      this.parts[via] = p;
      this.state[via] = p.records.length ? 'ok' : 'empty';
    }
    const best = this.order.find((k) => this.parts[k]?.records.length);
    const p = best ? this.parts[best] : { categories: [], records: [], updated: null };
    this.via = best ? this.labels[best] : null;
    this.records = p.records;
    this.categories = p.categories;
    this.updated = p.updated;
    SourceRatings.fromSources(this.records);
  },
  /** Embedded block, then the optional URL and API (async). The Artifact collection is wired in connectArtifactDb. */
  async load(onChange) {
    const emb = readJson('data-sources', null);
    if (emb && (Array.isArray(emb) ? emb.length : emb.records?.length)) this.put('embedded', emb);
    const fetchJson = async (via, url) => {
      this.state[via] = 'loading';
      try {
        const r = await fetch(url, { headers: { accept: 'application/json' } });
        if (!r.ok) throw new Error(String(r.status));
        this.put(via, await r.json());
      } catch { this.put(via, null); }
      onChange?.();
    };
    const jobs = [];
    if (CONFIG.sourcesUrl) jobs.push(fetchJson('url', CONFIG.sourcesUrl));
    if (CONFIG.apiBaseUrl) jobs.push(fetchJson('api', `${CONFIG.apiBaseUrl}/quellen`));
    await Promise.all(jobs);
  },
};

/** Shared (team) state and where it lives. Feedback ids are `<entwicklungId>__<personId>`. */
const SHARED_COLLECTION = { decisions: 'entscheidungen', forecasts: 'prognosen', feedback: 'rueckmeldungen' };
const emptyShared = () => ({ decisions: {}, forecasts: {}, feedback: {} });

const Local = {
  read(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
  },
  write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage blocked: state lasts for this visit */ }
  },
};

/** No database connected: an empty dataset. Decisions and clicks are kept in this browser. */
const LocalAdapter = {
  id: 'local',
  label: 'Lokal',
  async load() { return normalizeDataset({}, 'empty'); },
  async saveShared(kind, id, value) {
    const shared = { decisions: {}, forecasts: {}, feedback: {}, ...Local.read(CONFIG.storage.shared, {}) };
    shared[kind] = shared[kind] || {};
    shared[kind][id] = value;
    if (value == null) delete shared[kind][id];
    Local.write(CONFIG.storage.shared, shared);
  },
  loadShared() { return { decisions: {}, forecasts: {}, feedback: {}, ...Local.read(CONFIG.storage.shared, {}) }; },
};

/** The artifact database (claude.ai). The v1 prototype wrote `news` and `themes` here; they are
 *  converted into the new format on the fly. New research should write `entwicklungen` and
 *  `belege` in the schema format (see docs/RECHERCHE.md). */
const ArtifactDbAdapter = {
  id: 'artifact-db',
  label: 'Artifact-Datenbank',
  db: null,
  uid: null,
  status: 'off', // off | connecting | waiting | live | empty | error
  writing: Promise.resolve(),
  async connect() {
    if (typeof window.claude === 'undefined' || typeof window.claude.use !== 'function') return false;
    this.status = 'connecting';
    this.db = await window.claude.use('db');
    if (!this.db) { this.status = 'off'; return false; }
    const user = await window.claude.use('user');
    this.uid = user ? await user.id() : null;
    return true;
  },
  /** Subscribes once per collection and calls onChange(dataset|null, shared) whenever data changes. */
  subscribe(onChange) {
    const raw = { entwicklungen: [], belege: [], abdeckung: [], news: [], themes: [], decisions: {}, forecasts: {}, feedback: {}, meta: null };
    let seen = 0;
    this.status = 'waiting';
    const timer = setTimeout(() => { if (this.status === 'waiting') { this.status = 'error'; onChange(null); } }, 10000);
    const emit = () => {
      clearTimeout(timer);
      const hasNew = raw.entwicklungen.length > 0;
      const hasLegacy = raw.news.length > 0;
      this.status = hasNew || hasLegacy ? 'live' : 'empty';
      const dataset = hasNew
        ? normalizeDataset({ entwicklungen: raw.entwicklungen, belege: raw.belege, coverage: raw.abdeckung, meta: raw.meta }, 'real')
        : hasLegacy ? normalizeDataset(mapLegacyV1(raw.news, raw.themes, raw.meta), 'real') : null;
      onChange(dataset, { decisions: raw.decisions, forecasts: raw.forecasts, feedback: raw.feedback });
    };
    const fail = () => { clearTimeout(timer); this.status = 'error'; onChange(null); };
    const list = (name, key) => this.db.collection(name).onSnapshot((snap) => {
      raw[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      seen += 1;
      emit();
    }, fail);
    const map = (name, key) => this.db.collection(name).onSnapshot((snap) => {
      raw[key] = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
      emit();
    }, () => {});
    list('entwicklungen', 'entwicklungen');
    list('belege', 'belege');
    list('abdeckung', 'abdeckung');
    list('news', 'news');
    list('themes', 'themes');
    map('entscheidungen', 'decisions');
    map('prognosen', 'forecasts');
    map('rueckmeldungen', 'feedback'); // team feedback = global weights
    this.db.doc('meta/research').onSnapshot((s) => { raw.meta = s.exists ? s.data() : null; if (seen) emit(); }, () => {});
  },
  /** Live source list: collection `quellen` (one document per source) plus optional doc `meta/quellen`
   *  ({categories: string[], updated: 'YYYY-MM-DD'}). Calls onChange(payload|null) on every change. */
  subscribeSources(onChange) {
    let docs = null;
    let meta = null;
    const emit = () => { if (docs) onChange({ records: docs, categories: meta?.categories, updated: meta?.updated }); };
    this.db.collection('quellen').onSnapshot((snap) => { docs = snap.docs.map((d) => ({ id: d.id, ...d.data() })); emit(); }, () => onChange(null));
    this.db.doc('meta/quellen').onSnapshot((s) => { meta = s.exists ? s.data() : null; emit(); }, () => {});
  },
  async loadUser() {
    if (!this.uid) return null;
    try {
      const snap = await this.db.collection(`data/users/${this.uid}`).doc('marktradar').get();
      return snap.exists ? snap.data() : null;
    } catch { return null; }
  },
  saveUser(state) {
    if (!this.uid) return;
    // One write at a time per document (platform rule); later calls queue behind the current one.
    this.writing = this.writing.then(() => this.db.collection(`data/users/${this.uid}`).doc('marktradar').set(state)).catch(() => {});
  },
  async saveShared(kind, id, value) {
    const ref = this.db.collection(SHARED_COLLECTION[kind]).doc(id);
    if (value == null) await ref.delete(); else await ref.set(value);
  },
};

/** Future Spark backend. Planned endpoints (DX conventions, errors as {"error":{"code","message"}}):
 *    GET  /api/entwicklungen   → { items: Entwicklung[] }
 *    GET  /api/belege          → { items: Beleg[] }
 *    GET  /api/abdeckung       → { items: Coverage[] }
 *    GET  /api/quellen         → { items: Quelle[], categories?: string[], updated?: 'YYYY-MM-DD' }
 *    PUT  /api/entscheidungen/:id, PUT /api/prognosen/:id, PUT /api/rueckmeldungen/:id, PUT /api/me/state
 *  Inactive while CONFIG.apiBaseUrl is null. */
const ApiAdapter = {
  id: 'api',
  label: 'Marktradar-API',
  async load() {
    const get = async (p) => {
      const r = await fetch(`${CONFIG.apiBaseUrl}${p}`, { headers: { accept: 'application/json' } });
      if (!r.ok) throw new Error(`${p}: ${r.status}`);
      return (await r.json()).items ?? [];
    };
    const [entwicklungen, belege, coverage] = await Promise.all([get('/entwicklungen'), get('/belege'), get('/abdeckung')]);
    return normalizeDataset({ entwicklungen, belege, coverage }, 'real');
  },
  async saveShared(kind, id, value) {
    await fetch(`${CONFIG.apiBaseUrl}/${SHARED_COLLECTION[kind]}/${encodeURIComponent(id)}`, {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(value),
    });
  },
};

/** Brings any input into one shape: arrays become id maps, missing fields get safe defaults. */
function normalizeDataset(input, mode) {
  const belege = {};
  for (const b of input.belege || []) {
    belege[b.id] = {
      ...b,
      source: { name: '', domain: hostOf(b.url) || null, type: 'sonstiges', primary: false, ...(b.source || {}) },
    };
  }
  const entwicklungen = (input.entwicklungen || []).map((e) => ({
    domainsSecondary: [], bausteine: [], audience: ['pm'], regions: ['DACH'], history: [], evidence: [], products: [], useCases: [],
    statements: {}, assessment: {}, status: 'neu', ...e,
  }));
  const coverage = {};
  for (const c of input.coverage || []) coverage[c.domain || c.id] = c;
  return {
    mode,
    entwicklungen,
    belege,
    coverage,
    resolvedForecasts: input.resolvedForecasts || [],
    meta: input.meta || {},
  };
}

/** v1 prototype → v2 schema. Each v1 "Thema" becomes one Entwicklung, each (news, source) pair
 *  one Beleg. v1 had five scores per news item; the strongest values become the engine proposal. */
function mapLegacyV1(news, themes, meta) {
  const belege = [];
  const used = new Set();
  const typeOf = (t = '') => {
    const s = t.toLowerCase();
    if (s.includes('regul') || s.includes('gesetz') || s.includes('verordnung')) return 'gesetz';
    if (s.includes('ausschreib')) return 'ausschreibung';
    if (s.includes('herstell')) return 'hersteller';
    if (s.includes('fach') || s.includes('presse')) return 'fachmedium';
    if (s.includes('studie') || s.includes('wissenschaft')) return 'studie';
    if (s.includes('verband') || s.includes('norm')) return 'verband';
    if (s.includes('markt')) return 'marktdaten';
    if (s.includes('behörde') || s.includes('amt')) return 'behoerde';
    return 'sonstiges';
  };
  const toBelege = (n) => (n.src || []).map((s, j) => {
    const id = `${n.id}-${j}`;
    belege.push({
      id, title: n.title, summary: s.note || n.sum, url: s.url || null, published: s.date || n.pub || null, foundAt: n.checked || null,
      source: { name: s.t || s.name || 'Quelle', domain: hostOf(s.url), type: typeOf(s.type), primary: !!s.primary }, kind: n.kind || '',
    });
    return id;
  });
  const maxOf = (list, i) => { const v = list.map((n) => (n.s || [])[i]).filter(Boolean); return v.length ? Math.max(...v) : null; };
  const reasons = (list, i) => list.map((n) => (n.why || [])[i]).filter(Boolean).join(' ');
  const flat = (list, k) => list.flatMap((n) => n[k] || []);
  const toEntwicklung = (id, title, sum, dom, list) => {
    for (const n of list) used.add(n.id);
    const doms = [...new Set(list.flatMap((n) => n.dom || []))];
    const basisMap = { explicit: 'explizit', evidenced: 'belegt', hypothesis: 'hypothese' };
    const geo = list.map((n) => (n.geo || '').toLowerCase()).join(' ');
    const regions = geo.includes('deutschland') ? ['DE'] : geo.includes('eu') ? ['EU'] : ['DACH'];
    const checked = list.map((n) => n.checked).filter(Boolean).sort();
    return {
      id: `v1-${id}`, title, soWhat: sum, summary: sum, domain: dom || doms[0], domainsSecondary: doms.filter((d) => d !== dom),
      bausteine: [], audience: ['pm'], regions,
      horizon: { code: null, label: list.find((n) => n.when)?.when || null },
      assessment: {
        change: { value: maxOf(list, 0), reason: reasons(list, 0) },
        marketImpact: { value: maxOf(list, 2), reason: reasons(list, 2) },
        ridiRelevance: { value: maxOf(list, 3), reason: reasons(list, 3) },
        action: { proposed: maxOf(list, 4), reason: reasons(list, 4), confirmed: null },
      },
      statements: { facts: flat(list, 'fact'), inferences: flat(list, 'infer'), hypotheses: [], openQuestions: flat(list, 'open'), recommendation: flat(list, 'rec') },
      products: flat(list, 'prods').map((p) => ({ family: String(p.n || '').toUpperCase().replace(/\s+/g, '-'), basis: basisMap[p.basis] || 'hypothese', why: p.why || '' })),
      evidence: list.flatMap(toBelege),
      useCases: [...new Set(flat(list, 'uc'))],
      status: 'neu', firstSeen: checked[0] || null, lastUpdated: checked.at(-1) || null, history: [],
      provenance: { by: 'claude-chat', legacy: 'v1', checked: checked.at(-1) || null, reviewed: false },
    };
  };
  const out = [];
  for (const th of themes || []) {
    const list = (th.items || []).map((id) => news.find((n) => n.id === id)).filter(Boolean);
    if (list.length) out.push(toEntwicklung(th.id, th.title, th.sum, th.dom, list));
  }
  for (const n of news) if (!used.has(n.id)) out.push(toEntwicklung(n.id, n.title, n.sum, (n.dom || [])[0], [n]));
  return { entwicklungen: out, belege, coverage: [], meta: { ...(meta || {}), legacy: 'v1' } };
}

  shared: emptyShared(),
  user: null,            // see defaultUser()
  ui: {
    route: { view: 'uebersicht', sub: null, e: null, b: null },
    sort: { key: 'ring', dir: 1 },
    weekMode: 'week',
    showChanges: true,
    mobileRadar: false,
    sources: { q: '', cat: '', type: '', host: '', page: 0 },
    famQuery: '',
    run: null,
    pnFull: false,         // detail panel in "Vollbild" (UI state only)
    pnTab: 'overview',     // detail panel tab (UI state only)

    guideSkip: [],         // steps moved to the end ("Später")

    lastVisit: null,

function loadUser() {
  const base = defaultUser();
  const saved = Local.read(CONFIG.storage.user, null);
  if (saved) {
    base.feedback = saved.feedback || {};
    base.lastVisit = saved.lastVisit || null;
    base.prevVisit = saved.prevVisit || null;
    base.visits = saved.visits || 0;
    base.prefs = { ...base.prefs, ...(saved.prefs || {}), filters: { ...base.prefs.filters, ...(saved.prefs?.filters || {}) } };
    base.prefs.weights = { ...CONFIG.defaults.weights, ...(saved.prefs?.weights || {}) };
    if (base.prefs.filters.hideIrrelevant) { base.prefs.filters.feedback = 'hide'; delete base.prefs.filters.hideIrrelevant; } // v2.1 checkbox
  } else {
    // v1 migration: keep domain order and active segments.
    const old = Local.read(CONFIG.storage.legacy, null);
    if (old?.cfg?.order) base.prefs.domainOrder = old.cfg.order.filter((id) => DOMAIN[id]);
    if (old?.cfg?.on) base.prefs.domainsOn = old.cfg.on.filter((id) => DOMAIN[id]);
  }
  // Guard against unknown ids after a domain change.
  base.prefs.domainOrder = [...new Set([...base.prefs.domainOrder.filter((id) => DOMAIN[id]), ...DOMAINS.map((d) => d.id)])];
  return base;
}

let saveTimer = 0;
function saveUser() {
  store.user.savedAt = new Date().toISOString();
  Local.write(CONFIG.storage.user, store.user);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (ArtifactDbAdapter.db) ArtifactDbAdapter.saveUser(JSON.parse(JSON.stringify(store.user))); }, 800);
}

/** Everything the views show is computed here once per change. */
function derive() {
  const ds = store.data;
  const prefs = store.user.prefs;
  const now = new Date();
  const since = store.ui.weekMode === 'visit' && store.user.prevVisit ? new Date(store.user.prevVisit) : addDays(now, -CONFIG.weekDays);
  const belegeOf = (e) => (e.evidence || []).map((id) => ds.belege[id]).filter(Boolean);
  const team = teamFeedback();
  const eById = Object.fromEntries(ds.entwicklungen.map((e) => [e.id, e]));
  const factors = RULES.learningFactors(team, eById, belegeOf);
  const teamCount = {};
  for (const f of team) { const c = (teamCount[f.entwicklungId] ||= { relevant: 0, irrelevant: 0, later: 0 }); c[f.state] = (c[f.state] || 0) + 1; }
  const region = REGIONS.find((r) => r.id === prefs.region) || REGIONS[0];
  const items = ds.entwicklungen.map((e) => {
    const belege = belegeOf(e);
    const conf = RULES.confidence(belege);
    const ring = RULES.ring(e, store.shared.decisions[e.id], conf, prefs);
    const rel = RULES.relevance(e, prefs.weights);
    const factor = RULES.learnedFactor(e, belege, factors);
    const fb = store.user.feedback[e.id] || null;
    const firstSeen = parseDate(e.firstSeen);
    const prev = [...(e.history || [])].filter((h) => parseDate(h.date) < since).sort((a, b) => parseDate(a.date) - parseDate(b.date)).at(-1);
    const isNew = !!firstSeen && firstSeen >= since;
    const prevRing = isNew ? null : prev?.ring ?? null;
    const moved = !!prevRing && prevRing !== ring.ring;
    const newBelege = isNew ? [] : belege.filter((b) => parseDate(b.foundAt) >= since);
    const forecast = e.forecast ? { ...e.forecast, ...(store.shared.forecasts[e.id] || {}) } : null;
    const expected = forecast ? endOfPeriod(forecast.expected) : null;
    const due = !!forecast && forecast.status === 'offen' && !!expected && expected <= addDays(now, CONFIG.forecastDueDays);
    const latest = belege.map((b) => parseDate(b.published)).filter(Boolean).sort((a, b) => b - a)[0] || null;
    const until = endOfPeriod(e.horizon?.until) || expected;
    const aud = e.audience || [];
    const audienceOk = { alle: true, pm: aud.includes('pm'), produktion: aud.includes('produktion'), schnittmenge: aud.includes('pm') && aud.includes('produktion') };
    const regionOk = !region.match || (e.regions || []).some((r) => region.match.includes(r));
    const weighted = rel == null ? null : Math.min(5, rel * factor);
    const score = (RING[ring.ring].weight) * (weighted ?? 2.5) * (isNew || moved ? 1.25 : 1) * (fb?.state === 'irrelevant' ? 0.3 : 1);
    return {
      e, belege, conf, ring, rel, weighted, factor, fb, team: teamCount[e.id] || null, isNew, prevRing, moved, newBelege, forecast, due, latest, until,
      audienceOk, regionOk, score, firstSeen,
    };
  });
  const byId = Object.fromEntries(items.map((d) => [d.e.id, d]));
  store.derived = { items, byId, factors, since, now };
  return store.derived;
}

/** My id for shared entries ("lokal" without a database). */
const meId = () => ArtifactDbAdapter.uid || 'lokal';

/** Everyone's feedback: other people's entries from the shared store plus my own clicks. */
function teamFeedback() {
  const me = meId();
  const list = Object.values(store.shared.feedback || {}).filter((f) => f && f.by !== me && f.state && f.entwicklungId);
  for (const [id, f] of Object.entries(store.user.feedback)) if (f?.state) list.push({ entwicklungId: id, by: me, state: f.state });
  return list;
}

/** Filters shared by Übersicht, Neu and Produkte (one filter row above everything it scopes). */
function visible(opts = {}) {
  const p = store.user.prefs;
  const f = p.filters;
  const now = store.derived.now;
  const y = now.getFullYear();
  return store.derived.items.filter((d) => {
    if (!d.audienceOk[p.audience]) return false;
    if (!d.regionOk) return false;
    // Weakly supported points stay out of the radar, "Neu" and the weekly check (the table lists everything: opts.weak).
    if (!opts.weak && f.minConf === 'mittel' && d.conf.level === 'niedrig') return false;
    if (!opts.weak && f.minConf === 'hoch' && d.conf.level !== 'hoch') return false;
    if (opts.all) return true;
    if (!p.domainsOn.includes(d.e.domain)) return false;
    if (opts.domain !== false && p.domain && d.e.domain !== p.domain) return false;
    // My feedback as a filter: only "Relevant", only "Geparkt", or everything except "Nicht für uns".
    if (f.feedback === 'relevant' && d.fb?.state !== 'relevant') return false;
    if (f.feedback === 'later' && d.fb?.state !== 'later') return false;
    if ((f.feedback === 'hide' || f.hideIrrelevant) && d.fb?.state === 'irrelevant') return false;
    if (f.minConf === 'mittel' && d.conf.level === 'niedrig') return false;
    if (f.minConf === 'hoch' && d.conf.level !== 'hoch') return false;
    if (f.published !== 'all' && !(d.latest && d.latest >= addDays(now, -Number(f.published)))) return false;
    if (f.expected !== 'all') {
      if (!d.until) return false;
      const limit = { y0: new Date(y, 11, 31), y1: new Date(y + 1, 11, 31), y3: new Date(y + 3, 11, 31) };
      if (f.expected === 'later' ? d.until <= limit.y3 : d.until > limit[f.expected]) return false;
    }
    return true;
  });
}

function weekModel() {
  const list = visible({ all: true });
  const resolved = [
    ...(store.data.resolvedForecasts || []),
    ...store.derived.items.filter((d) => d.forecast && RULES.forecastHit(d.forecast) != null).map((d) => ({ ...d.forecast, entwicklungId: d.e.id })),
  ];
  return {
    since: store.derived.since,
    created: list.filter((d) => d.isNew).sort(byScore),
    moved: list.filter((d) => d.moved).sort(byScore),
    belege: list.filter((d) => d.newBelege.length).sort(byScore),
    due: list.filter((d) => d.due).sort((a, b) => endOfPeriod(a.forecast.expected) - endOfPeriod(b.forecast.expected)),
    confirm: list.filter((d) => d.ring.source === 'engine' && ['handeln', 'pruefen'].includes(d.ring.ring)).sort(byScore),
    later: list.filter((d) => d.fb?.state === 'later'),
    resolved,
  };
}
const byScore = (a, b) => b.score - a.score;

/** What the tool expects from the user this week, in priority order (information hierarchy level 1).
 *  At most two tasks per development: one decision (confirm OR triage) plus a due forecast.
 *  Done tasks stay in the list for this week, so progress is visible ("2 von 7 erledigt"). */
/** The tasks of ONE development, whatever the filters (the detail panel always offers them). */
function itemTasks(d) {
  const since = startOfDay(store.derived.since);
  const thisWeek = (s) => !!s && parseDate(String(s).slice(0, 10)) >= since;
  const tasks = [];
  {
    const id = d.e.id;
    const dec = store.shared.decisions[id];
    if (d.ring.source === 'engine' && ['handeln', 'pruefen'].includes(d.ring.ring)) {
      tasks.push({ key: `confirm:${id}`, kind: 'confirm', d, prio: d.ring.ring === 'handeln' || d.ring.capped ? 0 : 2, done: false });
    } else if (dec && dec.value != null && thisWeek(dec.at)) {
      tasks.push({ key: `confirm:${id}`, kind: 'confirm', d, prio: 2, done: true });
    } else if (d.isNew) {
      tasks.push({ key: `triage:${id}`, kind: 'triage', d, prio: 3, done: !!d.fb?.state });
    }
    const fc = store.shared.forecasts[id];
    if (d.due) tasks.push({ key: `forecast:${id}`, kind: 'forecast', d, prio: 1, done: false });
    else if (fc && fc.status !== 'offen' && thisWeek(fc.resolvedAt)) tasks.push({ key: `forecast:${id}`, kind: 'forecast', d, prio: 1, done: true });
  }
  return tasks.sort((a, b) => a.done - b.done || a.prio - b.prio);
}

function tasksModel() {
  const tasks = visible({ all: true }).flatMap(itemTasks);
  tasks.sort((a, b) => a.done - b.done || a.prio - b.prio || b.d.score - a.d.score);
  const open = tasks.filter((x) => !x.done);
  return { all: tasks, open, done: tasks.filter((x) => x.done), total: tasks.length };
}

function validateDataset(ds) {
  const issues = [];
  const push = (level, id, msg) => issues.push({ level, id, msg });
  for (const e of ds.entwicklungen) {
    if (!e.id) push('fehler', '?', t('check.noId'));
    if (!e.title) push('fehler', e.id, t('check.noTitle'));
    if (!e.soWhat) push('hinweis', e.id, t('check.noSoWhat'));
    if (!DOMAIN[e.domain]) push('fehler', e.id, t('check.badDomain', { v: e.domain }));
    for (const k of ['change', 'marketImpact', 'ridiRelevance']) {
      const v = e.assessment?.[k]?.value;
      if (v != null && !(v >= 1 && v <= 5)) push('fehler', e.id, t('check.badValue', { v: k }));
    }
    if (!(e.evidence || []).length) push('hinweis', e.id, t('check.noEvidence'));
    for (const id of e.evidence || []) if (!ds.belege[id]) push('fehler', e.id, t('check.missingBeleg', { v: id }));
    for (const b of e.bausteine || []) if (!BAUSTEIN[b]) push('fehler', e.id, t('check.badBlock', { v: b }));
    for (const p of e.products || []) if (!PRODUCT[p.family]) push('hinweis', e.id, t('check.noFamily', { v: p.family }));
    if (e.forecast && !(e.forecast.probability >= 0 && e.forecast.probability <= 1)) push('hinweis', e.id, t('check.noProbability'));
    if (e.forecast && !e.forecast.criterion) push('hinweis', e.id, t('check.noCriterion'));
  }
  for (const b of Object.values(ds.belege)) {
    if (b.originId && !ds.belege[b.originId]) push('hinweis', b.id, t('check.badOrigin', { v: b.originId }));
  }
  return issues;
}

  if (Math.abs(mins) < 60 * 24 && /T\d/.test(String(store.data?.meta?.lastRun || ''))) return rtf.format(Math.round(mins / 60), 'hour');
  return relDays(d);
}

/** Numbers count up to their new value (KPI chips). Elements: <b data-count="7" data-count-key="kpi-new">7</b>. */
const countMemory = new Map();
function countUp(root = document) {
  for (const el of root.querySelectorAll('[data-count]')) {
    const to = Number(el.dataset.count);
    const key = el.dataset.countKey || '';
    const from = countMemory.has(key) ? countMemory.get(key) : 0;
    countMemory.set(key, to);
    if (reducedMotion() || from === to) { el.textContent = String(to); continue; }
    const t0 = performance.now();
    const dur = 520;
    let done = false;
    const step = () => {
      if (done) return;
      const k = Math.min(1, (performance.now() - t0) / dur);
      el.textContent = String(Math.round(from + (to - from) * (1 - (1 - k) ** 3)));
      if (k < 1 && document.contains(el)) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    // Frames can stop (background tab, print): the final value must land anyway and stay.
    setTimeout(() => { done = true; el.textContent = String(to); }, dur + 80);
  }
}

/* ---------- Focus: linked highlighting across radar, decision queue and building blocks ----------
   Hover or keyboard focus on any element with
     data-hot="<entwicklungId>"     one development (radar dot, queue row, card, table row)
     data-hot-block="<bausteinId>"  a building block (strip tile, product tile)
     data-hot-domain="<domainId>"   a radar segment or its label
     data-hot-ring="<ringId>"       a ring (tick label, legend)
     data-hot-ids="id1 id2 …"       any set (KPI chip "Bewegt", queue group); add data-hot-key="moved" as a stable key
   publishes a focus { kind, key, ids:Set<entwicklungId>, blocks:Set<bausteinId> }. Components subscribe
   with Focus.on(name, fn) (same name replaces the old subscriber, so re-mounting a view does not leak)
   and dim whatever is not in `ids`. Focus.current is null when nothing is focused. */
const Focus = {
  current: null,
  subs: new Map(),
  timer: 0,
  on(name, fn) { this.subs.set(name, fn); },
  off(name) { this.subs.delete(name); },
  emit() { for (const fn of this.subs.values()) { try { fn(this.current); } catch (err) { RUNTIME_ERRORS.push(String(err.message)); } } },
  set(kind, key, explicitIds = null) {
    clearTimeout(this.timer);
    if (this.current && this.current.kind === kind && this.current.key === key) return;
    const items = visible();
    if (kind === 'ids') {
      const ids = new Set(explicitIds || []);
      const hit = items.filter((d) => ids.has(d.e.id));
      this.current = { kind, key, ids, blocks: new Set(hit.flatMap((d) => d.e.bausteine || [])), items: hit };
      this.emit();
      return;
    }
    const match = {
      entwicklung: (d) => d.e.id === key,
      block: (d) => (d.e.bausteine || []).includes(key),
      domain: (d) => d.e.domain === key,
      ring: (d) => d.ring.ring === key,
    }[kind];
    if (!match) return;
    const hit = items.filter(match);
    const ids = new Set(hit.map((d) => d.e.id));
    const blocks = kind === 'block' ? new Set([key]) : new Set(hit.flatMap((d) => d.e.bausteine || []));
    this.current = { kind, key, ids, blocks, items: hit };
    this.emit();
  },
  /** Small delay so moving between neighbouring elements does not flicker. */
  clear(delay = 70) {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { if (this.current) { this.current = null; this.emit(); } }, delay);
  },
  bindDom() {
    const SEL = '[data-hot], [data-hot-block], [data-hot-domain], [data-hot-ring], [data-hot-ids]';
    const read = (el) => (el.dataset.hot ? ['entwicklung', el.dataset.hot]
      : el.dataset.hotBlock ? ['block', el.dataset.hotBlock]
        : el.dataset.hotDomain ? ['domain', el.dataset.hotDomain]
          : el.dataset.hotRing ? ['ring', el.dataset.hotRing]
            : ['ids', el.dataset.hotKey || el.dataset.hotIds, el.dataset.hotIds.split(/\s+/).filter(Boolean)]);
    const enter = (ev) => { const el = ev.target.closest?.(SEL); if (el) this.set(...read(el)); };
    const leave = (ev) => {
      const from = ev.target.closest?.(SEL);
      const to = ev.relatedTarget?.closest?.(SEL);
      if (from && from !== to) this.clear();
    };
    document.addEventListener('pointerover', enter);
    document.addEventListener('pointerout', leave);
    document.addEventListener('focusin', (ev) => { if (ev.target.closest?.(SEL)) enter(ev); else this.clear(0); });
    document.addEventListener('focusout', leave);
  },
};


/** Path helpers: the panel (Thema / Detail) opens on top of whatever view is active. */

  const path = ['', r.view, r.sub, r.sub2].filter((x) => x != null).join('/');
  const q = new URLSearchParams();
  if (r.e) q.set('e', r.e);
  if (r.b) q.set('b', r.b);
  const qs = q.toString();
  return `#${path || '/uebersicht'}${qs ? `?${qs}` : ''}`;
}
const themaHref = (id) => routeHref({ ...store.ui.route, e: id, b: null });

function isoWeek(d) {
  const tu = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = tu.getUTCDay() || 7;
  tu.setUTCDate(tu.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(tu.getUTCFullYear(), 0, 1));
  return Math.ceil(((tu - y0) / 864e5 + 1) / 7);
}

/* =============================================================================
   9  RADAR
   SVG geometry in a fixed viewBox, labels as HTML on top (crisp at every size).
   Two codes only (feedback): segment = domain, ring = need for action. Size = relevance.
   Color = urgency, the same meaning as the ring, always paired with words (ticks, legend, card).
   Hover and keyboard focus run through the Focus bus (section 8): dots carry data-hot, segments
   data-hot-domain, ring ticks data-hot-ring. The radar reacts to focus from anywhere on the page.
   ============================================================================= */
const RG = {
  vb: { x: -500, y: -430, w: 1000, h: 860 },
  hub: 30,
  bands: { handeln: [34, 124], pruefen: [124, 208], beobachten: [208, 286], offen: [294, 330] },
  rim: 338,   // group brackets and group names
  label: 348, // segment labels start here and grow outward
  gutter: (18 * Math.PI) / 180, // gap at the top where the ring names sit
};
const rdRingOrder = { handeln: 0, pruefen: 1, beobachten: 2, offen: 3 };
// All text is looked up at call time (catalog 'rd'), so a language switch never sees stale words.
const rdMeaning = (ring) => t(`rd.meaning.${ring}`);
/** Ring word in the current language, with "(Vorschlag)" when the engine proposed it. */
const rdRingText = (d) => (d.ring.source === 'engine' ? t('rd.proposal', { ring: RING[d.ring.ring].label }) : RING[d.ring.ring].label);
/** Fallback when the overview passes no numbers: Jetzt-handeln dots in score order. */
const rdDefaultNumbers = (items) => new Map(items.filter((d) => d.ring.ring === 'handeln').sort(byScore).map((d, i) => [d.e.id, i + 1]));
const RD_NS = 'http://www.w3.org/2000/svg';
const RD_SWEEP_MS = 1000; // one short pass; keep in sync with .rd-beam.is-on in radar.css

const RD_OLD_DAYS = 90; // on the radar for longer than this: drawn paler ("schon länger bekannt")

class Radar {
  constructor(host, handlers) {
    this.host = host;
    this.h = handlers;
    this.key = '';
    this.dots = new Map();
    this.pos = {};
    this.items = null;
    this.opts = {};
    this.numbers = new Map();
    this.k = 1.2; // viewBox units per CSS pixel, kept current by a ResizeObserver
    this.zoom = 1; // below ~470 px the drawing shrinks a little inside the box, so labels keep room
    this.vb = RG.vb;
    this.timers = [];
    host.innerHTML = '';
    this.svg = document.createElementNS(RD_NS, 'svg');
    this.svg.setAttribute('viewBox', `${RG.vb.x} ${RG.vb.y} ${RG.vb.w} ${RG.vb.h}`);
    this.svg.setAttribute('role', 'group');
    this.svg.setAttribute('aria-label', t('rd.aria'));
    this.gStatic = document.createElementNS(RD_NS, 'g');
    this.gTrails = document.createElementNS(RD_NS, 'g');
    this.gFocusTrail = document.createElementNS(RD_NS, 'g');
    this.gDots = document.createElementNS(RD_NS, 'g');
    this.svg.append(this.gStatic, this.gTrails, this.gFocusTrail, this.gDots);
    this.beam = document.createElement('div');
    this.beam.className = 'rd-beam';
    this.beam.hidden = true;
    this.labels = document.createElement('div');
    this.labels.className = 'radar-labels';
    host.append(this.svg, this.beam, this.labels);
    this.measure();
    this.bind();
    Focus.on('radar', (f) => this.applyFocus(f));
  }

  pct(x, y) { return `left:${((x - this.vb.x) / this.vb.w) * 100}%;top:${((y - this.vb.y) / this.vb.h) * 100}%`; }

  zoomFor(w) { return !w ? 1 : w < 400 ? 1.2 : w < 470 ? 1.12 : 1; }

  setZoom() {
    const z = this.zoomFor(this.host.clientWidth);
    this.zoom = z;
    this.vb = { x: RG.vb.x * z, y: RG.vb.y * z, w: RG.vb.w * z, h: RG.vb.h * z };
    this.svg.setAttribute('viewBox', `${this.vb.x} ${this.vb.y} ${this.vb.w} ${this.vb.h}`);
    this.beam.style.width = `${66 / z}%`;
  }

  angles(n) {
    const total = 2 * Math.PI - RG.gutter;
    const start = -Math.PI / 2 + RG.gutter / 2;
    const span = total / n;
    return { start, span, total, of: (i) => [start + i * span, start + (i + 1) * span] };
  }

  /** Units per pixel → --rd-k, so text and markers inside the SVG keep a constant screen size. */
  measure() {
    const w = this.host.clientWidth;
    if (!w) return false;
    const k = this.vb.w / w;
    const changed = Math.abs(k - this.k) / this.k > 0.08;
    this.k = k;
    this.host.style.setProperty('--rd-k', k.toFixed(3));
    return changed;
  }

  /** Static layer: segments, rings, spokes, labels. Rebuilt on every update (cheap). */
  build(domainIds, coverage, counts, selected) {
    const key = `${I18N.lang}|${domainIds.join(',')}`; // the language is part of the key: never reuse old labels
    const P = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
    const f = (n) => n.toFixed(2);
    const arc = (r0, r1, a0, a1) => {
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const [x0, y0] = P(r0, a0); const [x1, y1] = P(r1, a0); const [x2, y2] = P(r1, a1); const [x3, y3] = P(r0, a1);
      return `M${f(x0)} ${f(y0)}L${f(x1)} ${f(y1)}A${r1} ${r1} 0 ${large} 1 ${f(x2)} ${f(y2)}L${f(x3)} ${f(y3)}A${r0} ${r0} 0 ${large} 0 ${f(x0)} ${f(y0)}Z`;
    };
    const line = (r, a0, a1) => { const [x0, y0] = P(r, a0); const [x1, y1] = P(r, a1); return `M${f(x0)} ${f(y0)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f(x1)} ${f(y1)}`; };
    const n = domainIds.length;
    this.counts = counts;
    this.lastBuild = [domainIds, coverage, counts, selected];
    this.setZoom();
    this.measure();
    this.svg.setAttribute('aria-label', t('rd.aria'));
    if (!n) { this.gStatic.innerHTML = ''; this.labels.innerHTML = ''; this.key = key; return; }
    const A = this.angles(n);
    this.A = A;
    this.domainIds = domainIds;
    const full = [A.start, A.start + A.total];
    let s = '<defs><pattern id="rd-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="rd-hatch-line" x1="0" y1="0" x2="0" y2="10"/></pattern></defs>';
    domainIds.forEach((id, i) => {
      const [a0, a1] = A.of(i);
      const unsearched = coverage[id]?.searched === false;
      const fill = unsearched ? 'url(#rd-hatch)' : i % 2 ? 'var(--radar-seg-b)' : 'var(--radar-seg-a)';
      s += `<path class="seg${unsearched ? ' is-unsearched' : ''}" data-dom="${id}" data-hot-domain="${id}" d="${arc(34, 286, a0, a1)}" fill="${fill}"/>`;
      s += `<path class="seg seg--outer" data-dom="${id}" data-hot-domain="${id}" d="${arc(294, 330, a0, a1)}" fill="transparent"/>`;
      if (selected === id) s += `<path class="rd-selected" d="${arc(34, 330, a0, a1)}"/>`;
    });
    // The inner band carries the decision: a quiet red wash and a stronger edge.
    s += `<path class="rd-core" d="${arc(34, 124, ...full)}"/>`;
    for (const r of RINGS) {
      const [r0, r1] = RG.bands[r.id];
      s += `<path class="rd-band" data-ring="${r.id}" style="--c:${ringColor(r.id)}" d="${arc(r0, r1, ...full)}"/>`;
    }
    for (const r of [124, 208, 286, 294, 330]) {
      s += `<path class="ringline${r === 124 ? ' is-core' : ''}${r === 330 ? ' is-open' : ''}" d="${line(r, ...full)}"/>`;
    }
    for (let i = 0; i <= n; i++) {
      const a = A.start + i * A.span;
      const [x0, y0] = P(34, a); const [x1, y1] = P(286, a); const [x2, y2] = P(294, a); const [x3, y3] = P(330, a);
      s += `<path class="spoke" d="M${f(x0)} ${f(y0)}L${f(x1)} ${f(y1)}M${f(x2)} ${f(y2)}L${f(x3)} ${f(y3)}"/>`;
    }
    // Group names (Technik / Markt / Umfeld) as quiet words on the rim, no brackets: three groups make
    // ten segments easier to read. Each name sits on the segment boundary nearest the group's middle,
    // so it never covers a segment label; on the lower half the path runs backwards to stay upright.
    const groups = [];
    domainIds.forEach((id, i) => {
      const g = DOMAIN[id].group;
      const last = groups.at(-1);
      if (last && last.g === g) last.to = i; else groups.push({ g, from: i, to: i });
    });
    groups.forEach((g, k) => {
      const a0 = A.of(g.from)[0]; const a1 = A.of(g.to)[1];
      const center = g.to > g.from ? A.of(g.from + Math.floor((g.to - g.from + 1) / 2))[0] : (a0 + a1) / 2;
      const [gx0, gy0] = P(RG.rim, center - 0.5); const [gx1, gy1] = P(RG.rim, center + 0.5);
      const lower = Math.sin(center) > 0.05;
      const d = lower ? `M${f(gx1)} ${f(gy1)}A${RG.rim} ${RG.rim} 0 0 0 ${f(gx0)} ${f(gy0)}` : `M${f(gx0)} ${f(gy0)}A${RG.rim} ${RG.rim} 0 0 1 ${f(gx1)} ${f(gy1)}`;
      s += `<path id="rd-grp-${k}" d="${d}" fill="none"/><text class="group-text" dominant-baseline="central"><textPath href="#rd-grp-${k}" startOffset="50%" text-anchor="middle">${esc(GROUPS[g.g].toUpperCase())}</textPath></text>`;
    });
    s += `<circle class="hub" r="${RG.hub}"/><circle class="hub-dot" r="4"/>`;
    this.gStatic.innerHTML = s;

    // HTML labels. Each one is anchored just outside the rim and grows away from the centre.
    let l = '';
    domainIds.forEach((id, i) => {
      const [a0, a1] = A.of(i);
      const am = (a0 + a1) / 2;
      const ax = Math.cos(am); const ay = Math.sin(am);
      const [x, y] = P(RG.label, am);
      const c = counts[id] || 0;
      const align = ax > 0.35 ? 'left' : ax < -0.35 ? 'right' : 'center';
      const side = ay < -0.35 ? 'top' : 'bottom'; // the per-ring counts open outward, the name never moves
      const aria = t('rd.seg.aria', { domain: DOMAIN[id].label, count: c ? tn('units.entwicklung', c) : t('rd.count.none') });
      l += `<button type="button" class="seg-label" data-dom="${id}" data-hot-domain="${id}" data-align="${align}" data-side="${side}" aria-pressed="${selected === id}" aria-label="${esc(aria)}" style="${this.pct(x, y)};--ax:${ax.toFixed(3)};--ay:${ay.toFixed(3)};text-align:${align}" title="${esc(t('rd.seg.title', { full: DOMAIN[id].full }))}">${esc(DOMAIN[id].label)}<small aria-hidden="true"></small></button>`;
      const cov = coverage[id];
      const [nx, ny] = P(170, am);
      // Only the unsearched hatch gets a word; an empty searched segment is visibly empty.
      if (cov && cov.searched === false) l += `<span class="seg-note is-unsearched" style="${this.pct(nx, ny)}">${esc(t('rd.seg.unsearched'))}</span>`;
    });
    for (const r of RINGS) {
      const [r0, r1] = RG.bands[r.id];
      l += `<span class="ring-tick" data-hot-ring="${r.id}" data-ring="${r.id}" style="${this.pct(0, -(r0 + r1) / 2)};--c:${ringColor(r.id)}">${esc(r.tick)}</span>`;
    }
    this.labels.innerHTML = l;
    this.key = key;
    this.applyFocus(Focus.current);
  }

  sizeOf(d) {
    const base = d.weighted == null ? 8 : 6 + d.weighted * 2.3;
    return d.fb?.state === 'irrelevant' ? base * 0.75 : base;
  }

  /** Drawn radius: numbered dots never shrink below ~8.5 px on screen, so the number stays legible. */
  radiusOf(d) {
    const s = this.sizeOf(d);
    return this.numbers.has(d.e.id) ? Math.max(s, 8.5 * this.k) : s;
  }

  /** Deterministic placement: even spread inside each (domain × ring) cell, then a short relaxation. */
  layout(items) {
    const A = this.A;
    const n = this.domainIds.length;
    const cells = new Map();
    for (const d of items) {
      const k = `${d.e.domain}|${d.ring.ring}`;
      if (!cells.has(k)) cells.set(k, []);
      cells.get(k).push(d);
    }
    const pos = {};
    for (const [k, list] of cells) {
      const [dom, ring] = k.split('|');
      const i = this.domainIds.indexOf(dom);
      if (i < 0 || !RG.bands[ring]) continue;
      const [a0, a1] = A.of(i);
      const [r0, r1] = RG.bands[ring];
      const rMid = (r0 + r1) / 2;
      const gutterPad = (r) => Math.asin(Math.min(1, 36 / r));
      list.sort((a, b) => this.sizeOf(b) - this.sizeOf(a) || a.e.id.localeCompare(b.e.id));
      list.forEach((d, j) => {
        const size = this.radiusOf(d);
        const rr = list.length > 1 ? rMid + (j % 2 ? 1 : -1) * (r1 - r0) * 0.18 : rMid;
        const padL = Math.asin(Math.min(1, (size + 4) / rr)) + (i === 0 ? gutterPad(rr) : 0);
        const padR = Math.asin(Math.min(1, (size + 4) / rr)) + (i === n - 1 ? gutterPad(rr) : 0);
        const lo = a0 + padL; const hi = Math.max(lo, a1 - padR);
        const a = lo + ((j + 1) / (list.length + 1)) * (hi - lo);
        pos[d.e.id] = { x: rr * Math.cos(a), y: rr * Math.sin(a), size, lo, hi, r0, r1 };
      });
    }
    const ids = Object.keys(pos);
    for (let it = 0; it < 80; it++) {
      let moved = false;
      for (let x = 0; x < ids.length; x++) {
        for (let y = x + 1; y < ids.length; y++) {
          const p = pos[ids[x]]; const q = pos[ids[y]];
          const dx = q.x - p.x; const dy = q.y - p.y;
          const dist = Math.hypot(dx, dy) || 0.01;
          const min = p.size + q.size + 4;
          if (dist < min) {
            const push = (min - dist) / 2;
            p.x -= (dx / dist) * push; p.y -= (dy / dist) * push;
            q.x += (dx / dist) * push; q.y += (dy / dist) * push;
            moved = true;
          }
        }
      }
      for (const id of ids) {
        const p = pos[id];
        let rho = Math.hypot(p.x, p.y);
        let ang = Math.atan2(p.y, p.x);
        while (ang < p.lo - Math.PI) ang += 2 * Math.PI;
        while (ang > p.lo + Math.PI) ang -= 2 * Math.PI;
        ang = Math.min(p.hi, Math.max(p.lo, ang));
        const rmin = p.r0 + p.size + 2; const rmax = p.r1 - p.size - 2;
        rho = rmin > rmax ? (p.r0 + p.r1) / 2 : Math.min(rmax, Math.max(rmin, rho));
        p.x = rho * Math.cos(ang); p.y = rho * Math.sin(ang);
      }
      if (!moved) break;
    }
    return pos;
  }

  /** Keyed update: existing dots glide to their new place, new ones pop in (short), removed ones fade.
   *  opts: { initial, showChanges, numbers: Map<entwicklungId, n> } */
  update(items, opts = {}) {
    if (!this.A) return;
    this.measure();
    this.opts = { showChanges: !!opts.showChanges, numbers: opts.numbers };
    this.numbers = opts.numbers instanceof Map ? opts.numbers : rdDefaultNumbers(items);
    const pos = this.layout(items);
    const seen = new Set();
    let order = 0;
    const sorted = [...items].sort((a, b) => rdRingOrder[a.ring.ring] - rdRingOrder[b.ring.ring]);
    const k = this.k;
    for (const d of sorted) {
      const p = pos[d.e.id];
      if (!p) continue;
      const id = d.e.id;
      seen.add(id);
      let g = this.dots.get(id);
      if (!g) {
        g = document.createElementNS(RD_NS, 'g');
        g.setAttribute('class', 'dot is-entering');
        g.setAttribute('tabindex', '0');
        g.setAttribute('role', 'button');
        g.dataset.id = id;
        g.dataset.hot = id;
        g.innerHTML = '<circle class="hit"/><circle class="halo"/><g class="rd-body"><circle class="pulse"/><circle class="rd-new"/><circle class="mark"/><text class="rd-num" text-anchor="middle" dominant-baseline="central"></text></g>';
        g.style.setProperty('--delay', `${Math.min(order, 4) * 12}ms`);
        g.addEventListener('animationend', (ev) => {
          if (ev.animationName === 'rd-dot-in') g.classList.remove('is-entering');
          if (ev.animationName === 'pulse') g.classList.remove('is-ping');
        });
        g.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)`;
        this.gDots.append(g);
        this.dots.set(id, g);
        order++;
      }
      const n = this.numbers.get(id);
      const showNew = d.isNew; // new is always marked (blue ring), not only while changes are shown
      // Age at a glance: new = blue ring, on the radar for a while (over RD_OLD_DAYS) = paler fill.
      const age = d.firstSeen ? (store.derived.now - d.firstSeen) / 864e5 : null;
      g.dataset.age = d.isNew ? 'new' : age != null && age > RD_OLD_DAYS ? 'old' : 'mid';
      g.classList.toggle('is-lens', d.isNew);
      g.dataset.ring = d.ring.ring;
      g.style.setProperty('--c', ringColor(d.ring.ring));
      g.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)`;
      g.classList.toggle('is-muted', d.fb?.state === 'irrelevant');
      g.classList.toggle('is-new', showNew);
      g.classList.toggle('is-numbered', !!n);
      g.classList.toggle('is-selected', store.ui.route?.e === id);
      g.classList.toggle('is-ghost', opts.ghostId === id); // open in the detail but hidden by a filter
      const change = d.isNew ? t('rd.dot.isNew') : d.moved && d.prevRing ? t('rd.dot.before', { ring: RING[d.prevRing].label }) : '';
      const label = [t('rd.dot.aria', { title: d.e.title, ring: rdRingText(d), conf: T.confidence[d.conf.level], domain: domainText(d.e.domain) }), change].filter(Boolean).join(' ');
      g.setAttribute('aria-label', n ? t('rd.dot.numbered', { n, text: label }) : label);
      const [hit, halo, body] = g.children;
      const [pulse, ring, mark, num] = body.children;
      const r = p.size;
      hit.setAttribute('r', Math.max(r + 5 * k, 11 * k).toFixed(1));
      halo.setAttribute('r', (r + 5 * k).toFixed(1));
      pulse.setAttribute('r', r.toFixed(1));
      ring.setAttribute('r', (r + 3.5 * k).toFixed(1));
      mark.setAttribute('r', r.toFixed(1));
      mark.style.r = `${r.toFixed(1)}px`;
      num.textContent = n ? String(n) : '';
    }
    for (const [id, g] of this.dots) {
      if (seen.has(id)) continue;
      this.dots.delete(id);
      g.classList.add('is-leaving');
      g.removeAttribute('data-hot');
      setTimeout(() => g.remove(), 260);
    }
    this.pos = pos;
    this.items = items;
    this.drawTrails(this.opts.showChanges);
    this.markSelected();
    this.markLens();
    this.applyFocus(Focus.current);
  }

  /** "Neu" lens (button above the radar): everything else steps back, new items get their title. */
  markLens() {
    const on = !!store.ui.lensNew && (this.items || []).some((d) => d.isNew);
    this.host.classList.toggle('lens-new', on);
    for (const el of this.labels.querySelectorAll('.rd-newlabel')) el.remove();
    if (!on) return;
    for (const d of this.items.filter((x) => x.isNew)) {
      const p = this.pos?.[d.e.id];
      if (!p || d.e.id === store.ui.route?.e) continue;
      const left = p.x < 0;
      const el = document.createElement('span');
      el.className = 'rd-newlabel';
      el.dataset.side = left ? 'left' : 'right';
      el.setAttribute('aria-hidden', 'true');
      el.textContent = d.e.title;
      el.setAttribute('style', this.pct(p.x + (left ? -1 : 1) * (p.size + 8 * this.k), p.y));
      this.labels.append(el);
    }
  }

  /** The open detail's development stands out: its dot grows with a ring, the others step back, its
   *  segment is tinted and its title sits next to the dot. So it is always clear what the panel shows. */
  markSelected() {
    const sel = store.ui.route?.e;
    const p = sel && this.pos?.[sel];
    const d = p && this.items?.find((x) => x.e.id === sel);
    this.host.classList.toggle('has-selection', !!d);
    for (const el of this.gStatic.querySelectorAll('.seg')) el.classList.toggle('is-selected', !!d && el.dataset.dom === d.e.domain);
    let call = this.labels.querySelector('.rd-callout');
    if (!d) { call?.remove(); return; }
    if (!call) {
      call = document.createElement('span');
      call.className = 'rd-callout';
      call.setAttribute('aria-hidden', 'true'); // the panel title is the accessible name; this is a visual pointer
      this.labels.append(call);
    }
    call.textContent = d.e.title;
    const left = p.x < 0;
    call.dataset.side = left ? 'left' : 'right';
    call.setAttribute('style', this.pct(p.x + (left ? -1 : 1) * (p.size * 1.3 + 9 * this.k), p.y));
  }

  oldPosition(d) {
    const p = this.pos[d.e.id];
    if (!p || !d.prevRing || !RG.bands[d.prevRing]) return null;
    const [r0, r1] = RG.bands[d.prevRing];
    const ang = Math.atan2(p.y, p.x);
    const r = (r0 + r1) / 2;
    return { x: r * Math.cos(ang), y: r * Math.sin(ang) };
  }

  /** One trail: hollow marker where the dot was last week, a fading line to where it is now. */
  trailSvg(d, i) {
    const p = this.pos[d.e.id]; const o = this.oldPosition(d);
    if (!p || !o) return '';
    const f = (n) => n.toFixed(1);
    const len = Math.ceil(Math.hypot(p.x - o.x, p.y - o.y));
    return `<g class="rd-trail" data-id="${d.e.id}" style="--c:${ringColor(d.ring.ring)};--from:${ringColor(d.prevRing)}">`
      + `<linearGradient id="rd-tg-${i}" gradientUnits="userSpaceOnUse" x1="${f(o.x)}" y1="${f(o.y)}" x2="${f(p.x)}" y2="${f(p.y)}"><stop offset="0" class="rd-stop-a"/><stop offset="1" class="rd-stop-b"/></linearGradient>`
      + `<path class="trail" style="--len:${len}" stroke="url(#rd-tg-${i})" d="M${f(o.x)} ${f(o.y)}L${f(p.x)} ${f(p.y)}"/>`
      + `<circle class="rd-trail-from" cx="${f(o.x)}" cy="${f(o.y)}" r="${f(4 * this.k)}"/></g>`;
  }

  drawTrails(show) {
    this.gTrails.classList.remove('is-drawing');
    if (!show || !this.items) { this.gTrails.innerHTML = ''; return; }
    this.gTrails.innerHTML = this.items.filter((d) => d.moved).map((d, i) => this.trailSvg(d, i)).join('');
  }

  /** The trail of one hovered dot, when trails are off. */
  focusTrail(id) {
    const d = id && !this.opts.showChanges ? this.items?.find((x) => x.e.id === id && x.moved) : null;
    this.gFocusTrail.innerHTML = d ? this.trailSvg(d, 'f') : '';
  }

  /** One beam rotation (~1.4 s). New dots ping as the beam passes; nothing waits for it. */
  sweep() {
    if (reducedMotion() || !this.items || !this.A) return;
    this.timers.forEach(clearTimeout);
    this.timers = [];
    const b = this.beam;
    b.hidden = false;
    b.classList.remove('is-on');
    void b.offsetWidth;
    b.classList.add('is-on');
    const start = -Math.PI / 2;
    for (const d of this.items) {
      const p = this.pos[d.e.id]; const g = this.dots.get(d.e.id);
      if (!p || !g) continue;
      let a = Math.atan2(p.y, p.x) - start;
      while (a < 0) a += 2 * Math.PI;
      const at = (a / (2 * Math.PI)) * RD_SWEEP_MS;
      this.timers.push(setTimeout(() => {
        g.classList.add('is-lit');
        this.timers.push(setTimeout(() => g.classList.remove('is-lit'), 420));
        if (d.isNew) this.ping(g);
      }, at));
    }
    this.timers.push(setTimeout(() => { b.classList.remove('is-on'); b.hidden = true; }, RD_SWEEP_MS + 60));
  }

  ping(g) {
    g.classList.remove('is-ping');
    void g.getBoundingClientRect();
    g.classList.add('is-ping');
  }

  /** "Woche abspielen": moved dots start at last week's ring and glide to today's, plus one sweep. */
  replay() {
    if (reducedMotion() || !this.items) return;
    const moved = this.items.filter((d) => d.moved);
    for (const d of moved) {
      const g = this.dots.get(d.e.id); const o = this.oldPosition(d);
      if (!g || !o) continue;
      g.style.transition = 'none';
      g.style.transform = `translate(${o.x.toFixed(1)}px, ${o.y.toFixed(1)}px)`;
    }
    this.svg.getBoundingClientRect();
    requestAnimationFrame(() => {
      for (const d of moved) {
        const g = this.dots.get(d.e.id); const p = this.pos[d.e.id];
        if (!g || !p) continue;
        g.style.transition = 'transform 1100ms var(--ease-out)';
        g.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)`;
        setTimeout(() => { g.style.transition = ''; }, 1150);
      }
      this.drawTrails(true);
      this.gTrails.classList.add('is-drawing');
      if (!this.opts.showChanges) this.timers.push(setTimeout(() => this.drawTrails(false), 2600));
    });
    this.sweep();
  }

  /** Per-ring counts of one domain, in words: "2 handeln · 1 prüfen". */
  segCounts(dom) {
    const list = visible({ domain: false }).filter((d) => d.e.domain === dom);
    const parts = RINGS.map((r) => [r.id, list.filter((d) => d.ring.ring === r.id).length]).filter(([, c]) => c);
    if (!parts.length) return html`${t('rd.count.none')}`;
    return html`${parts.map(([id, c]) => html`<span class="rd-rc" style="--c:${ringColor(id)}">${tn(`rd.count.${id}`, c)}</span>`)}`;
  }

  /** Focus bus subscriber: dim what is outside the focus, light up what is inside. */
  applyFocus(f) {
    const on = !!f;
    this.host.classList.toggle('has-focus', on);
    for (const [id, g] of this.dots) g.classList.toggle('is-hot', on && f.ids.has(id));
    for (const tr of this.gTrails.children) tr.classList.toggle('is-hot', on && f.ids.has(tr.dataset.id));
    const dom = on && f.kind === 'domain' ? f.key : null;
    const ring = on && f.kind === 'ring' ? f.key : null;
    for (const el of this.gStatic.querySelectorAll('.seg')) el.classList.toggle('is-tinted', el.dataset.dom === dom);
    for (const el of this.gStatic.querySelectorAll('.rd-band')) el.classList.toggle('is-on', el.dataset.ring === ring);
    for (const el of this.labels.querySelectorAll('.ring-tick')) el.classList.toggle('is-on', el.dataset.ring === ring);
    for (const el of this.labels.querySelectorAll('.seg-label')) {
      const hit = el.dataset.dom === dom;
      const sm = el.querySelector('small');
      if (el.classList.contains('is-focus') === hit) continue;
      el.classList.toggle('is-focus', hit);
      if (sm) sm.innerHTML = hit ? esc(this.segCounts(dom)) : '';
    }
    this.focusTrail(on && f.kind === 'entwicklung' ? f.key : null);
  }

  /** Kept for callers of the old API: focus one dot (or none). */
  highlight(id) { if (id) Focus.set('entwicklung', id); else Focus.clear(0); }

  /** Dots in reading order for arrow keys: numbered first, then ring by ring, clockwise. */
  order() {
    const start = this.A ? this.A.start : -Math.PI / 2;
    const ang = (p) => { let a = Math.atan2(p.y, p.x) - start; while (a < 0) a += 2 * Math.PI; return a; };
    const by = store.derived.byId;
    return [...this.dots.keys()].filter((id) => this.pos[id] && by[id]).sort((a, b) => {
      const na = this.numbers.get(a) ?? 99; const nb = this.numbers.get(b) ?? 99;
      return na - nb || rdRingOrder[by[a].ring.ring] - rdRingOrder[by[b].ring.ring] || ang(this.pos[a]) - ang(this.pos[b]);
    });
  }

  /** Level-3 card for one dot, four rows: title, ring word and move, so-what (2 lines), one meta
   *  (short deadline · confidence). The key hint shows on keyboard focus only. */
  showTip(g, viaKey) {
    const d = store.derived.byId[g.dataset.id];
    const tip = $('#tip');
    if (!d || !tip) return;
    const n = this.numbers.get(d.e.id);
    const conf = t('rd.tip.conf', { conf: T.confidence[d.conf.level] });
    const due = dueShort(d);
    const age = d.isNew ? t('rd.tip.new') : d.firstSeen ? t('rd.tip.since', { date: d.firstSeen.toLocaleDateString(locale(), { month: 'long', year: 'numeric' }) }) : '';
    tip.className = 'tip rd-tip';
    tip.innerHTML = esc(html`
      <strong class="rd-tip-title">${n ? html`<span class="rd-tip-num">${n}</span>` : ''}${d.e.title}</strong>
      <div class="rd-tip-top">${ringLabel(d.ring.ring, rdRingText(d))}${moveLabel(d)}</div>
      ${d.e.soWhat ? html`<p class="rd-tip-so">${d.e.soWhat}</p>` : ''}
      <p class="rd-tip-meta">${due ? t('rd.tip.meta', { due, conf }) : conf}</p>
      ${age ? html`<p class="rd-tip-age ${d.isNew ? 'is-new' : ''}">${age}</p>` : ''}
      ${viaKey ? html`<p class="rd-tip-hint">${t('rd.tip.enter')}</p>` : ''}`);
    this.placeTip(tip, g.querySelector('.mark').getBoundingClientRect());
  }

  /** Small card for a ring tick: the ring and what it means. */
  showRingTip(el) {
    const tip = $('#tip');
    const id = el.dataset.ring;
    if (!tip || !RING[id]) return;
    tip.className = 'tip rd-tip rd-tip--ring';
    tip.innerHTML = esc(html`<div class="rd-tip-top">${ringLabel(id)}</div><p class="rd-tip-so">${rdMeaning(id)}</p>`);
    this.placeTip(tip, el.getBoundingClientRect());
  }

  /** Right of the anchor if it fits, else left, else below/above. Always inside the viewport. */
  placeTip(tip, r) {
    if (!r.width && !r.height) { tip.classList.remove('is-visible'); return; } // anchor not rendered (radar collapsed)
    const m = 12; const gap = 14;
    const vw = window.innerWidth; const vh = window.innerHeight;
    const tw = tip.offsetWidth; const th = tip.offsetHeight;
    let left; let top; let origin;
    if (r.right + gap + tw <= vw - m) { left = r.right + gap; origin = 'left center'; }
    else if (r.left - gap - tw >= m) { left = r.left - gap - tw; origin = 'right center'; }
    if (left != null) top = Math.max(m, Math.min(vh - th - m, r.top + r.height / 2 - Math.min(th / 2, 40)));
    else {
      left = Math.max(m, Math.min(vw - tw - m, r.left + r.width / 2 - tw / 2));
      const below = r.bottom + gap + th <= vh - m;
      top = below ? r.bottom + gap : Math.max(m, r.top - gap - th);
      origin = below ? 'center top' : 'center bottom';
    }
    tip.style.left = `${Math.round(left)}px`;
    tip.style.top = `${Math.round(top)}px`;
    tip.style.transformOrigin = origin;
    tip.classList.add('is-visible');
  }

  hideTip() { $('#tip')?.classList.remove('is-visible'); }

  bind() {
    const dotOf = (ev) => ev.target.closest?.('.dot');
    this.svg.addEventListener('pointerover', (ev) => { const g = dotOf(ev); if (g && g.dataset.hot) this.showTip(g, false); });
    this.svg.addEventListener('pointerout', (ev) => { const g = dotOf(ev); if (g && !g.contains(ev.relatedTarget)) this.hideTip(); });
    this.svg.addEventListener('focusin', (ev) => { const g = dotOf(ev); if (g) this.showTip(g, g.matches(':focus-visible')); });
    this.svg.addEventListener('focusout', () => this.hideTip());
    this.svg.addEventListener('click', (ev) => {
      const g = dotOf(ev);
      if (g) { this.hideTip(); this.h.open(g.dataset.id); return; }
      const seg = ev.target.closest('.seg');
      if (seg) this.h.segment(seg.dataset.dom);
    });
    this.svg.addEventListener('keydown', (ev) => {
      const g = dotOf(ev);
      if (!g) return;
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); this.hideTip(); this.h.open(g.dataset.id); return; }
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[ev.key];
      if (!step && ev.key !== 'Home' && ev.key !== 'End') return;
      ev.preventDefault();
      const ids = this.order();
      const i = ids.indexOf(g.dataset.id);
      const j = ev.key === 'Home' ? 0 : ev.key === 'End' ? ids.length - 1 : (i + step + ids.length) % ids.length;
      this.dots.get(ids[j])?.focus();
    });
    this.labels.addEventListener('click', (ev) => { const b = ev.target.closest('.seg-label'); if (b) this.h.segment(b.dataset.dom); });
    this.labels.addEventListener('pointerover', (ev) => { const tick = ev.target.closest('.ring-tick'); if (tick) this.showRingTip(tick); });
    this.labels.addEventListener('pointerout', (ev) => { const tick = ev.target.closest('.ring-tick'); if (tick && !tick.contains(ev.relatedTarget)) this.hideTip(); });
    if ('ResizeObserver' in window) {
      this.ro = new ResizeObserver(() => {
        if (!document.contains(this.host)) { this.ro.disconnect(); return; }
        const rezoom = this.lastBuild && this.zoomFor(this.host.clientWidth) !== this.zoom;
        if (rezoom) this.build(...this.lastBuild);
        if ((this.measure() || rezoom) && this.items) this.update(this.items, { ...this.opts, initial: false });
      });
      this.ro.observe(this.host);
    }
  }

  /** Legend for the radar footer: the four ring words with their dots. Ring entries publish a ring
   *  focus on hover and keyboard focus. What is not obvious (size, new, trail) sits in the tooltip.
   *  compact: the short ring words (the same as the ticks). showChanges is kept for old callers. */
  static legendHtml({ compact = false } = {}) {
    const marks = t('rd.legend.title');
    return html`<div class="rd-legend ${compact ? 'rd-legend--compact' : ''}" role="list" aria-label="${t('rd.legend.aria')}" aria-description="${marks}" title="${marks}">${RINGS.map((r) => html`<span class="rd-key" role="listitem" tabindex="0" data-hot-ring="${r.id}" title="${rdMeaning(r.id)} ${marks}"><i class="rd-key-dot ${r.id === 'offen' ? 'is-open' : ''}" style="--c:${ringColor(r.id)}" aria-hidden="true"></i>${compact ? r.tick : r.label}</span>`)}</div>`;
  }
}

   Each view has mount(main) (first render) and update() (after a state change).
