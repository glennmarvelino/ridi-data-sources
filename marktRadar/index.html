actices prevent cost-effective repair or upgrades, and what requirements do operators, electricians, and public contractors have regarding spare part availability, component replacement, backward compatibility, and lifecycle costs?","focus":"Spare parts catalogs, repair and warranty terms, RFPs, product lifespans, service reports, and competing products. Identify specific weaknesses and their economic consequences.","primary":"M2","secondary":"T3","note":"","srcPrimary":"M2","indicator":""},{"id":"UC-Q07","n":7,"group":"UC-02","title":"Demographics and New Work Environments: For Which User Groups Are Requirements Changing?","question":"How are age-diverse workforces, hybrid work, changing space utilization, and varying visual needs altering the lighting requirements for offices and public buildings, and which specific product features are becoming relevant as a result for users, employers, and operators?","focus":"Workplace requirements, ergonomic studies, workplace concepts, user surveys, and public construction projects. Distinguish between documented user needs and merely presumed trends.","primary":"S","secondary":"M1","note":"","srcPrimary":"S","indicator":""},{"id":"UC-Q08","n":8,"group":"UC-02","title":"Lighting as a Service: Under what conditions do customers accept new business models?","question":"Which customer segments in the commercial lighting market are willing to procure lighting as a service rather than as a capital good, and which contract terms, savings guarantees, maintenance services, financing options, and responsibilities are key factors in their acceptance of this model over traditional product sales?","focus":"Existing service contracts, case studies, competitor offerings, customer references, and RFPs. Compare contract models, revenue streams, risks, and prerequisites for profitable implementation.","primary":"M3","secondary":"M2","note":"","srcPrimary":"M3","indicator":""},{"id":"UC-Q09","n":9,"group":"UC-05","title":"Sensors and AI: Which Technologies Deliver Measurable Added Value?","question":"Which combinations of presence and occupancy detection, daylight measurement, room-specific sensors, and adaptive lighting control have been proven to achieve additional energy savings in office, educational, and commercial buildings, and how do false triggers, data privacy, retrofitability, and integration costs affect the economic benefits?","focus":"Field tests, scientific studies, technical data sheets, reference projects, and manufacturer comparisons. Determine savings relative to a clearly defined baseline and identify pure manufacturer projections.","primary":"T2","secondary":"T1","note":"","srcPrimary":"T2","indicator":""},{"id":"UC-Q10","n":10,"group":"UC-05","title":"LEDs and Optics: Which innovations are pushing the boundaries of today’s products?","question":"Which new LED packages, driver architectures, optical materials, and light-guiding concepts enable significant improvements over current products in terms of system efficiency, glare control, color rendering, thermal stress, and service life—and which technological advances are already ready for mass production rather than merely proven in the lab?","focus":"Technical journals, patents, manufacturer data sheets, trade show innovations, and independent test reports. Compare efficiency at the system level—including driver losses—rather than just LED chip values.","primary":"T1","secondary":"T3","note":"","srcPrimary":"T1","indicator":""},{"id":"UC-Q11","n":11,"group":"UC-05","title":"Manufacturing: Which production innovations are economically viable?","question":"Which new manufacturing and quality assurance technologies—such as automated optical inspection, AI-based defect detection, flexible assembly, or additive manufacturing—can measurably reduce scrap, lead time, material consumption, or variant costs for which lighting components, and at what production volumes does their implementation become economically viable?","focus":"Manufacturing equipment manufacturers, automation case studies, trade shows, patents, and industrial pilot projects. Consider investment costs, integration efforts, production volumes, and payback period.","primary":"T3","secondary":"E","note":"","srcPrimary":"T3","indicator":""},{"id":"UC-Q12","n":12,"group":"UC-05","title":"Technology Transfer: Which innovations from other industries are transferable?","question":"Which technologies from the automotive industry and consumer electronics—such as compact power electronics, smart sensors, modular connectors, digital product diagnostics, or predictive maintenance—can be technically and economically applied to commercial lighting, and what adaptations are necessary due to service life, safety requirements, and operating conditions?","focus":"Patents, supplier portfolios, new components, cross-industry collaborations, and applications already implemented. Distinguish between technical transferability and commercial market readiness.","primary":"CI","secondary":"T1","note":"Quelldokument nennt in der Tabelle „CL“, in der Domänenübersicht „CI“ (Frage 12). Als CI geführt, bitte bestätigen.","srcPrimary":"CL","indicator":""},{"id":"UC-Q13","n":13,"group":"UC-09","title":"Installation and Maintenance: Which System Architectures Reduce Total Costs?","question":"Which alternative lighting and system concepts—such as tool-free installation, plugin electrical connections, decentralized drivers, continuous light strip systems, or centralized components—reduce installation and maintenance times in industrial facilities, and what impact do they have on the risk of failure, scalability, spare parts inventory, and total costs over the service life?","focus":"Installation manuals, electricians’ experiences, RFPs, time measurements for installation and maintenance, and competing products. Compare not only the purchase price but also the total cost.","primary":"T3","secondary":"M2","note":"","srcPrimary":"T3","indicator":""},{"id":"UC-Q14","n":14,"group":"UC-09","title":"Connected Lighting: Which System Combinations Create a Competitive Advantage?","question":"Which combinations of luminaires, sensors, lighting management, and building automation offer the greatest demonstrable added value in schools and offices in terms of energy consumption, room occupancy, maintenance requirements, and user comfort—and which minimum technical requirements for interfaces, data security, retrofitting, and system compatibility determine their practical suitability?","focus":"Reference projects, RFP processes, system integrators, building automation providers, and independent energy assessments. Examining specific system architectures and use cases rather than general smart-building trends.","primary":"T2","secondary":"M1","note":"","srcPrimary":"T2","indicator":""},{"id":"UC-Q15","n":15,"group":"UC-09","title":"From New Construction to Renovation: Which Business Opportunities Should RIDI Prioritize?","question":"Given the slowdown in new construction, which building segments, renovation projects, and customer groups offer RIDI the most attractive potential for additional business? And with which product, retrofit, and service offerings can the company cost-effectively modernize existing lighting systems without requiring customers to replace entire systems?","focus":"Construction and renovation statistics, building inventories and system ages, public renovation programs, tender volumes, competitor offers, and the RIDI product portfolio. Compare market potential, customer access, competition, and profitability by segment.","primary":"M3","secondary":"E","note":"","srcPrimary":"M3","indicator":""}]</script>

<script type="application/json" id="data-sources">{"categories":[],"records":[]}</script>

<script>
(() => {
  const dialog = document.getElementById('search');
  const input = document.getElementById('search-input');
  const panel = document.createElement('section');
  panel.style.padding = '0.75rem';
  const status = document.createElement('p');
  status.setAttribute('role', 'status');
  const list = document.createElement('ul');
  panel.append(status, list);
  dialog.append(panel);
  const de = () => document.documentElement.lang === 'de';
  const label = () => input.title = de() ? 'Enter: Qdrant durchsuchen' : 'Enter: Search Qdrant';
  label();
  new MutationObserver(label).observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  let request;
  function reset() {
    request?.abort();
    request = null;
    status.textContent = '';
    list.replaceChildren();
  }
  input.addEventListener('input', reset);
  dialog.addEventListener('close', reset);
  input.addEventListener('keydown', async (event) => {
    if (event.key !== 'Enter' || event.isComposing) return;
    event.preventDefault();
    event.stopPropagation();
    if (event.repeat) return;
    reset();
    const q = input.value.trim();
    if (!q) { status.textContent = de() ? 'Bitte Suchbegriff eingeben.' : 'Enter a search term.'; return; }
    const active = request = new AbortController();
    status.textContent = de() ? 'Suche läuft…' : 'Searching…';
    try {
      const response = await fetch('/api/qdrant/search', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({q}), signal:active.signal
      });
      if (!response.ok) throw new Error(String(response.status));
      const {items} = await response.json();
      if (request !== active) return;
      status.textContent = items.length ? (de() ? 'Qdrant · Quellen' : 'Qdrant · Sources') : (de() ? 'Keine Ergebnisse.' : 'No results.');
      for (const item of items) {
        const li = document.createElement('li');
        let url;
        try { const u = new URL(item.url); if (['https:', 'http:'].includes(u.protocol)) url = u.href; } catch {}
        const title = document.createElement(url ? 'a' : 'strong');
        title.textContent = item.title || item.source || 'Source';
        if (url) { title.href = url; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
        const detail = document.createElement('p');
        detail.textContent = [item.source, item.page ? 'p. ' + item.page : '', item.text].filter(Boolean).join(' · ');
        li.append(title, detail);
        list.append(li);
      }
    } catch (e) {
      if (request === active) status.textContent = de() ? 'Qdrant nicht erreichbar. Serverkonfiguration prüfen.' : 'Qdrant search unavailable. Check the server configuration.';
    }
  });
})();
</script>
